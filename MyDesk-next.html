  /* ── 图表手势：滚轮缩放 / 拖拽平移 ──────────────────────────────────
     这两种都是连续手势，中途整页 render() 会把 #chart-hit 换掉、后续事件
     就丢了。所以状态放在模块级变量里，重绘只替换 .chart-area，不重建页面。 */
  let chartDrag=null;
  function svgPointAt(svg,event){
    const W=Number(svg.dataset.chartWidth)||800;
    const point=svg.createSVGPoint?svg.createSVGPoint():null;
    if(point&&svg.getScreenCTM){
      point.x=event.clientX;point.y=event.clientY;
      const matrix=svg.getScreenCTM();
      if(matrix) return point.matrixTransform(matrix.inverse());
    }
    const bounds=svg.getBoundingClientRect();
    return {x:(event.clientX-bounds.left)/bounds.width*W,y:(event.clientY-bounds.top)/bounds.height*255};
  }
  /**
   * 图表主体为了不中断滚轮/拖拽手势，只会局部重绘；导航条在主体外面，
   * 因此必须单独把当前窗口状态同步回滑块、根数和左右按钮。
   */
  function syncChartNavigation(){
    const w=chartWindow(),max=Math.max(30,Math.min(360,w.total||30));
    const zoom=$('[data-chart-zoom]');
    if(zoom){
      zoom.max=String(max);
      zoom.value=String(Math.min(max,Math.max(30,w.zoom||S.chartZoom)));
      zoom.setAttribute('aria-valuenow',zoom.value);
      zoom.setAttribute('aria-valuetext','显示 '+(w.bars.length||0)+' 根');
    }
    const count=$('.chart-window-count');
    if(count)count.textContent='显示 '+(w.bars.length||0)+' 根';
    const older=$('[data-window="older"]'),newer=$('[data-window="newer"]');
    if(older)older.disabled=!(w.offset<w.maxOffset);
    if(newer)newer.disabled=!(w.offset>0);
  }
  function redrawChartArea(){
    const area=$('.chart-area');
    if(!area){render();return;}
    area.innerHTML=drawChart()+'<div class="chart-tooltip hidden" id="chart-tooltip"></div>';
    syncChartNavigation();
    bindChart();
  }
  // 缩放锚定在指针下方那根 K 线：缩放前后它停在原处，视觉上不会「跑掉」。
  function zoomChartAt(event,deltaY){
    const svg=$('#price-chart');if(!svg)return;
    const w=chartWindow();if(!w.total)return;
    const L=Number(svg.dataset.chartLeft)||12,iw=Number(svg.dataset.chartInnerWidth)||723;
    const ratio=Math.max(0,Math.min(1,(svgPointAt(svg,event).x-L)/iw));
    const anchor=Math.max(0,w.total-w.offset-w.zoom)+ratio*w.zoom;
    const zoom=Math.max(30,Math.min(360,Math.min(w.total,w.zoom+(deltaY<0?-20:20))));
    const offset=Math.max(0,Math.min(Math.max(0,w.total-zoom),Math.round(w.total-anchor-zoom*(1-ratio))));
    if(zoom===w.zoom&&offset===w.offset)return;
    S.chartZoom=zoom;S.chartOffset=offset;redrawChartArea();
  }
  function panChartTo(event){
    const svg=$('#price-chart');if(!svg||!chartDrag)return;
    const iw=Number(svg.dataset.chartInnerWidth)||723;
    const delta=Math.round((svgPointAt(svg,event).x-chartDrag.startX)/iw*chartDrag.zoom);
    const offset=Math.max(0,Math.min(Math.max(0,chartDrag.total-chartDrag.zoom),chartDrag.offset+delta));
    if(offset===S.chartOffset)return;
    S.chartOffset=offset;redrawChartArea();
  }
  function bindChart() {
    const hit=$('#chart-hit'),svg=$('#price-chart');if(!hit||!svg)return;
    const W=Number(svg.dataset.chartWidth)||800,L=Number(svg.dataset.chartLeft)||12,iw=Number(svg.dataset.chartInnerWidth)||723;
    const area=$('.chart-area');
    hit.style.cursor=chartDrag?'grabbing':'grab';
    // 滚轮缩放：向上放大（看更少根），向下缩小（看更多根）。
    svg.addEventListener('wheel',event=>{event.preventDefault();zoomChartAt(event,event.deltaY);},{passive:false});
    hit.addEventListener('pointerdown',event=>{
      if(event.button!=null&&event.button!==0)return;
      // 不 preventDefault 的话，浏览器会把"按住拖动"当成文本选择：拖 K 线时页面被选蓝。
      event.preventDefault();
      const w=chartWindow();
      chartDrag={startX:svgPointAt(svg,event).x,offset:w.offset,zoom:w.zoom,total:w.total};
      hit.style.cursor='grabbing';
    });
    hit.addEventListener('pointermove',e=>{
      if(chartDrag)return;   // 拖拽期间交给 document 级处理，避免重绘打断手势
      const svgBounds=svg.getBoundingClientRect(),areaBounds=area?area.getBoundingClientRect():svgBounds,svgPoint=svgPointAt(svg,e),xx=svgPoint.x,i=Math.max(0,Math.min(chartPoints.length-1,Math.round((xx-L)/iw*(chartPoints.length-1)))),b=chartPoints[i],tip=$('#chart-tooltip'),cross=$('#crosshair');
      const x=Math.max(L,Math.min(L+iw,xx));
      cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.classList.remove('hidden');
      tip.innerHTML=`<strong>${chartTimeLabel(b)}</strong> <span class="muted">USDT · ${chartIntervalLabels[S.chartInterval]}</span><br>开 ${b.open.toFixed(2)} · 高 ${b.high.toFixed(2)}<br>低 ${b.low.toFixed(2)} · 收 ${b.close.toFixed(2)}`;tip.classList.remove('hidden');
      const tipWidth=tip.offsetWidth||150,tipLeft=Math.max(8,Math.min(areaBounds.width-tipWidth-8,(e.clientX-areaBounds.left)+14));
      tip.style.left=tipLeft+'px';tip.style.top=Math.max(8,(e.clientY-areaBounds.top)-tip.offsetHeight-12)+'px';
    });
    hit.addEventListener('pointerleave',()=>{$('#chart-tooltip').classList.add('hidden');$('#crosshair').classList.add('hidden');});
  }
  document.addEventListener('pointermove',event=>{if(chartDrag)panChartTo(event);});
  document.addEventListener('pointerup',()=>{
    if(!chartDrag)return;
    chartDrag=null;
    const hit=$('#chart-hit');if(hit)hit.style.cursor='grab';
  });
  function changeDate(date) {
    if(!E.isValidLocalDate(date)||date<minDate()||date>maxDate()) {toast('超出当前数据区间','请选择 '+minDate()+' 至 '+maxDate()+'。',true);render();return;}
    S.date=date;openView();render();maybeShowVerdict();refreshThesisReviews();
  }
  const chartIntervalLabels={ '1H':'1小时', '4H':'4小时', '1D':'日K' };
  const chartIntervalHints={ '1H':'1 小时 K 线', '4H':'4 小时 K 线', '1D':'日 K' };
  let chartRequestId=0;
  function chartLimitFor(interval) { return interval==='1H'?480:interval==='4H'?360:240; }
  async function loadIntradayChart() {
    const requestId=++chartRequestId, symbol=currentSymbol(), interval=S.chartInterval;
    if (!['1H','4H'].includes(interval) || !symbol) return;
    if (typeof location !== 'undefined' && location.protocol === 'file:') {
      S.chartLoading=false;S.chartError='1小时和4小时 K 线需要通过 http://127.0.0.1:4173/ 调用 Bitget Agent Hub 后端。';render();return;
    }
    S.chartLoading=true;S.chartError=null;render();
    try {
      const response=await fetch('/api/agent-hub/rtoken-chart?symbol='+encodeURIComponent(symbol)+'&interval='+encodeURIComponent(interval)+'&limit='+chartLimitFor(interval),{signal:AbortSignal.timeout(45000)});
      const payload=await response.json();
      if (!response.ok) throw Error(payload.error||'Bitget '+chartIntervalHints[interval]+'读取失败');
      if (!Array.isArray(payload.bars)) throw Error('Bitget 返回的 K 线格式不完整');
      if (requestId!==chartRequestId || S.chartInterval!==interval || currentSymbol()!==symbol) return;
      S.intradayChart={symbol,interval,bars:payload.bars.filter(b=>b&&b.is_closed!==false),fetched_at:payload.fetched_at};
      S.chartOffset=0;
    } catch(e) {
      if (requestId!==chartRequestId || S.chartInterval!==interval || currentSymbol()!==symbol) return;
      S.intradayChart=null;S.chartError=(e&&e.message)?e.message:String(e);
    } finally {
      if (requestId===chartRequestId) {S.chartLoading=false;render();}
    }
  }
  function changeChartInterval(interval) {
    if (!['1H','4H','1D'].includes(interval) || S.chartInterval===interval) return;
    S.chartInterval=interval;S.chartOffset=0;S.chartError=null;S.intradayChart=null;
    if (interval==='1D') {chartRequestId+=1;S.chartLoading=false;S.intradayChart=null;render();return;}
    loadIntradayChart();
  }
  function adjustChartWindow(kind) {
    const total=chartHistory().length;
    if (!total) return;
    if(kind==='older') S.chartOffset=Math.min(Math.max(0,total-S.chartZoom),S.chartOffset+Math.max(8,Math.round(S.chartZoom*.35)));
    if(kind==='newer') S.chartOffset=Math.max(0,S.chartOffset-Math.max(8,Math.round(S.chartZoom*.35)));
    if(kind==='in') S.chartZoom=Math.max(30,S.chartZoom-20);
    if(kind==='out') S.chartZoom=Math.min(360,Math.min(total,S.chartZoom+20));
    render();
  }
  function save(opts) {
    if(S.saving)return;
    const f=form();
    if(!f.text.trim()){toast('先写下此刻的判断','理由比一个方向更有价值。',true);return;}
    // 多想一步：这段判断还没让「说清楚」看过（或看过又改了），这次点保存先去看，看完再点一次才存
    if(!(opts&&opts.force)&&psGate(f))return;
    const d=context();if(!d)return;
    S.saving=true;
    // 界面上已经没有手选立场了：保存时统一用「从原话里读出来的」那一个
    // （「读一遍」给过就用它给的，没给过就按规则从原话推）
    const stance=psStance(f,f.rawText||f.text).stance;
    const res=service.confirm_card({
      context_id:d.ctx.context_id,
      draft_id:null,
      idempotency_key:d.key,
      raw_input:f.rawText||f.text,
      judgment_text:f.text.trim(),
      stance:stance,
      chart_interval:S.chartInterval,
      // 新判断不再建立独立的机械条件表；后续行情复核直接沿 raw_input 理解用户写下的信号。
      conditions:[],
      precise_readings:(f.readings||[]).slice(0,4),
      conditions_confirmed:true,
    });
    S.saving=false;
    if(!res.ok){toast('判断未能保存',res.error.message,true);return;}
    if(f.parent){S.links[res.data.card_id]=f.parent;write('mydesk.next.links',S.links);}
    delete S.drafts[draftKey()];S.memoryDrafts.delete(draftKey());persistDraft();openView();render();
    toast('判断与快照已保存',`${currentSymbol()} · ${S.date}。${storage?'原话和当时的事实已写入本地。':'仅保存在本次会话，请导出备份。'}`);
  }

  /* ── 市场裁决 · 界面（《03》§6、《04》§9–§10）──────────────────────────
     类名一律 verdict-*，绝不用 snapshot-* —— meta-regression 按下标取
     #detail-dialog .snapshot-price 的第 2 个元素，多出同名元素就会取错。
     结论、标题、事实、需要说明的都不等模型：模型只填 recap / divergence / lessons。 */
  const vrPriceText = v => E.isNum(v) ? price(v) : '—';
  const vrPctText = v => E.isNum(v) ? E.fmtPct(v) : '—';
  const vrDaysBetween = (a,b) => (a && b ? E.dayDiff(a,b) : null);

  function verdictTitle(v, c) {
    const d = v.decided_by;
    if (!d) return '这张判断的裁决';
    const neutral = c.stance === 'neutral';
    if (v.outcome === 'refuted') {
      if (d.role === 'falsifier') return d.kind === 'target' ? '价格走到了你设的认错价位' : '你设的认错线被触及了';
      return neutral ? '周期到了，价格走出了方向，和你判断的「波动」不一样' : '周期到了，价格走的方向和你判断的相反';
    }
    if (v.outcome === 'confirmed') {
      if (d.kind === 'target') return '你记下的目标价到了';
      if (d.role === 'trigger') return '你等的情况出现了';
      if (d.role === 'confirm') return '你设的验证条件成立了';
      return neutral ? '周期到了，价格一直在正常波动范围内' : '周期到了，价格朝你判断的方向走了';
    }
    if (v.outcome === 'expired_flat') return '周期到了，价格没走出方向';
    if (v.outcome === 'expired_unmet') return '周期到了，你等的情况没有出现';
    return '这张判断的裁决';
  }

  /** 恭喜只在 confirmed 出现，只有一句，必须带具体事实（《04》§10.3） */
  function verdictFactHtml(c, v) {
    const d = v.decided_by;
    if (!d) return '';
    const byRule = d.kind === 'condition' || d.kind === 'target';
    const n = vrDaysBetween(v.t0, d.date);
    let head;
    if (v.outcome === 'confirmed') {
      if (byRule) {
        head = '恭喜。你在 ' + v.t0 + ' 写下的「' + d.label + '」，在 ' + d.date
          + (d.kind === 'target' ? '达到' : '成立') + '了，等了 ' + (n == null ? '—' : n) + ' 天。';
      } else if (c.stance === 'neutral') {
        head = '恭喜。' + v.horizon_days + ' 天里价格走了 ' + vrPctText(v.return_window_pct)
          + '，一直在这段时间的正常波动（±' + vrPctText(v.band_pct) + '）以内，和你判断的「波动」一致。';
      } else {
        head = '恭喜。你在 ' + v.t0 + ' 判断的方向，到 ' + v.window_end + ' 兑现了：价格走了 '
          + vrPctText(v.return_window_pct) + '，超出了这段时间的正常波动（±' + vrPctText(v.band_pct) + '）。';
      }
    } else if (byRule) {
      head = '「' + d.label + '」在 ' + d.date + (d.kind === 'target' ? '达到' : '成立') + '。';
    } else {
      head = '周期 ' + v.horizon_days + ' 天走完（' + v.window_end + '）。';
    }
    const tail = byRule
      ? '那天收盘 ' + vrPriceText(v.close_at_decision) + '，比判断当天 ' + vrPctText(v.return_at_decision_pct)
        + '；到现在（' + v.t1 + '）收盘 ' + vrPriceText(v.close_t1) + '（' + vrPctText(v.return_now_pct) + '）。'
      : '收盘价 ' + vrPriceText(v.close_t0) + ' → ' + vrPriceText(v.close_window_end) + '（' + vrPctText(v.return_window_pct)
        + '），这段时间的正常波动约 ±' + vrPctText(v.band_pct) + '。';
    return '<p class="verdict-fact">' + esc(head + tail) + '</p>';
  }

  function verdictConsequence(v) {
    const d = v.decided_by;
    if (!d) return '';
    if (d.kind === 'clock') return '周期到了，这张卡到这里结束。';
    if (d.role === 'falsifier') return '按你当时写的规则，这张卡到这里结束。';
    if (d.role === 'trigger') return '按你当时写的规则，这是你等的那个时点。';
    return '按你当时写的规则，这张卡到这里完成。';
  }

  /** 《04》§10.4：和恭喜在同一屏、不折叠 —— 折叠起来的说明等于没有 */
  const VR_NOTE_TEXT = {
    baseline_already_met: p => '「' + p.rule + '」在你保存那天（' + p.t0 + '）就已经成立，不是后来等到的，这次不算数。',
    observed_only: p => '扫描区间有缺日，只能说「最早观测到 ' + p.date + '」成立，不能确定这就是第一次成立的那天。',
    confirmed_then_refuted: p => '「' + p.c_label + '」先在 ' + p.c_date + ' 成立了，之后认错线「' + p.f_label
      + '」在 ' + p.f_date + ' 也被触及。按你当时写的规则，认错线优先。',
    met_after_window: p => '「' + p.rule + '」在 ' + p.date + ' 才成立，已经过了你定的 ' + p.h + ' 天，不计入这次结论。',
    rolling_window: p => '「' + p.rule + '」是按滚动 ' + p.W + ' 天算的：它在 ' + p.date
      + ' 成立了，但从你写判断那天算起，价格那时其实是 ' + p.ret + '。',
    incomplete_scan: p => '扫描区间有缺日（' + p.dates + '），这次的结论有保留。',
    no_return: () => '收盘价或波动率缺数据，没法判断价格走出方向没有。',
    role_inferred: p => '这条被当作' + p.role_label + '，是系统按你的原话推断的，你当时没有单独标出来。'
      + '以后写判断时把条件的角色标清楚，结论就不用靠推断。',
    trigger_is_entry: p => '这是你当时说的入场时点，不等于判断已经被验证。从 ' + p.date + ' 到现在（'
      + p.t1 + '），价格走了 ' + p.post + '。',
  };
  /** 《04》§10.5：任何结果、任何数据状态下都显示，并且永远是最后一条 */
  function verdictWhyText() {
    return (S.live && S.live.mode === 'live')
      ? '系统不知道价格为什么这样走。这里只有 Bitget 的日线价格，没有新闻、财报和资金数据，只能告诉你哪一天、哪条规则开始不一样。'
      : '系统不知道价格为什么这样走。当前是合成演示数据，只能告诉你哪一天、哪条规则开始不一样。';
  }
  function verdictNotesHtml(v) {
    const items = (v.notes || []).map(n => {
      const f = VR_NOTE_TEXT[n.code];
      return f ? f(n.params || {}) : '';
    }).filter(Boolean);
    items.push(verdictWhyText());
    return items.map(t => '<div class="verdict-note">' + esc(t) + '</div>').join('');
  }

  function verdictDivergenceHtml(dv) {
    if (!dv) return '<span class="muted">这次没有可报的分歧点。</span>';
    return esc(dv.date + ' · ' + dv.text);
  }
  function verdictLessonsHtml(list) {
    if (!list || !list.length) return '<span class="muted">这次没有可留下的经验。</span>';
    return list.map(x => '<div class="verdict-lesson">' + esc(x.text) + '</div>').join('');
  }

  /** 卷宗：模型只看格式化好的文字，不看到原始数值（《04》§3） */
  function buildVerdictDossier(c, r) {
    const v = r.verdict || {};
    const conds = c.conditions || [];
    const only = conds.length === 1;
    const deciding = v.deciding || [];
    const results = r.condition_results || [];
    const fromLabel = {setup:'研究设置', text:'原话', target:'目标价'};
    const rules = conds.map((cond, i) => {
      const eff = E.effectiveRole(cond, c, only);
      const res = results.find(x => x.condition_id === cond.condition_id);
      const item = deciding.find(x => x.kind === 'condition' && x.ref === cond.condition_id);
      return {
        id: 'c' + (i + 1), label: E.buildRuleDesc(cond.metric, cond.operator, cond.threshold),
        role_label: E.ROLE_LABELS[eff.role] || eff.role, role_inferred: eff.origin === 'inferred',
        at_t0: res ? (res.baseline_state === 'met' ? '已成立' : res.baseline_state === 'unknown' ? '不确定' : '未成立') : '不确定',
        crossed_on: (item && item.date) ? item.date : null,
      };
    });
    const targets = (c.precise_readings || []).map((x, i) => ({x:x, i:i})).filter(o => o.x && o.x.target).map((o) => {
      const item = deciding.find(y => y.kind === 'target' && y.ref === 'reading:' + o.i);
      return {
        id: 't' + (o.i + 1), label: E.readingTargetLabel(o.x),
        role_label: E.ROLE_LABELS[item ? item.role : 'observe'] || '只观察',
        hit_on: (item && item.date) ? item.date : null,
      };
    });
    const moves = [];
    if (v.decided_by) moves.push({id:'ret_decision', label:'结论成立那天，相对判断当天', text: vrPctText(v.return_at_decision_pct)});
    moves.push({id:'ret_now', label:'到 ' + v.t1 + '，相对判断当天', text: vrPctText(v.return_now_pct)});
    if (v.band_pct != null) moves.push({id:'band', label:'这段时间的正常波动', text:'±' + E.fmtPct(v.band_pct)});
    conds.forEach((cond, i) => {
      const res = results.find(x => x.condition_id === cond.condition_id);
      if (!res) return;
      moves.push({id: cond.metric + '_' + i, label: E.METRIC_LABELS[cond.metric] || cond.metric,
        from: vrPctText(res.baseline_value), to: vrPctText(res.current_value)});
    });
    const cands = E.divergenceCandidates(v, c, r);
    // 没写认错条件不是复盘结论，也不交给模型点评。
    const lessons = E.lessonTexts(v, c, r).filter(x=>x.kind!=='no_falsifier');
    return {
      target: '该标的',
      t0_date: v.t0, t1_date: v.t1, window_end: v.window_end, elapsed_days: v.elapsed_days,
      horizon: {days: v.horizon_days, from: fromLabel[v.horizon_origin] || null, quote: c.horizon_quote || null},
      user_stance: c.stance, user_stance_label: E.STANCE_LABELS[c.stance] || c.stance,
      user_text: c.raw_input || c.judgment_text || '',
      verdict: {
        outcome: v.outcome, title: verdictTitle(v, c),
        decided_by: v.decided_by ? v.decided_by.label : '',
        decided_on: v.decided_by ? v.decided_by.date : '',
        decided_kind: v.decided_by ? v.decided_by.kind : null,
        decided_role: v.decided_by ? v.decided_by.role : null,
      },
      rules: rules, targets: targets, moves: moves,
      // sign 只给校验流水线用（D5 方向核对）；vrUserPrompt 不会把它印出来
      divergence_candidates: cands.map(x => ({i: x.i, date: x.date, text: x.text, sign: x.sign})),
      lesson_candidates: lessons.map(x => x.kind),
      lesson_texts: lessons,
      data_mode: (S.live && S.live.mode === 'live') ? 'live' : 'synthetic',
    };
  }

  /** 复核对话框最上面的「裁决」区块。结论、标题、事实永远不等模型。 */
  function verdictBlock(c, r) {
    const v = r && r.verdict;
    if (!v || !v.version) return '';
    if (v.state !== 'resolved') {
      const line = verdictLine({verdict: v});
      return line ? '<section class="verdict-block verdict-pending"><p class="verdict-pending-line">'
        + icon('clock') + ' ' + esc(line) + '</p></section>' : '';
    }
    const dossier = buildVerdictDossier(c, r);
    const fallback = (T && T.ruleVerdictRecap) ? T.ruleVerdictRecap(dossier) : {recap: '', divergence: null, lessons: []};
    const d = v.decided_by;
    const meta = '判断写于 ' + v.t0 + ' · 现在 ' + v.t1 + ' · 过了 ' + (v.elapsed_days == null ? '—' : v.elapsed_days) + ' 天'
      + (v.horizon_days != null
        ? ' · 周期 ' + v.horizon_days + ' 天（来自' + ({setup:'研究设置', text:'你写的「' + (c.horizon_quote || '周期') + '」', target:'目标价'}[v.horizon_origin] || '—') + '）'
        : ' · 没有周期');
    const nudge = (d && d.role === 'trigger')
      ? '<p class="verdict-nudge">条件到了。要不要写一张新卡，把这次的认错线定好？</p>' : '';
    return '<section class="verdict-block verdict-resolved verdict-'
      + esc(v.outcome || 'resolved') + '">'
      + '<div class="verdict-head"><h3 class="verdict-title">' + esc(verdictTitle(v, c)) + '</h3>'
      + '<p class="verdict-meta">' + esc(meta) + '</p></div>'
      + '<p class="verdict-recap">' + esc(fallback.recap || '') + '</p>'
      + verdictFactHtml(c, v)
      + '<p class="verdict-consequence">' + esc(verdictConsequence(v)) + '</p>' + nudge
      + '<div class="verdict-section"><h4>从哪天开始不一样的</h4>'
      + '<div class="verdict-divergence">' + verdictDivergenceHtml(fallback.divergence) + '</div></div>'
      + '<div class="verdict-section"><h4>下次可以留意</h4>'
      + '<div class="verdict-lessons">' + verdictLessonsHtml(fallback.lessons) + '</div></div>'
      + '<div class="verdict-section"><h4>需要说明的</h4>'
      + '<div class="verdict-notes">' + verdictNotesHtml(v) + '</div></div>'
      + '</section>';
  }

  /**
   * 复盘文字惰性生成：先用代码兜底文字渲染，模型返回后只替换三处。
   * 绝不能整块重渲染 —— 用户可能正在复盘输入框里打字，会把他写的字清掉。
   */
  function fillVerdictRecap(c, r, dossier) {
    if (!T || !T.verdictRecap) return;
    const v = r.verdict;
    const key = [T.VR_VERSION, c.card_id, v.t1, v.state, v.outcome].join('|');
    const setHtml = (sel, html) => { const el = $('#detail-dialog ' + sel); if (el) el.innerHTML = html; };
    const fill = (res) => {
      if (!res) return;
      if (S.detail !== c.card_id) return;               // 期间关掉或换了卡就丢弃
      setHtml('.verdict-recap', esc(res.recap || ''));
      setHtml('.verdict-divergence', verdictDivergenceHtml(res.divergence));
      setHtml('.verdict-lessons', verdictLessonsHtml(res.lessons));
    };
    if (S.vrCache.has(key)) { fill(S.vrCache.get(key)); return; }
    Promise.resolve(T.verdictRecap(dossier, {storage: storage})).then((res) => {
      S.vrCache.set(key, res);
      fill(res);
    }).catch(() => {});
  }

  function detail(id, opts) {
    // 行上的「删除」按钮也从这里进来：先照常把卡展示出来，底部直接落在确认态。
    // 好处是用户在删之前一定看得见这张卡是什么 —— 一个只写着「确认删除？」的
    // 悬浮提示，用户根本不知道自己删的是哪一张。
    const c=cards().find(x=>x.card_id===id)||allCards().find(x=>x.card_id===id);if(!c)return;
    const rr=service.review_cards({view_id:S.view.view_id,card_ids:[id]});
    if(!rr.ok){toast('无法刷新',rr.error.message,true);return;}
    const r=rr.data.comparisons[0];S.detail=id;S.detailReview=r;S.detailCard=c;S.detailDirty=false;
    // 触发只是入场时点，判断本身还没被验证 —— 下一步最自然的动作就是「承接这张卡」（04 §10.2）
    const triggerHit=!!(r.verdict&&r.verdict.decided_by&&r.verdict.decided_by.role==='trigger');
    S.detailTriggerHit=triggerHit;
    // 换一张卡就清掉上一条确认，避免「点了删除 → 去看别的卡 → 回来发现还在确认态」
    S.deleteAsk=(opts&&opts.askDelete)?id:null;
    const snap=(snap,label,isCurrent)=>`<div class="snapshot"><div class="label">${label} · ${snap.bar_date||'—'}</div><div class="snapshot-price">${price(isCurrent?snap.close_price:snap.close_price)}</div>${E.VISIBLE_METRIC_KEYS.map(k=>`<div class="snapshot-metric"><span>${metricShort[k]}</span><span>${pct(snap.metrics[k])}</span></div>`).join('')}</div>`;
    const history=reflectFor(id).filter(h=>h.asOf<=S.date);
    const parent=allCards().find(p=>p.card_id===S.links[id]);
    $('#detail-dialog').innerHTML=`<header class="dialog-header"><div class="row">${logo(c.instrument.symbol)}<div><h2 id="detail-title">${c.instrument.symbol} · 回看这条判断</h2><span class="tiny muted">研究于 ${c.snapshot.bar_date} · 查看周期 ${chartIntervalLabels[c.chart_interval||'1D']} · 保存于 ${new Date(c.created_at).toLocaleString('zh-CN',{hour12:false})}</span></div></div><button class="icon-btn" data-action="close-detail" aria-label="关闭">${icon('close')}</button></header><div class="dialog-body">${verdictBlock(c,r)}${thesisObserverBlock(c,r)}<div class="row between"><span class="section-kicker">当时的原话 · 完整保留</span>${progressBadge(r)}</div>${parent?`<div class="origin-note" style="margin-top:12px">${icon('link')}承接自 ${parent.snapshot.bar_date} 的判断<button class="text-btn" style="margin-left:auto" data-detail="${parent.card_id}">查看上一版</button></div>`:''}<blockquote class="detail-quote">${esc(c.raw_input||c.judgment_text)}</blockquote><div class="compare-grid">${snap(c.snapshot,'T0 · 冻结快照',false)}${icon('arrow')}${snap(r.current_snapshot,'T1 · 本次可用',true)}</div>
      ${evidencePanel(c, r)}${auditPanel(c, r)}<div class="row between"><h3>你当时等的变化，后来发生了吗？</h3><span class="tiny muted">已经过了 ${r.days_since??'—'} 天</span></div>${r.condition_results.length?r.condition_results.map(x=>`<div class="condition-detail"><div class="row between"><span class="rule">${esc(x.rule_desc)}</span>${badge(x.display_status)}</div><div class="values">当时 ${pct(x.baseline_value)} <span class="muted">→</span> 现在 ${pct(x.current_value)}${x.baseline_state==='met'?'<span class="badge" style="margin-left:8px">保存时已成立</span>':''}</div>${x.scan.daily_states.length?`<div class="timeline" aria-label="逐日变化记录">${x.scan.daily_states.map(d=>`<span class="day ${d.state}" title="${d.date} · ${d.state==='met'?'成立':d.state==='unknown'?'数据未知':'不成立'} · ${E.fmtPct(d.value)}"></span>`).join('')}</div><div class="timeline-labels"><span>${x.scan.from_date}</span><span>${x.scan.to_date}</span></div>`:'<p class="tiny muted">还没有新的已收盘日线，之后再看。</p>'}<p class="tiny muted" style="margin-top:9px">${x.first_met_on?'第一次达到是在 '+x.first_met_on:x.first_observed_met_on?'最早能确认达到的是 '+x.first_observed_met_on+'（中间有缺失日线）':x.display_status==='waiting'?'目前还没达到。':x.current_state==='unknown'?'当前数据还不够，先不下结论。':x.baseline_state==='met'?'保存时就已经达到，不算后来出现的新变化。':'这段行情里还没看到它达到。'}${x.distance_pp!=null&&x.current_state!=='met'?' 现在离你写下的界线还差 '+x.distance_pp.toFixed(2)+' 个百分点。':''}</p></div>`).join(''):'<p class="sub" style="margin-top:12px">这张判断主要看原话与行情是否出现实质变化，系统会沿着你写下的意思继续观察。</p>'}
      ${r.condition_results.length?'<div class="row tiny muted" style="margin-top:12px"><span><i class="dot accent"></i> 成立</span><span>蓝灰：未成立</span><span>斜纹：数据未知</span></div>':''}${r.warnings.map(w=>`<div class="detail-warning">${esc(w)}</div>`).join('')}${(c.unsupported_notes||[]).length?`<details style="margin-top:16px;font-size:11px;color:var(--muted)"><summary>原话里的其他信号</summary>${c.unsupported_notes.map(n=>`<p style="margin-top:8px">${esc(n)}</p>`).join('')}<p style="margin-top:10px">这些是旧卡留下的原话片段。行情进展会在数据足够时按你的定义或通行技术含义继续判断。</p></details>`:''}
      <section class="reflection"><h3>事实变了，你的看法呢？</h3><label class="hidden" for="reflection-input">复盘笔记</label><textarea id="reflection-input" maxlength="4000" placeholder="这一次验证了什么？什么是之前没想到的？"></textarea><div class="row between"><span class="tiny muted">复盘追加保存，不修改原来的判断。</span><button class="btn small" data-action="save-reflection">${icon('check')}保存本次复盘</button></div>${history.map(h=>`<div class="reflection-history">${h.verdict?`<small class="verdict-history">当时的裁决：${esc(h.verdict.title||'')}${h.verdict.date?'（'+String(h.verdict.date).slice(5)+'）':''}</small>`:''}<small>复盘时点 ${h.asOf}${REFLECT_CHOICES[h.choice]?' · '+REFLECT_CHOICES[h.choice]:''} · ${new Date(h.at).toLocaleString('zh-CN',{hour12:false})}</small><p style="white-space:pre-wrap;margin-top:5px">${esc(h.text)}</p></div>`).join('')}</section></div>${detailFooter(c,triggerHit)}`;
    if(!$('#detail-dialog').open)$('#detail-dialog').showModal();
    // 复盘文字惰性生成：resolved 时才调。代码兜底文字已经渲染出来了，模型回来只替换三处。
    if(r.verdict&&r.verdict.state==='resolved'){try{fillVerdictRecap(c,r,buildVerdictDossier(c,r));}catch(_){}}
  }
  /* ── 删除一张判断 ─────────────────────────────────────────────────────
     删除是不可逆的：原话、冻结快照、已写的复盘会一起消失。所以这里刻意不用
     window.confirm —— 那种系统弹窗长得像浏览器的东西，容易被顺手点掉，而且在
     无头环境里会被直接吞掉（返回 undefined，等于永远取消）。
     改成弹窗底部的原地确认：说明白删掉什么，再给一次「确认删除」。 */

  /** 弹窗底部。默认是「承接这张卡」；进入确认态后原地换成确认条。 */
  function detailFooter(c, triggerHit) {
    if (S.deleteAsk === c.card_id) {
      return '<footer class="dialog-footer danger-zone">'
        + '<span class="tiny danger-note">' + icon('info')
        + '删除后不可恢复：这张判断的原话、冻结快照和它的复盘会一起删掉。</span>'
        + '<div class="row" style="gap:8px">'
        + '<button class="btn small ghost" data-action="delete-cancel">再想想</button>'
        + '<button class="btn small danger" data-action="delete-confirm">确认删除</button>'
        + '</div></footer>';
    }
    return '<footer class="dialog-footer"><span class="tiny muted">行情是事实，判断由你更新。</span>'
      + '<div class="row" style="gap:8px">'
      + '<button class="btn small ghost btn-delete" data-action="delete-card" aria-label="删除这张判断">'
      + icon('trash') + '删除这张判断</button>'
      + '<button class="btn primary' + (triggerHit ? ' verdict-highlight' : '') + '" data-action="continue">承接这张卡，写新判断' + icon('arrow') + '</button>'
      + '</div></footer>';
  }

  /**
   * 只换底部那一块，不整块重渲染弹窗 —— 用户可能正在复盘输入框里打字，
   * 整块重渲染会把他写的字清掉（和 fillVerdictRecap 是同一个理由）。
   */
  function renderDetailFooter() {
    const c = S.detailCard, el = $('#detail-dialog .dialog-footer');
    if (!c || !el) return;
    el.outerHTML = detailFooter(c, !!S.detailTriggerHit);
    const focus = $('#detail-dialog ' + (S.deleteAsk ? '[data-action="delete-confirm"]' : '[data-action="delete-card"]'));
    if (focus) focus.focus();
  }

  /* ── 删除 · 撤销 · 回收站 ─────────────────────────────────────────────
     删除是「先移进回收站」而不是真删，所以随时能撤销。真正丢数据只发生在两处：
     回收站满了被挤掉最旧的、或者用户在设置页手动清空。

     界面上还有一份「跟着卡片走」的旁路数据：复盘、承接关系、弹过的裁决。
     删除时就把它清掉（否则导出会带一串指不到卡片的孤儿），但清之前原样存进
     回收站的 snapshot 里 —— 撤销时再放回去，两头都不丢。 */

  /** 打包这些卡片的旁路数据，交给引擎存进回收站。 */
  function sideDataOf(ids) {
    const ws = workspace();
    const reflections = {}, verdictSeen = {}, thesisReviews = {}, thesisReviewSeen = {}, links = {}, linkedBy = {}, draftParents = {};
    ids.forEach(id => {
      const k = ws + '|' + id;
      if (S.reflections[k]) reflections[k] = S.reflections[k];
      if (S.verdictSeen[k] != null) verdictSeen[k] = S.verdictSeen[k];
      Object.entries(S.thesisReviews).forEach(([tk,tv])=>{if(tk.startsWith(k+'|'))thesisReviews[tk]=tv;});
      if (S.thesisReviewSeen[k] != null) thesisReviewSeen[k] = S.thesisReviewSeen[k];
      if (S.links[id] != null) links[id] = S.links[id];
    });
    Object.entries(S.links).forEach(([k, v]) => { if (ids.indexOf(v) >= 0) linkedBy[k] = v; });
    Object.entries(S.drafts).forEach(([k, d]) => { if (d && ids.indexOf(d.parent) >= 0) draftParents[k] = d.parent; });
    return { reflections, verdictSeen, thesisReviews, thesisReviewSeen, links, linkedBy, draftParents };
  }

  /** 把旁路数据从界面上清掉（删除、或彻底删除时）。 */
  function dropSideData(ids) {
    if (!ids || !ids.length) return;
    const ws = workspace();
    const nextRef = { ...S.reflections }, nextSeen = { ...S.verdictSeen }, nextThesis = { ...S.thesisReviews }, nextThesisSeen = { ...S.thesisReviewSeen }, nextLinks = { ...S.links };
    ids.forEach(id => {
      delete nextRef[ws + '|' + id];
      delete nextSeen[ws + '|' + id];
      delete nextThesisSeen[ws + '|' + id];
      Object.keys(nextThesis).forEach(k=>{if(k.startsWith(ws+'|'+id+'|'))delete nextThesis[k];});
      delete nextLinks[id];
    });
    // 承接关系两头都要断：可能指向它，也可能由它指向别人
    Object.keys(nextLinks).forEach(k => { if (ids.indexOf(nextLinks[k]) >= 0) delete nextLinks[k]; });
    S.reflections = nextRef; write('mydesk.next.reflections', nextRef);
    S.verdictSeen = nextSeen; write('mydesk.next.verdictSeen', nextSeen);
    S.thesisReviews = nextThesis; write('mydesk.next.thesisReviews', nextThesis);
    S.thesisReviewSeen = nextThesisSeen; write('mydesk.next.thesisReviewSeen', nextThesisSeen);
    S.links = nextLinks; write('mydesk.next.links', nextLinks);
    // 草稿里「承接自这张卡」也要断掉，否则下次保存会挂到一个不存在的父卡上
    Object.values(S.drafts).forEach(d => { if (d && ids.indexOf(d.parent) >= 0) d.parent = null; });
    persistDraft();
  }

  /** 把 snapshot 里的旁路数据放回去（撤销 / 从回收站恢复时）。 */
  function putSideData(snapshots) {
    if (!snapshots || !snapshots.length) return;
    const nextRef = { ...S.reflections }, nextSeen = { ...S.verdictSeen }, nextThesis = { ...S.thesisReviews }, nextThesisSeen = { ...S.thesisReviewSeen }, nextLinks = { ...S.links };
    snapshots.forEach(snap => {
      if (!snap) return;
      Object.assign(nextRef, snap.reflections || {});
      Object.assign(nextSeen, snap.verdictSeen || {});
      Object.assign(nextThesis, snap.thesisReviews || {});
      Object.assign(nextThesisSeen, snap.thesisReviewSeen || {});
      Object.assign(nextLinks, snap.links || {});
      Object.assign(nextLinks, snap.linkedBy || {});
      Object.entries(snap.draftParents || {}).forEach(([k, parent]) => { if (S.drafts[k]) S.drafts[k].parent = parent; });
    });
    S.reflections = nextRef; write('mydesk.next.reflections', nextRef);
    S.verdictSeen = nextSeen; write('mydesk.next.verdictSeen', nextSeen);
    S.thesisReviews = nextThesis; write('mydesk.next.thesisReviews', nextThesis);
    S.thesisReviewSeen = nextThesisSeen; write('mydesk.next.thesisReviewSeen', nextThesisSeen);
    S.links = nextLinks; write('mydesk.next.links', nextLinks);
    persistDraft();
  }

  /**
   * 执行删除（单张或一批）。一张一条回收站记录，同一个 group 绑在一起，
   * 这样「撤销」能一次把整批都拿回来。
   */
  function deleteCards(ids) {
    const list = (ids || []).filter(Boolean);
    if (!list.length) return;
    const group = 'del_' + Date.now().toString(36) + '_' + list.length;
    const done = [];
    const dropped = [];
    let failure = null;
    list.forEach(id => {
      const res = service.delete_card({
        workspace_id: workspace(), card_id: id, snapshot: sideDataOf([id]), group,
      });
      if (!res.ok) { failure = res.error; return; }
      done.push(id);
      // 回收站满 20 条时引擎会挤掉最旧的，那些是真的没了，旁路数据也得跟着清
      (res.data.dropped || []).forEach(x => dropped.push(x));
    });
    if (!done.length) { toast('没能删除', failure ? failure.message : '请稍后重试', true); return; }

    dropSideData(done.concat(dropped));
    S.deleteAsk = null; S.detail = null; S.detailCard = null; S.detailReview = null;
    S.picks = new Set(); S.bulkAsk = false;
    const dlg = $('#detail-dialog'); if (dlg && dlg.open) dlg.close();
    openView(); render();
    toast(done.length > 1 ? '已删除 ' + done.length + ' 张判断' : '已删除这张判断',
      '原话、冻结快照和复盘都移进了回收站，可以恢复。'
      + (failure ? ' 有 ' + (list.length - done.length) + ' 张没能删掉。' : ''),
      false, { label: '撤销', action: 'undo-delete', data: { group: group } }, 12000);
  }

  /** 弹窗里那张（也走统一流程，所以同样可撤销）。 */
  function deleteCardNow() {
    const id = S.deleteAsk || S.detail;
    if (id) deleteCards([id]);
  }

  /**
   * 撤销一次删除。整批一起回来 —— group 就是为这个用的。
   * 若那张卡在删除之后被「彻底删除」过，回收站里已经没有它，这里会如实报错。
   */
  function undoDelete(group) {
    const res = service.restore_card({ workspace_id: workspace(), group: group });
    if (!res.ok) { toast('没能撤销', res.error.message, true); return; }
    putSideData(res.data.snapshots);
    S.picks = new Set(); S.bulkAsk = false;
    openView(); render();
    toast('已恢复 ' + res.data.card_ids.length + ' 张判断', '原话、冻结快照和复盘都回来了。');
  }

  /** 从设置页的回收站里恢复一条。 */
  function restoreFromTrash(trashId) {
    const res = service.restore_card({ workspace_id: workspace(), trash_id: trashId });
    if (!res.ok) { toast('没能恢复', res.error.message, true); return; }
    putSideData(res.data.snapshots);
    openView(); render();
    toast('已恢复到「我的判断」', '这条判断和它的复盘都回来了。');
  }

  /** 彻底删除一条 / 清空回收站。这一步之后旁路数据也一并清掉，卡片再也找不回来。 */
  function purgeTrash(trashId) {
    const res = service.purge_trash(trashId
      ? { workspace_id: workspace(), trash_id: trashId }
      : { workspace_id: workspace() });
    if (!res.ok) { toast('没能彻底删除', res.error.message, true); return; }
    dropSideData(res.data.purged);
    S.trashAsk = null;
    refreshTrashPanel();
    toast(trashId ? '已彻底删除' : '回收站已清空',
      '这一步之后就找不回来了。回收站还剩 ' + res.data.trash_size + ' 条。');
  }

  function saveReflection() {
    const input=$('#reflection-input'),text=input?.value.trim();if(!text){toast('写一句本次复盘的理由','以后回看时，它会比一个结论更有用。',true);input?.focus();return;}
    const key=workspace()+'|'+S.detail;
    const entry={asOf:S.date,at:new Date().toISOString(),text};
    // 回看时能同时看到「当时系统怎么判的」和「我当时怎么想的」（03 §7）
    const rv=S.detailReview&&S.detailReview.verdict;
    if(rv&&rv.state==='resolved'){
      entry.verdict={version:rv.version,outcome:rv.outcome,title:S.detailCard?verdictTitle(rv,S.detailCard):'',
        label:rv.decided_by&&rv.decided_by.label,date:rv.decided_by&&rv.decided_by.date,
        return_window_pct:rv.return_window_pct,t1:rv.t1};
    }
    const next={...S.reflections,[key]:[...(S.reflections[key]||[]),entry]};
    if(!write('mydesk.next.reflections',next)&&storage){toast('复盘未能写入本地','请保留当前文字，并先导出已有数据。',true);return;}
    S.reflections=next;S.detailDirty=false;detail(S.detail);render();toast('复盘已记录','原判断保持完整，新的认识单独留存。');
  }
  function continueCard() {
    const c=cards().find(x=>x.card_id===S.detail);if(!c)return;
    if($('#reflection-input')?.value.trim()){toast('请先保存当前复盘','保存后即可承接这张卡。',true);return;}
    const targetKey=`${workspace()}|${c.instrument.instrument_id}|${S.date}`;
    if(S.drafts[targetKey]?.text.trim()){toast('此标的已有未完成草稿','先保存草稿，再从这张卡承接，避免覆盖你的内容。',true);return;}
    S.instrument=c.instrument.instrument_id;S.page='overview';form().parent=c.card_id;form().stance=c.stance;form().stanceTouched=true;persistDraft();$('#detail-dialog').close();loadChart();render();$('#judgment-input')?.focus();
  }

  /** 归一化成裸代码，用来跨命名体系比对：
   *  实时数据的 'rNVDA' 与合成数据的 'NVDAx' 都会变成 'NVDA'。
   *  两套命名混用是既有设计（合成数据 x 后缀、实时数据 r 前缀），
   *  不归一化就会出现「移除点了没反应」。 */
  function watchKey(v) {
    return String(v == null ? '' : v)
      .replace(/^bitget:spot:/, '')
      .replace(/^r(?=[A-Z])/, '')
      .replace(/x$/, '')
      .toUpperCase();
  }

  /**
   * 本次必须拉行情的标的 = 当前关注列表 + 所有写过判断的标的。
   *
   * 关注列表只决定工作台上主动展示什么，不能决定哪些历史判断有资格被复核。
   * 用户取消关注后，判断卡仍然存在；下次打开时如果不把它的标的补进数据源，
   * review_cards() 虽然会找到卡片，却只能得到一个空的 T1，永远显示「没有最新日线」。
   *
   * 这里不会把历史标的偷偷写回关注列表，只在后台为复核补行情。
   */
  function reviewMarketSymbols() {
    const symbols = [];
    const add = (raw) => {
      const key = watchKey(raw);
      const symbol = key ? 'r' + key : '';
      if (!/^r[A-Z][A-Z0-9]*$/.test(symbol) || symbols.indexOf(symbol) >= 0) return;
      symbols.push(symbol);
    };
    (S.watch || []).forEach(add);
    service.getCards('mydesk-next-personal-live').forEach((card) => {
      add(card && card.instrument && (card.instrument.symbol || card.instrument.instrument_id));
    });
    return symbols;
  }

  /** 把关注列表里的代码映射到当前目录里真实的 instrument_id。
   *  合成数据叫 bitget:spot:NVDAx，实时数据叫 bitget:spot:rNVDA —— 不查目录就会拼错。 */
  function instrumentIdOf(sym) {
    const key = watchKey(sym);
    const hit = service.catalog().instruments.find((i) => watchKey(i.symbol) === key);
    return hit ? hit.instrument_id : null;
  }

  /** 按关注列表筛出侧栏该显示的行；一只都对不上时退回全部，宁可多显示也别空着。 */
  function watchRows() {
    const all = (S.view && S.view.rows) || [];
    const mine = all.filter((r) => S.watch.some((w) => watchKey(w) === watchKey(r.instrument.symbol)));
    return mine;
  }

  function watchRemove(sym) {
    const key = watchKey(sym);

    render();

  }

  /** 全市场目录：优先经 Agent Hub 后端，目录只在用户打开选股器时拉取。 */
  async function ensureUniverse(force=false) {
    if (!L || (!force && S.live.universe.length) || S.universeLoading) return;
    S.universeLoading=true;render();
    try {
      let catalog=null;
      const canUseBackend=typeof location!=='undefined' && /^https?:$/.test(location.protocol) && typeof fetch==='function';
      if(canUseBackend) {
        const response=await fetch('/api/agent-hub/rtoken-universe',{signal:AbortSignal.timeout(45000)});
        if(![404,405,501].includes(response.status)) {
          const payload=await response.json();
          if(!response.ok) throw Error(payload.error||'Agent Hub rToken 目录读取失败');
          if(!Array.isArray(payload.instruments)) throw Error('Agent Hub 返回的 rToken 目录格式不完整');
          catalog={instruments:payload.instruments};
        }
      }
      if(!catalog) catalog=await L.fetchSymbols({});
      S.live.universe=catalog.instruments;
      S.live.universeErr=null;
      toast('rToken 目录已同步','已载入 '+catalog.instruments.length+' 只 Bitget 在线代币化股票。');
    } catch (e) {
      S.live.universeErr=(e&&e.message)?e.message:String(e);
    } finally {
      S.universeLoading=false;render();
    }
  }

  async function probeMcp() {

      const status=await response.json();

      S.mcpStatus=status.mcp||null;
    } catch(e) {
      S.mcpStatus={connected:false,error:(e&&e.message)?e.message:String(e)};
    } finally {

    }
  }

  /**
   * 拉实时数据并替换服务。
   * 注意顺序：必须先 setClock 再 createService ——
   * 引擎的 cutoff_at 用的是时钟常量，不校准会把最新那根日线截断掉。
   */
  // ══ 实时数据的演示卡组 ══════════════════════════════════════════════════
  const LIVE_NAMES = { rNVDA:'英伟达', rAAPL:'苹果', rTSLA:'特斯拉', rMSFT:'微软', rMETA:'Meta',
                       rGOOGL:'谷歌', rAMZN:'亚马逊', rMU:'美光', rAMD:'AMD', rNFLX:'奈飞' };
  const r1 = (v) => (typeof v === 'number' && isFinite(v)) ? Math.round(v * 10) / 10 : null;
  const move = (v) => (v >= 0 ? '涨' : '跌') + ' ' + Math.abs(v).toFixed(1) + '%';
  /** 把阈值推到「当时不成立」的一侧，并取整，让它看起来像人定的数 */
  const beyond = (v, pad, up) => {
    const x = r1(v);
    if (x == null) return null;
    return up ? Math.ceil(x + pad) : Math.floor(x - pad);
  };

  /**
   * 给实时数据生成一套演示卡组。
   *
   * 引擎自带的 DEMO_SCRIPT 把标的（NVDAx）和日期（2026-09-01）写死了，实时数据里
   * 这两样都对不上，强行 seed 只会全部失败。这里按当前数据源重新生成：
   *   · 标的：从当前目录里挑真实存在的代币化美股
   *   · 日期：从该标的真实日线往回数，保证那天确实有 K 线
   *   · 判断：行情描述取自当时的真实指标；条件阈值取整后刻意落在当时不成立的一侧，
   *           这样往后推进几天，就能看到「继续观察 → 条件成立」的变化
   * 任何一步失败都静默跳过，不影响主流程。
   */
  function seedLiveDemoCards(wsId) {
    const bySym = {};
    service.catalog().instruments.forEach((i) => { bySym[i.symbol] = i; });


    /** 倒数第 n 根已收盘日线（0 = 最新一根） */
    function barBack(inst, back) {
      const c = service.cacheById(inst.instrument_id);
      if (!c) return null;
      const closed = c.bars.filter((b) => b.is_closed);
      return closed.length > back ? closed[closed.length - 1 - back] : null;
    }

    const used = {};   // 演示卡组尽量不重复用同一个标的
    let made = 0;

    /** 挑一个可用标的 + 日期；allowUsed=false 时跳过已经用过的 */
    function pickOne(syms, back, allowUsed) {
      for (let i = 0; i < syms.length; i += 1) {
        const inst = bySym[syms[i]];
        if (!inst) continue;
        if (!allowUsed && used[inst.instrument_id]) continue;
        const bar = barBack(inst, back);
        if (bar) return { inst: inst, asOf: bar.time };
      }
      return null;
    }

    /** 通用流程：挑标的与日期 → 开工作台读当时指标 → 起草 → 落卡 */
    function make(syms, back, build) {
      // 优先用还没出现过的标的；候选都不行（比如某只当天没拉到数据）才允许重复
      const hit = pickOne(syms, back, false) || pickOne(syms, back, true);
      if (!hit) return;

      const ob = service.open_workbench({ workspace_id: wsId, selection: { kind:'historical', as_of:hit.asOf }, trigger:'open' });
      if (!ob.ok) return;
      const row = ob.data.rows.filter((r) => r.instrument.instrument_id === hit.inst.instrument_id)[0];
      if (!row) return;

      const name = LIVE_NAMES[hit.inst.symbol] || hit.inst.underlying || hit.inst.symbol;
      const spec = build(name, row.quote, ob.data.rows.length);
      if (!spec) return;

      const p = service.prepare_card({ view_id: ob.data.view_id, instrument_id: hit.inst.instrument_id });
      if (!p.ok) return;

      // manual 的卡不调模型，走「自己写」那条路 —— 正好演示这个入口
      const d = spec.manual ? { ok:false } : service.generate_card_draft({ context_id: p.data.context_id, user_text: spec.text });
      const conds = (spec.conds || []).filter((c) => c.threshold != null).map((c) => ({
        text: E.buildRuleDesc(c.metric, c.operator, c.threshold),
        metric: c.metric, operator: c.operator, threshold: c.threshold, threshold_origin: 'user_explicit',
      }));

      const saved = service.confirm_card({
        context_id: p.data.context_id,
        draft_id: d.ok ? d.data.draft_id : null,
        idempotency_key: 'live-demo-' + hit.inst.symbol + '-' + p.data.snapshot.bar_date,
        raw_input: spec.text,
        judgment_text: spec.text,
        stance: spec.stance,
        conditions: conds,
        conditions_confirmed: true,
      });
      if (saved.ok) { made += 1; used[hit.inst.instrument_id] = true; }
    }

    // ① 追高犹豫 —— 最近涨得急，不追，等回调
    make(['rNVDA','rAAPL','rTSLA','rMSFT','rMETA'], 26, (name, q) => {
      const m = q.metrics || {};
      if (m.chg_5d == null) return null;
      const lo = beyond(m.chg_5d, 6, false);
      const hi = beyond(m.ma20_gap, 6, true);
      return {
        stance: 'wait_condition',
        text: name + ' 现价 ' + q.last_price + '，近5天' + move(m.chg_5d)
          + (m.chg_5d >= 0 ? '，短线涨得偏急，我不想追高。' : '，短线回调了不少，但我不想急着接。')
          + '等它跌到 ' + (lo == null ? '更低的位置' : lo + '% 以下') + ' 我再考虑；'
          + '相对20天均线偏离' + (hi == null ? '太多' : '超过 ' + hi + '%') + '，我就彻底不碰了。',
        conds: [
          { metric:'chg_5d', operator:'lt', threshold: lo },
          { metric:'ma20_gap', operator:'gt', threshold: hi },
        ],
      };
    });

    // ② 下跌接货 —— 再跌才分批接
    make(['rTSLA','rMU','rAMD','rAMZN','rNVDA'], 22, (name, q) => {
      const m = q.metrics || {};
      if (m.chg_5d == null) return null;
      const lo5 = beyond(m.chg_5d, 5, false);
      const lo1 = beyond(m.chg_1d, 3, false);
      return {
        stance: 'wait_condition',
        text: name + ' 近5天' + move(m.chg_5d)
          + '。跌到 ' + (lo5 == null ? '更低' : lo5 + '% 以下') + ' 我才有兴趣，打算分批接；'
          + '单日再急跌一把也算机会。',
        conds: [
          { metric:'chg_5d', operator:'lt', threshold: lo5 },
          { metric:'chg_1d', operator:'lt', threshold: lo1 },
        ],
      };
    });

    // ③ 动能观察 —— 中性，看趋势能不能延续
    make(['rAAPL','rMSFT','rGOOGL','rMETA','rNFLX'], 18, (name, q) => {
      const m = q.metrics || {};
      if (m.chg_5d == null) return null;
      return {
        stance: 'neutral',
        text: name + ' 走得比较稳，近5天' + move(m.chg_5d)
          + '。我想看动能能不能延续：稳住我先不动，真放量再考虑。',
        conds: [
          { metric:'chg_5d', operator:'gt', threshold: beyond(m.chg_5d, 2, true) },
          { metric:'chg_1d', operator:'gt', threshold: beyond(m.chg_1d, 1.5, true) },
        ],
      };
    });

    // ④ 均线偏离 —— 等它离均线足够远再动
    make(['rMSFT','rMETA','rAAPL','rGOOGL','rNVDA'], 14, (name, q) => {
      const m = q.metrics || {};
      if (m.ma20_gap == null) return null;
      // Math.round(-0.03 * 10) / 10 是 -0，直接 toFixed 会印成「-0.0」，用 || 0 归零
      const gap = Math.round(m.ma20_gap * 100) / 100 || 0;
      return {
        stance: 'wait_condition',
        text: name + ' 现在相对20天均线偏离 ' + gap.toFixed(2)
          + '%。没拉开之前我不动，等它明显走偏再说。'
          + '另外只有它自己的财报出来我才改这张卡，别处转的消息我不打算用。',
        conds: [{ metric:'ma20_gap', operator:'gt', threshold: beyond(m.ma20_gap, 5, true) }],
      };
    });

    // ⑤ 手写卡 —— 演示「模型不可用时自己写」这条入口。
    // 标的取「前面几张还没用过的」，避免重复；如果一只不剩就直接不出这张。
    const remaining = service.catalog().instruments
      .filter((i) => !used[i.instrument_id]).map((i) => i.symbol);
    make(remaining, 10, (name) => ({
      stance: 'wait_condition', manual: true,
      text: name + ' 的注记：先把想法记下来，等它自己的财报日期确认之后再改这张卡。'
        + '财报日期需要我自己查，系统不代查基本面数据。',
      conds: [],
    }));

    return made;
  }

  let liveRequestId = 0;

  // 加载失败后自动重试。
  // 为什么需要：VPN / 代理节点会抖动（实测同一秒里 200 和 000 交替）。页面只在打开时拉一次，
  // 一旦那一下正好赶上抖动，就会一直停在"回退合成数据"，网络恢复了也不会自己好 ——
  // 用户看到的就是"打开时连不上，之后一直没数据"。所以失败后退避重试，接上就自动恢复。
  let liveRetryTimer = null;
  let liveRetryCount = 0;
  const LIVE_RETRY_DELAYS = [3000, 6000, 12000, 20000, 30000];
  const LIVE_RETRY_MAX = 6;   // 试够次数就停：无限重试会让页面永远挂着定时器，也不诚实
  function clearLiveRetry() {
    if (liveRetryTimer) { clearTimeout(liveRetryTimer); liveRetryTimer = null; }
    liveRetryCount = 0;
  }
  function stillRetrying() {
    return !!(liveRetryTimer || (liveRetryCount > 0 && liveRetryCount < LIVE_RETRY_MAX));
  }
  function scheduleLiveRetry() {
    if (liveRetryTimer) return;
    if (liveRetryCount >= LIVE_RETRY_MAX) { render(); return; }  // 放弃了，让用户手动刷新
    const wait = LIVE_RETRY_DELAYS[Math.min(liveRetryCount, LIVE_RETRY_DELAYS.length - 1)];
    liveRetryCount += 1;
    liveRetryTimer = setTimeout(() => { liveRetryTimer = null; loadLive('retry'); }, wait);
  }
  async function loadLive(reason) {
    const requestId = ++liveRequestId;
    // 用户主动刷新 / 换标的 → 重新开始计数；只有"重试"这一轮保持退避进度，
    // 否则每次重试都会把计数清零，变成 3 秒一次的死循环。
    if (reason !== 'retry') clearLiveRetry();
    if (typeof location !== 'undefined' && location.protocol === 'file:') {
      S.live.status = 'error';
      S.live.error = '当前通过文件预览打开，无法接入 Bitget Agent Hub 后端。请运行启动MyDesk.cmd，并打开 http://127.0.0.1:4173/。';
      render();
      toast('实时行情需要本机服务', '请从 http://127.0.0.1:4173/ 打开，文件预览不能调用后端。', true);
      return;
    }
    const syms = reviewMarketSymbols();
    if (!syms.length) {
      S.live.status = 'idle';
      ensureInstrument();
      render();
      return;
    }
    if (!L) {
      S.live.status = 'error';
      S.live.error = '本次构建没有内联 live.js（请用 npm run build 重新构建）';
      render();
      return;
    }
    S.live.status = 'loading';
    render();
    try {
      const r = await L.loadDataSource({ symbols: syms, days: 240 });
      if (requestId !== liveRequestId) return;
      const allBars = r.source.caches.reduce((a, c) => a.concat(c.bars.filter(b => b.is_closed)), []);
      if (!allBars.length) throw new Error('关注标的尚无可用的已收盘日线');
      const latest = allBars.reduce((m, b) => (!m || b.time > m) ? b.time : m, null);
      const earliest = allBars.reduce((m, b) => (!m || b.time < m) ? b.time : m, null);

      const wasLive = S.live.mode === 'live';
      E.setClock({ today: L.msToLocalDate(Date.now()), nowIso: new Date().toISOString() });
      service = E.createService({ source: r.source, persist: storage || null });
      S.memoryDrafts.clear();
      // 换数据源了，选中的标的可能不在新目录里（合成 ↔ 实时两套 id 不同），
      // 必须换一个，否则 row() 取不到值
      ensureInstrument();

      liveRangeMin = earliest;
      liveRangeMax = latest;
      const watchKeys = new Set(S.watch.map(watchKey));
      const reviewOnlyCount = syms.filter((s) => !watchKeys.has(watchKey(s))).length;
      S.live = { mode:'live', status:'ready', via:r.meta.via,
                 // loadDataSource 本来就要拉全市场目录，顺手带回来了，直接留着给搜索用。
                 // 不收下的话，用户还得再去点一次「拉取全市场目录」才能添加标的。
                 universe: (r.universe && r.universe.length) ? r.universe : S.live.universe,
                 universeErr:null,
                 meta:Object.assign({}, r.meta, {watching:S.watch.length, reviewing:reviewOnlyCount}),
                 error:null, min:earliest, max:latest, at:new Date() };
      if (!wasLive || S.date > latest || S.date < earliest) S.date = latest;

      const prevTheme = S.theme;
      openView();
      S.theme = prevTheme;
      render();
      const warn = (r.meta.warnings || []).length;
      clearLiveRetry();   // 接上了，退避计数归零
      toast('实时行情已接入',
        S.watch.length + ' 只关注' + (reviewOnlyCount ? ' · ' + reviewOnlyCount + ' 只历史判断后台复核' : '')
        + ' · ' + (r.meta.via === 'agent-hub' ? '经 Agent Hub 后端' : r.meta.via === 'relay' ? '经本机中转' : '浏览器直连')
        + (warn ? ' · ' + warn + ' 条提示' : ''),
        reason === 'auto' ? false : false);
      maybeShowVerdict();
      refreshThesisReviews();
    } catch (e) {
      if (requestId !== liveRequestId) return;
      S.live.status = 'error';
      S.live.error = (e && e.message) ? e.message : String(e);
      render();
      // 经服务端中转时，错误会被重新包装成新的 Error（只剩 message，永久标记丢失），
      // 所以除了看标记，再按文案兜底识别一次「标的根本不在目录里」这类永久错误。
      const permanent = !!(e && (e.permanent || /没有拉到任何标的的行情|未收录|已下线/.test(String(e.message || ''))));
      if (permanent) {
        // 永久错误重试没有意义，停下来（否则状态栏一直挂「重试中」，用户以为在自救）。
        clearLiveRetry();
        // 历史遗留：关注列表里可能存着 Bitget 已经没有的代码（早期内置清单里的幽灵标的）。
        // 既然已经知道是哪个，就直接清掉再重拉一次，用户不必自己去找。
        const gone = [];
        const re = /未收录\s*[\/／]\s*已下线：([A-Za-z0-9_]+)/g;
        let mm; while ((mm = re.exec(String(S.live.error || ''))) !== null) gone.push(mm[1]);
        const left = S.watch.filter((s) => gone.indexOf(s) < 0);
        if (gone.length && left.length !== S.watch.length) {
          watchSet(left);
          toast('已自动移除 Bitget 没有的标的', gone.join('、') + ' 不在 Bitget 目录里，已从关注列表移除。', true);
          render();
          setTimeout(() => loadLive('watch'), 0);
          return;
        }
        toast('关注列表里有 Bitget 没有的标的',
          S.live.error + ' · 请到「设置」里删掉它，或点「恢复默认关注」。', true);
      } else {
        toast(S.live.mode === 'live' ? '行情刷新失败，保留上次数据' : '实时行情不可用，当前为合成演示',
          (S.live.mode === 'live' ? S.live.error : S.live.error + ' · 正在自动重试…'), true);
        scheduleLiveRetry();
        // 失败也要弹一次：这时用的是演示工作区，弹的就是演示卡（03 §5.3）
        maybeShowVerdict();
      }
    }
  }

  // ── 设置页：数据源状态 ──────────────────────────────────────────────
  function livePanel() {
    const loading = S.live.status === 'loading';
    const live = S.live.mode === 'live';
    const openedAsFile = typeof location !== 'undefined' && location.protocol === 'file:';
    const rows = [];
    rows.push('<div class="data-row"><span>当前数据源</span><span class="accent">' + esc(sourceLabel()) + '</span></div>');
    if (live && S.live.meta) {
      rows.push('<div class="data-row"><span>传输路径</span><span>' + (S.live.via === 'agent-hub' ? 'Agent Hub 后端（官方 SDK）' : S.live.via === 'relay' ? '本机中转（服务端走代理）' : '浏览器直连 Bitget') + '</span></div>');
      rows.push('<div class="data-row"><span>全市场可用</span><span>' + S.live.meta.universe + ' 只代币化美股</span></div>');
      rows.push('<div class="data-row"><span>本次关注</span><span>' + (S.live.meta.watching == null ? S.watch.length : S.live.meta.watching) + ' 只</span></div>');
      if (S.live.meta.reviewing) rows.push('<div class="data-row"><span>历史判断后台复核</span><span>' + S.live.meta.reviewing + ' 只</span></div>');
      rows.push('<div class="data-row"><span>数据区间</span><span>' + esc(minDate()) + ' → ' + esc(maxDate()) + '</span></div>');
      rows.push('<div class="data-row"><span>最近拉取</span><span>' + new Date(S.live.at).toLocaleString('zh-CN', { hour12:false }) + '</span></div>');
    }
    if (S.live.error) {
      rows.push('<div class="data-row"><span>失败原因</span><span class="danger">' + esc(S.live.error) + '</span></div>');
    }
    const warnList = (live && S.live.meta && S.live.meta.warnings) || [];
    const warnHtml = warnList.length
      ? '<ul class="tiny muted" style="margin:8px 0 0;padding-left:18px">' + warnList.slice(0, 8).map((w) => '<li>' + esc(w) + '</li>').join('') + '</ul>'
      : '';
    return '<section class="panel"><div class="panel-header"><h2>实时行情</h2>' + icon('spark') + '</div>'
      + '<p class="tiny muted">行情来自 Bitget 公开接口的代币化美股（rToken）。点击刷新获取最新价格，而指标计算与复核'
      + '<b>只使用已收盘日线</b>——这是确定性内核的要求，不因为接了实时数据而改变。</p>'
      + '<div class="data-list" style="margin-top:12px">' + rows.join('') + '</div>' + warnHtml
      + (openedAsFile ? '<div class="detail-warning">当前以文件预览方式打开，不能访问本机 Bitget 后端。<a class="btn small" style="margin-left:10px" href="http://127.0.0.1:4173/">打开本机服务</a></div>' : '')
      + '<div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">'
      + '<button class="btn small" data-action="live-refresh" ' + (loading ? 'disabled' : '') + '>' + icon('check') + (loading ? '正在拉取…' : '刷新实时行情') + '</button>'
      + '<button class="btn small ghost" data-action="watch-default">恢复默认关注</button>'
      + '<button class="btn small ghost" data-action="watch-clear-search">清空搜索</button>'
      + (!openedAsFile ? '<a class="btn small ghost" href="/startup">连接检查 / 更换代理</a>' : '')
      + '</div></section>';
  }

  // ── 设置页：关注列表 ────────────────────────────────────────────────
  /**
   * 可供搜索添加的标的。
   *
   * 全市场目录（1600+ 只）要联网才拿得到。没有它的时候，搜索框不该是一片空白 ——
   * 那样用户会以为「根本没法添加标的」。所以始终把内置常用清单并进来：
   * 有网络时被更完整的目录覆盖，没网络也能搜、能加。
   */
  function searchPool() {
    const bySym = {};

    /** 补一条内置记录（中文名 + 代码） */
    const put = (sym, name, group) => {
      if (!sym) return;
      const cur = bySym[sym];
      if (cur) {
        if (name && !cur.name) cur.name = name;
        if (group && cur.groups.indexOf(group) < 0) cur.groups.push(group);
        return;
      }
      bySym[sym] = {
        symbol: sym,
        underlying: sym.replace(/^r/, ''),
        name: name || '',
        product_symbol: sym.replace(/^r/, '').toUpperCase() + 'USDT',
        groups: group ? [group] : [],
      };
    };

    // ① 内置常用清单 + 分组标签（不依赖网络，中文也能搜）
    ((L && L.POPULAR_STOCKS) || []).forEach((pair) => put(pair[0], pair[1]));
    ((L && L.CURATED_GROUPS) || []).forEach((g) => {
      g.symbols.forEach((sym) => put(sym, '', g.name));
    });

    // ② 全市场目录合并进来。注意是「合并」不是「覆盖」——
    //    目录里只有英文代码，直接盖掉的话中文名和分组标签就没了，
    //    表现就是拉过一次目录之后，「美光」「半导体」这类词再也搜不到。
    (S.live.universe || []).forEach((i) => {
      const mine = bySym[i.symbol];
      bySym[i.symbol] = mine
        ? Object.assign({}, i, { name: mine.name, groups: mine.groups })
        : i;
    });

    return Object.keys(bySym).map((k) => bySym[k]);
  }

  function watchPanel() {
    const groups = (L && L.CURATED_GROUPS) || [];
    const groupHtml = groups.map((g) => {
      const addable = g.symbols.filter((x) => S.watch.indexOf(x) < 0).length;
      return '<button class="btn small ghost" data-action="watch-group" data-group="' + esc(g.name) + '" '
        + (addable ? '' : 'disabled') + '>' + esc(g.name) + '<small class="tiny muted"> +' + addable + '</small></button>';
    }).join('');

    const chips = S.watch.map((sym) => {
      // 目录没载入时退回内置清单取名字。否则像 rAI 会显示成 "AI"，
      // 而列表里显示的是 "C3.ai" —— 同一个标的两套名字，用户根本对不上。
      const ins = S.live.universe.find((i) => i.symbol === sym)
        || searchPool().find((i) => i.symbol === sym);
      const label = ins ? ins.underlying : sym.replace(/^r/, '');
      return '<span class="watch-chip">' + esc(label)
        + '<button class="icon-btn tiny" data-action="watch-remove" data-symbol="' + esc(sym) + '" '
        + 'aria-label="移除 ' + esc(label) + '" title="移除 ' + esc(label) + '">' + icon('close') + '</button></span>';
    }).join('');

    const q = (S.watchQuery || '').trim().toLowerCase();
    let results = '';
    if (!q) {
      // 不再把「先拉全市场目录」当成前置条件：内置清单本来就能搜能加
      results = '<p class="tiny muted">输入代码或名称开始搜索（例如 MU / 美光 / AMZN）。'
        + (S.live.universe.length
            ? '已载入全市场 ' + S.live.universe.length + ' 只代币化美股。'
            : '当前用内置常用清单；想看全市场 1600 只，点下面按钮拉一次。')
        + (S.live.universeErr ? '（全市场目录没拉到：' + esc(S.live.universeErr) + '）' : '')
        + '</p>';
    } else {
      const hits = searchPool().filter((i) => i.symbol.toLowerCase().indexOf(q) >= 0
        || i.underlying.toLowerCase().indexOf(q) >= 0
        || (i.name || '').toLowerCase().indexOf(q) >= 0
        || (i.groups || []).some((g) => g.toLowerCase().indexOf(q) >= 0)
        || (company[i.underlying] || '').indexOf(q) >= 0).slice(0, 30);
      results = hits.length
        ? '<div class="watch-results">' + hits.map((i) => {
            const own = S.watch.indexOf(i.symbol) >= 0;
            return '<button class="watch-hit" data-action="watch-add" data-symbol="' + esc(i.symbol) + '" '
              + (own ? 'disabled' : '') + '>' + icon(own ? 'check' : 'plus')
              + '<b>' + esc(i.name || company[i.underlying] || i.underlying) + '</b>'
              + '<small class="muted">' + esc(i.symbol) + ' · ' + esc(i.product_symbol) + '</small>'
              + (own ? '<em class="tiny">已关注</em>' : '') + '</button>';
          }).join('') + '</div>'
        : '<p class="tiny muted">没有匹配的标的。</p>';
    }

    return '<section class="panel"><div class="panel-header"><h2>关注列表</h2>' + icon('layers') + '</div>'
      + '<p class="tiny muted">关注列表决定工作台上出现哪些标的。增删之后会立刻按新列表拉一次行情。</p>'
      + '<div class="watch-chips" style="margin-top:12px">' + (chips || '<span class="tiny muted">还没有关注任何标的</span>') + '</div>'
      + '<div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">'
      + '<span class="tiny muted" style="align-self:center">精选分组：</span>' + groupHtml + '</div>'
      + '<div class="watch-search" style="margin-top:16px">'
      + '<label class="hidden" for="watch-search">搜索标的</label>'
      + '<input id="watch-search" placeholder="搜索代码或名称，例如 MU / 美光 / AMZN" value="' + esc(S.watchQuery || '') + '" autocomplete="off">'
      + '</div>'
      + '<div id="watch-results" style="margin-top:10px">' + results + '</div>'
      + '<div class="row" style="gap:10px;margin-top:14px;flex-wrap:wrap">'
      + '<button class="btn small ghost" data-action="watch-load-universe">' + icon('download')
      + (S.live.universe.length ? '刷新全市场目录' : '拉取全市场目录') + '</button>'
      + '<span class="tiny muted" style="align-self:center">约 1600 只，需要联网</span></div>'
      + '</section>';
  }

  function screenerResults() {
    const q=(S.watchQuery||'').trim().toLowerCase();
    const filter=S.screenerFilter||'all';
    let list=searchPool().filter((i)=>{
      const own=S.watch.indexOf(i.symbol)>=0;
      if(filter==='watching'&&!own) return false;
      if(filter==='available'&&own) return false;
      if(filter.startsWith('group:')&&!(i.groups||[]).includes(filter.slice(6))) return false;
      return !q || i.symbol.toLowerCase().includes(q)
        || i.underlying.toLowerCase().includes(q)
        || (i.name||'').toLowerCase().includes(q)
        || (i.groups||[]).some(g=>g.toLowerCase().includes(q))
        || (company[i.underlying]||'').toLowerCase().includes(q);
    });
    list=list.sort((a,b)=>{
      const selected=Number(S.watch.includes(b.symbol))-Number(S.watch.includes(a.symbol));
      return selected||(a.underlying||a.symbol).localeCompare(b.underlying||b.symbol);
    });
    if(!list.length) return '<p class="tiny muted screener-empty">没有匹配的 rToken。可以改一下搜索词或筛选条件。</p>';
    const visible=list.slice(0,120);
    return '<div class="screener-results">'+visible.map((i)=>{
      const own=S.watch.includes(i.symbol);
      const meta=[i.symbol,i.product_symbol,i.min_trade_usdt?'最低 '+i.min_trade_usdt+' USDT':''].filter(Boolean).join(' · ');
      return '<button class="screener-row watch-hit" '+(own?'disabled':'data-action="watch-add" data-symbol="'+esc(i.symbol)+'"')+'><span class="ticker-icon '+esc(i.symbol)+'">'+esc(monogram[i.symbol]||i.underlying.slice(0,2))+'</span><span class="screener-name"><b>'+esc(i.name||company[i.underlying]||i.underlying)+'</b><small>'+esc(meta)+'</small></span>'
        +(i.groups&&i.groups.length?'<span class="screener-group">'+esc(i.groups[0])+'</span>':'')
        +'<span class="screener-add '+(own?'selected':'')+'">'+icon(own?'check':'plus')+(own?'已加入':'加入研究')+'</span></button>';
    }).join('')+(list.length>visible.length?'<p class="tiny muted screener-limit">已显示前 '+visible.length+' 只；可用搜索或分类继续筛选，共 '+list.length+' 只。</p>':'')+'</div>';
  }

  function screenerPanel() {
    const groups=(L&&L.CURATED_GROUPS)||[];
    const pool=searchPool();
    const current=S.screenerFilter||'all';
    const button=(key,label)=>'<button class="filter '+(current===key?'active':'')+'" data-action="screener-filter" data-filter="'+esc(key)+'">'+esc(label)+'</button>';
    const groupFilters=groups.map(g=>button('group:'+g.name,g.name)).join('');
    const groupAdds=groups.map(g=>{
      const addable=g.symbols.filter(sym=>S.watch.indexOf(sym)<0).length;
      return '<button class="btn small ghost" data-action="watch-group" data-group="'+esc(g.name)+'" '+(addable?'':'disabled')+'>'+esc(g.name)+'<small class="tiny muted"> +'+addable+'</small></button>';
    }).join('');
    const selected=S.watch.length;
    const total=S.live.universe.length;
    const mcp=S.mcpStatus;
    const mcpText=S.mcpLoading?'正在检查 Bitget MCP…':mcp?(mcp.connected?'MCP 已连接 · '+(mcp.toolCount||0)+' 个工具':'MCP 暂不可用 · '+esc(mcp.error||'未返回原因')):'MCP 尚未检测';
    const sourceText=total?'Bitget Agent Hub 已同步 '+total+' 只在线 rToken':S.live.universeErr?'Bitget 全量目录暂不可用：'+S.live.universeErr:'尚未同步 Bitget 全量目录；当前展示本地可搜索的常用 rToken。';
    return '<section class="panel screener-panel"><div class="panel-header"><div><h2>Bitget rToken 选股器</h2><p class="tiny muted">'+esc(sourceText)+'</p></div><button class="btn small" data-action="watch-load-universe" '+(S.universeLoading?'disabled':'')+'>'+icon('download')+(S.universeLoading?'同步中…':'同步 Bitget 全量目录')+'</button></div>'
      +'<div class="screener-summary"><span>已加入研究 <b class="mono">'+selected+'</b></span><span>可搜索标的 <b class="mono">'+(total||pool.length)+'</b></span><span>数据范围 <b>在线 rToken / USDT</b></span></div>'
      +'<div class="watch-chips">'+(S.watch.map(sym=>'<span class="watch-chip">'+esc((S.live.universe.find(i=>i.symbol===sym)||{}).underlying||sym.replace(/^r/,''))+'<button class="icon-btn tiny" data-action="watch-remove" data-symbol="'+esc(sym)+'" aria-label="移除 '+esc(sym)+'">'+icon('close')+'</button></span>').join('')||'<span class="tiny muted">还没有加入研究的标的</span>')+'</div>'
      +'<div class="filters screener-filters" role="group" aria-label="选股器筛选">'+button('all','全部')+button('watching','已加入')+button('available','未加入')+groupFilters+'</div>'
      +'<div class="screener-quick-add"><span class="tiny muted">快捷加入：</span>'+groupAdds+'</div>'
      +'<div class="watch-search screener-search"><label class="hidden" for="watch-search">搜索 rToken</label><input id="watch-search" placeholder="搜索代码、公司或分类，例如 META / Meta / 半导体" value="'+esc(S.watchQuery||'')+'" autocomplete="off"></div>'
      +'<div id="watch-results">'+screenerResults()+'</div>'
      +'<div class="screener-mcp"><div><b>Bitget MCP</b><p class="tiny muted">'+mcpText+'</p></div><button class="btn small ghost" data-action="screener-mcp-probe" '+(S.mcpLoading?'disabled':'')+'>'+icon('check')+'检查 MCP</button></div>'
      +'<p class="tiny muted screener-note">目录与 rToken 行情均以 Agent Hub 的 Bitget 现货数据为准；MCP 用于扩展参考工具，不会把 Meta 原股或其他标的价格混进代币化股票图表。</p></section>';
  }

  function settingsBase() {
    return heading('清楚每一条数据从哪里来。','行情边界、本地存储和计算口径，都在这里。','TRANSPARENT BY DESIGN')+`<div class="insight-grid"><section class="panel"><div class="panel-header"><h2>研究空间与数据</h2>${icon('layers')}</div><div class="data-list"><div class="data-row"><span>当前空间</span><span>我的研究空间</span></div><div class="data-row"><span>行情来源</span><span class="accent">${esc(sourceLabel())}</span></div><div class="data-row"><span>缓存区间</span><span class="mono">${minDate()} – ${maxDate()}</span></div><div class="data-row"><span>行情网络请求</span><span class="mono">${service.marketRequests()}</span></div><div class="data-row"><span>研究记录</span><span>${allCards().length} 张</span></div><div class="data-row"><span>存储方式</span><span>${storage?'当前浏览器的本地存储':'仅本次会话内存'}</span></div><div class="row wrap" style="margin-top:17px"><button class="btn small" data-action="export">${icon('download')}导出 JSON</button></div></div></section><section class="panel"><div class="panel-header"><h2>读懂这张快照</h2>${icon('lock')}</div><div class="help-text"><p>研究日期是当时允许看见数据的边界。保存时间是真实操作的时刻。历史回放中，两者可以不同。</p><p style="margin-top:13px">新判断会把原话与已收盘行情持续对照；旧卡已经保存的机械条件仍按原口径回看。缺失日线不会补成零，也不会宣称确定的首次触发日。</p><p style="margin-top:13px">红色表示上涨，绿色表示下跌。USDT 报价属于 rMETA 代币化股票，不代表纳斯达克原股票现价。</p></div></section><section class="panel"><div class="panel-header"><h2>你的研究，由你保管</h2>${icon('folder')}</div><div class="help-text"><p>数据保存在当前浏览器与当前打开地址下。移动 HTML 文件、换浏览器或清理浏览器数据后，原有本地记录可能无法读取。建议定期导出 JSON，保留原话、快照、复盘与承接关系。</p><p style="margin-top:13px">此版本不会自动创建研究记录；所有判断都由你在“我的研究空间”中写入。</p></div></section><section class="panel"><div class="panel-header"><h2>服务活动</h2><span class="badge">最近 8 条</span></div><div class="data-list">${service.getLog().slice(-8).reverse().map(l=>`<div class="log-item">${esc(l.label)}<p>${esc(l.detail)}</p></div>`).join('')}</div></section></div>`;
  }

  /** 选股器以 Bitget 当前在线 rToken 目录为入口，行情与研究记录仍在同一工作流内。 */
  function settings() { return heading('从 Bitget 的代币化股票里，挑出要研究的标的。','先搜索和筛选，再加入研究空间；所有价格与 K 线只使用对应 rToken。','BITGET RTOKEN SCREENER') + screenerPanel() + aiSettings() + trashPanel() + livePanel(); }

  /**
   * 「最近删除」—— 回收站的入口。
   *
   * 删除之后提示条里就有「撤销」，但提示条十来秒就没了；错过的人得有地方找回来，
   * 否则「可以恢复」就只是一句话。
   */
  function trashPanel() {
    const r=service.list_trash({workspace_id:workspace()});
    const items=r.ok?r.data:[];
    /** 彻底删除是不可逆的，逐条也一样 —— 所以和批量删除走同一套「原地变成确认条」。 */
    const actions=(t)=>S.trashAsk===t.trash_id
      ? '<div class="row trash-actions confirming"><span class="tiny danger-note">'+icon('info')+'找不回来</span>'
        +'<button class="btn small ghost" data-action="trash-keep">再想想</button>'
        +'<button class="btn small danger" data-action="trash-purge-confirm" data-trash="'+esc(t.trash_id)+'">确认删除</button></div>'
      : '<div class="row trash-actions"><button class="btn small" data-action="trash-restore" data-trash="'+esc(t.trash_id)+'">恢复</button>'
        +'<button class="btn small ghost btn-delete" data-action="trash-purge" data-trash="'+esc(t.trash_id)+'">彻底删除</button></div>';
    const rows=items.length
      ? items.map(t=>'<div class="trash-row"><div class="trash-main"><strong>'+esc(t.symbol||'—')+'</strong>'
          +'<span class="mono muted">'+esc(t.bar_date||'—')+'</span>'
          +'<p>'+esc(String(t.judgment||'').slice(0,80))+'</p></div>'
          +'<span class="tiny muted trash-when">'+(t.deleted_at?new Date(t.deleted_at).toLocaleString('zh-CN',{hour12:false}):'')+'</span>'
          +actions(t)+'</div>').join('')
      : '<p class="help-text">回收站是空的。删除判断时会先放进来，「撤销」或从这里都能恢复。</p>';
    const foot=!items.length?''
      : S.trashAsk==='all'
        ? '<div class="trash-foot danger-zone"><span class="tiny danger-note">'+icon('info')
          +'回收站里这 '+items.length+' 张会全部彻底删掉，之后找不回来。</span>'
          +'<div class="row" style="gap:8px"><button class="btn small ghost" data-action="trash-keep">再想想</button>'
          +'<button class="btn small danger" data-action="trash-clear-confirm">确认清空</button></div></div>'
        : '<div class="trash-foot"><span class="tiny muted">最多留 20 条，超出会挤掉最旧的。彻底删除之后找不回来。</span>'
          +'<button class="btn small ghost btn-delete" data-action="trash-clear">清空回收站</button></div>';
    return '<section class="panel trash-panel"><div class="panel-header"><h2>最近删除</h2>'
      +'<span class="badge">'+items.length+' / 20</span></div>'
      +'<div class="trash-list">'+rows+'</div>'+foot+'</section>';
  }

  /** 只换回收站那一块，不整页重渲染（设置页上有选股器，重建会把它连同输入一起重置）。 */
  function refreshTrashPanel() {
    const el=$('.trash-panel'), box=el&&el.parentNode;
    if(!el||!box){render();return;}
    const tmp=document.createElement('div');
    tmp.innerHTML=trashPanel();
    box.replaceChild(tmp.firstElementChild,el);
  }

  // 页面关掉时还在路上的请求已经丢了：不清掉的话会一直显示「分析中」，转译按钮也一直是灰的
  Object.values(S.drafts).forEach(d=>{if(!d||typeof d!=='object')return;if(d.plain&&d.plain.busy)d.plain=null;if(d.ai&&d.ai.busy)d.ai=null;});
  ensureInstrument();
  openView();render();
  if(!storage)toast('当前为临时会话模式','浏览器未开放本地存储，请在离开前导出研究。',true);
  loadLive('auto');
  // 服务端可能已经用环境变量配好了 Key（那样页面里就不必填），探一次拿到状态即可。
  // 拿不到也不影响：转译会走规则兜底，页面照常可用。
  if (T && T.probeServer) {
    Promise.resolve(T.probeServer({ storage: storage })).then((v) => {
      S.aiServer = v || null;
      if (S.page === 'settings') render();
    }).catch(() => { S.aiServer = null; });
  }
})();
</script>
</body>
</html>
