/* ── AI 转译 ──────────────────────────────────────────────────────────────
   全部走主题变量，深浅两套自动跟随（不再出现「写死颜色切主题不变」的问题）。*/
.ai-bar{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.ai-btn{border-color:var(--accent);color:var(--accent)}
.ai-btn:hover:not(:disabled){background:var(--accent-bg)}
.ai-btn .icon{width:14px;height:14px}
.ai-panel{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:13px}
.ai-loading{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12px;flex-wrap:wrap}
.ai-loading .icon{width:14px;height:14px;color:var(--accent)}
.ai-pair{display:grid;gap:9px}
.ai-side{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 11px}
.ai-side-out{border-color:var(--accent);background:var(--accent-bg)}
.ai-label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
.ai-label .icon{width:13px;height:13px}
.ai-side p{font-size:13px;line-height:1.75;white-space:pre-wrap;color:var(--text)}
.ai-side-out p{color:var(--text)}
.ai-tag{margin-left:auto;font-size:10.5px;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:1px 5px;letter-spacing:0}
.ai-warn{margin-top:10px;border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:6px;background:var(--panel);padding:9px 11px;font-size:12px;color:var(--amber);line-height:1.6}
.ai-warn.ok{border-left-color:var(--accent);color:var(--accent)}
.ai-warn b{display:block;margin-bottom:4px}
.ai-warn ul{margin:0;padding-left:16px}
.ai-warn li{margin:2px 0}
.ai-suggestions{margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px 11px;font-size:12px;color:var(--sub);line-height:1.55}
.ai-suggestions b{display:block;color:var(--text);font-weight:600;margin-bottom:7px}
.ai-suggest-row{display:grid;grid-template-columns:minmax(92px,max-content) minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.ai-suggest-row:first-of-type{border-top:0;padding-top:0}
.ai-suggest-row span{color:var(--accent);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.ai-suggest-row small{color:var(--muted);font-size:11px}
.ai-cond{margin-top:9px;font-size:12px;color:var(--sub);display:flex;align-items:flex-start;gap:6px;line-height:1.6}
.ai-cond .icon{width:13px;height:13px;margin-top:3px;color:var(--accent);flex-shrink:0}
.ai-cond b{color:var(--text);font-weight:500}
.ai-actions{margin-top:11px;gap:8px;flex-wrap:wrap}
.ai-done{display:flex;align-items:center;gap:4px;align-self:center}
.ai-done .icon{width:13px;height:13px;color:var(--accent)}
.ai-state{margin:10px 0 15px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ai-state b{color:var(--accent)}
.ai-input{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:8px 10px;font-size:12px;margin-bottom:11px;color:var(--text)}
.ai-input:focus{border-color:var(--accent)}
.ai-presets{gap:6px;margin:2px 0 12px;flex-wrap:wrap}
.ai-note{margin-top:12px;line-height:1.75}
.ai-note .mono{color:var(--sub);word-break:break-all}

/* ── 多想一步 · 说清楚 ──────────────────────────────────────────────────────
   紧跟在 AI 转译面板下面。全部走主题变量，深浅两套自动跟随。
   类名一律 ps-*：snapshot-* 和 .ai-panel > .ai-suggestions 被现有测试锁着，不能复用。*/
.ps-block{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:12px 13px;font-size:12px;line-height:1.65;color:var(--text);overflow-wrap:anywhere}
.ps-block h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--sub);letter-spacing:.3px}
.ps-block ul{margin:0;padding-left:15px}
.ps-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--text)}
.ps-title .icon{width:14px;height:14px;color:var(--accent)}
.ps-title span{font-weight:400;font-size:12px;color:var(--muted)}
.ps-lead{margin-top:3px;font-size:12px;color:var(--sub)}
.ps-meta{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.6}
.ps-loading{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:12px;color:var(--sub)}
.ps-loading .icon{width:14px;height:14px;color:var(--accent)}
.ps-off,.ps-stale{margin-top:10px;border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:6px;background:var(--panel);padding:7px 10px;font-size:12px;color:var(--amber);line-height:1.6}
.ps-off small{display:block;margin-top:3px;color:var(--muted)}
.ps-off .text-btn{display:inline-block;margin-top:4px}
.ps-stale{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ps-block.is-stale .ps-meta,.ps-block.is-stale .ps-readings,.ps-block.is-stale .ps-objections{opacity:.45}
.ps-section{margin-top:10px}
.ps-reading{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px}
.ps-reading+.ps-reading{margin-top:7px}
.ps-line{font-size:13px;color:var(--text)}
.ps-line b{font-weight:650;color:var(--accent)}
.ps-now{margin-top:2px;font-size:12px;color:var(--sub)}
.ps-note{margin-top:2px;font-size:12px;color:var(--muted)}
.ps-check{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.ps-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.ps-actions .btn{padding:3px 9px;font-size:12px}
.ps-actions .btn.ghost{border-color:var(--line);color:var(--accent)}
.ps-done{font-size:12px;color:var(--accent)}
.ps-objections{border-top:1px solid var(--line);padding-top:9px}
.ps-objection+.ps-objection{margin-top:8px}
.ps-objection p::before{content:'· ';color:var(--amber)}
.ps-vol{margin-top:8px;padding-left:9px;border-left:2px solid var(--line)}
.ps-vol p{font-size:12px;color:var(--sub)}
.ps-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ps-chip{font-size:11.5px;line-height:1.7;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--panel)}
.ps-chip b{font-family:var(--mono);font-weight:500;color:var(--text)}
.ps-empty{font-size:12px;color:var(--sub)}
.ps-kept{margin-top:10px;border:1px dashed var(--accent);border-radius:8px;background:var(--accent-bg);padding:7px 10px}
.ps-kept h4{color:var(--accent);margin-bottom:3px}
.ps-kept-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;padding:2px 0;font-size:12px;color:var(--text)}
.ps-kept-row .icon-btn{width:20px;height:20px;flex-shrink:0;color:var(--muted)}
.ps-kept-row .icon-btn .icon{width:12px;height:12px}
.ps-fixed{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--muted);line-height:1.6}
.ps-fixed h4{font-size:12px}
.ps-foot{margin-top:7px;font-size:11.5px;color:var(--muted)}
.ps-loading .text-btn{margin-left:auto}

/* ==========================================================================
   浅色主题补完
   下面这些规则原本把颜色直接写死（#242a21 / #16191a 之类），不经过 --xxx 变量，
   所以切到浅色主题时变量虽然换了、它们却不变 —— 表现就是「深色卡片浮在浅色页面上」。
   这里按同样的语义给一份浅色值。深色主题不受影响（选择器只匹配 light）。
   ========================================================================== */
:root[data-theme="light"] .btn.primary:hover:not(:disabled){background:#5e7628}
:root[data-theme="light"] .badge.met_now{background:#e7efd6}
:root[data-theme="light"] .badge.unknown{background:#f7ecd6}
:root[data-theme="light"] .badge.met_before{background:#ebe7f7;color:#5d4f8a}
:root[data-theme="light"] .badge.waiting{background:#e4eef4;color:#3f6b80}
:root[data-theme="light"] .workspace-switch .square{border-color:#b9c6a6}
:root[data-theme="light"] .ticker-icon{background:#e7efd6;color:#52701f}
:root[data-theme="light"] .ticker-icon.AAPLx{background:#eceef0;color:#3d4348}
:root[data-theme="light"] .ticker-icon.TSLAx{background:#f9e7e7;color:#a8403c}

/* 条件 Agent 引导块 —— 放在输入框正下方，视觉上就是「保存前先走这一步」。
   全部用主题变量，深浅两套自动跟随。*/
.ai-cta{margin-top:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border:1px solid var(--accent);border-left-width:3px;border-radius:10px;
  background:var(--accent-bg);padding:11px 13px}
.ai-cta-copy{flex:1;min-width:140px;display:flex;flex-direction:column;gap:2px}
.ai-cta-copy b{font-size:12px;font-weight:650;color:var(--text)}
.ai-cta-copy span{font-size:12px;color:var(--sub);line-height:1.55}
.ai-cta-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-cta-actions .ai-setup-link{margin-left:0}
/* 首次使用提醒：没配 LLM 时浮在「读一遍」上方。用琥珀色而不是强调色 ——
   它是「建议先做这件事」，不是「这里有个入口」。用户点过知道了就收起来。 */
.ai-firstrun{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;
  background:#302a2080;padding:10px 12px}
:root[data-theme="light"] .ai-firstrun{background:#fdf4e4}
.ai-firstrun>.icon{color:var(--amber);width:15px;height:15px;flex:none}
.ai-firstrun-copy{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px}
.ai-firstrun-copy b{font-size:12px;font-weight:650;color:var(--amber)}
.ai-firstrun .icon-btn{width:26px;height:26px;flex:none;color:var(--muted)}
.ai-firstrun .icon-btn .icon{width:13px;height:13px}
@media(max-width:580px){.ai-firstrun{align-items:flex-start}.ai-firstrun .btn{width:100%}}
.ai-cta-btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
  font-weight:600;padding:9px 14px;white-space:nowrap}
.ai-cta-btn:hover:not(:disabled){filter:brightness(1.08)}
.ai-cta-btn .icon{width:15px;height:15px}
/* 已经读过就安静下来，别一直抢眼 */
.ai-cta.is-done{background:var(--panel2);border-color:var(--line);border-left-color:var(--muted)}
.ai-cta.is-done .ai-cta-btn{background:transparent;color:var(--accent);border-color:var(--line);font-weight:500}
.ai-cta.is-done .ai-cta-btn:hover:not(:disabled){background:var(--accent-bg);filter:none}

/* ── 「我的判断」：统计带 / 折叠统计 / 工作台提醒条 ──────────────────────
   全部走主题变量，深浅两套自动跟随。*/

/* 工作台底部那条提醒：只在真有事的时候出现，所以可以做得显眼一点 */

  border:1px solid var(--accent);border-left-width:3px;border-radius:10px;

  color:var(--accent);font-weight:600;white-space:nowrap}
.review-reminder .rr-go .icon{width:14px;height:14px}

/* 新手引导：三步清单。已完成的打勾并变淡，当前该做的那步高亮。 */

.ob-steps span.done{opacity:.7}
.ob-steps span.done b{background:var(--accent);color:var(--accent-ink)}
.ob-steps span.current{opacity:1;color:var(--text);font-weight:600}

.ob-hint{margin-top:10px;font-size:12px;color:var(--sub);line-height:1.7;max-width:760px}
.ob-actions{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.ob-actions .text-btn{font-size:11px}

.chart-top-actions{flex-wrap:nowrap}.chart-intervals button{min-width:47px;font-size:12px;padding:4px 9px}.chart-navigation{display:flex;align-items:center;gap:7px;margin:10px 22px 2px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:11px;color:var(--muted)}.chart-navigation .icon-btn{width:26px;height:26px}.chart-window-count{font:10px var(--mono);color:var(--sub);white-space:nowrap}.chart-gesture-hint{font-size:11.5px;color:var(--muted);white-space:nowrap}.chart-zoom{width:100px;accent-color:var(--accent);cursor:pointer}.chart-navigation .text-btn{padding:3px 4px;font-size:11px}.chart-load-note{margin:8px 13px 0}.chart-period-note{margin:8px 18px 0;padding:8px 4px 0;border-top:1px solid var(--line)}@media(max-width:720px){.chart-navigation{margin-left:18px;margin-right:18px;flex-wrap:wrap}.chart-navigation .spacer{display:none}.chart-zoom{flex:1;min-width:74px}.chart-top-actions{gap:4px}.chart-intervals button{min-width:42px;padding-left:7px;padding-right:7px}}@media(max-width:580px){.chart-navigation{margin:8px 14px 0;padding:7px}.chart-navigation>span:first-child{display:none}.chart-gesture-hint{display:none}.chart-window-count{margin-right:auto}.chart-zoom{order:4;width:100%;flex-basis:100%}.chart-period-note{margin-left:14px;margin-right:14px}.chart-intervals button{font-size:11px;min-width:39px;padding:4px 6px}}

/* 拖动 K 线时不要选中文字（图表是 SVG 覆盖层手势，浏览器默认会把拖拽当文本选择） */

/* ══ 市场裁决（《03 市场裁决 · Schema v1.1》 / 《04 LLM 约束》）═══════════
   全部走 --xxx 变量，浅色主题自动跟随；类名一律 verdict-*，
   绝不用 snapshot-*（meta-regression 按下标取 #detail-dialog .snapshot-price）。 */
.verdict-block{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--sub);border-radius:9px;padding:14px 16px;margin-bottom:16px}
.verdict-block.verdict-resolved.verdict-confirmed{border-left-color:var(--accent)}
.verdict-block.verdict-resolved.verdict-refuted{border-left-color:var(--amber)}
.verdict-block.verdict-pending{border-left-color:var(--line);padding:10px 14px}
.verdict-pending-line{margin:0;display:flex;gap:7px;align-items:center;font-size:11px;color:var(--muted);line-height:1.6}
.verdict-pending-line .icon{width:13px;height:13px;flex:none;color:var(--sub)}
.verdict-head h3.verdict-title{margin:0;font-size:15px;font-weight:600;color:var(--text);letter-spacing:.2px}
.verdict-meta{margin:5px 0 0;font:10px/1.6 var(--mono);color:var(--muted)}
.verdict-recap{margin:12px 0 0;font-size:13px;line-height:1.75;color:var(--text)}
.verdict-fact{margin:8px 0 0;font-size:12px;line-height:1.85;color:var(--sub)}
.verdict-consequence{margin:8px 0 0;font-size:12px;line-height:1.7;color:var(--accent)}
.verdict-nudge{margin:8px 0 0;font-size:12px;line-height:1.7;color:var(--amber)}
.verdict-section h4{margin:15px 0 6px;font-size:11.5px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:none}
.verdict-divergence,.verdict-lessons,.verdict-notes{font-size:12px;line-height:1.8;color:var(--sub)}
.verdict-divergence .muted,.verdict-lessons .muted{color:var(--muted)}
.verdict-note,.verdict-lesson{display:flex;gap:7px}
.verdict-note::before,.verdict-lesson::before{content:"·";color:var(--muted);flex:none}
.verdict-line{margin-top:5px;font-size:11.5px;line-height:1.5;color:var(--muted)}
.verdict-history{display:block;color:var(--accent);margin-bottom:4px}
.horizon-hint{color:var(--muted)}
.horizon-hint b{color:var(--accent);font-weight:600}
.verdict-highlight{box-shadow:0 0 0 2px var(--accent-bg),0 0 0 3px var(--accent);animation:verdict-pulse 1.8s ease-in-out 3}
@keyframes verdict-pulse{0%,100%{box-shadow:0 0 0 2px var(--accent-bg),0 0 0 3px var(--accent)}50%{box-shadow:0 0 0 5px var(--accent-bg),0 0 0 6px var(--accent)}}

/* thesis 行情观察：和机械裁决并列，专门承接定性判断与最新技术结构的对照。 */
.thesis-observer{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:14px 16px;margin-bottom:16px}
.thesis-observer.thesis-invalidated{border-left-color:var(--amber)}
.thesis-observer.thesis-insufficient_data{border-left-color:var(--muted)}
.thesis-observer h3{margin:2px 0 0;font-size:14px}.thesis-observer h4{margin:12px 0 6px;font-size:13px;line-height:1.55}.thesis-observer>p{font-size:12px;line-height:1.75;color:var(--sub)}
.thesis-dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}.thesis-dates>div{padding:8px 9px;background:var(--bg);border:1px solid var(--line);border-radius:6px}.thesis-dates span{display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px}.thesis-dates b{font-size:11.5px;font-weight:500;color:var(--text)}
.thesis-line{margin-top:5px;font-size:11.5px;line-height:1.5;color:var(--accent)}
.thesis-user-signals{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.thesis-user-signals>h4{margin:0 0 9px}
.thesis-user-signal{padding:10px 11px;margin:7px 0;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.thesis-user-signal .row>b{font-size:11px;color:var(--text)}
.thesis-user-signal .row>span{font-size:11.5px;color:var(--sub);white-space:nowrap}
.thesis-user-signal.met .row>span{color:var(--accent)}
.thesis-user-signal.unverifiable .row>span{color:var(--amber)}
.thesis-user-signal small{display:block;margin-top:4px;color:var(--muted);font-size:11.5px;line-height:1.55}
.thesis-user-signal p{margin-top:5px!important;font-size:11.5px!important;line-height:1.55!important;color:var(--sub)!important}
.thesis-user-signals>.tiny{margin-top:9px}
.judgment-progress{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
.progress-badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.progress-badge.observing{background:#293238;color:#aebfc7}
.progress-badge.result{background:#35402b;color:var(--accent)}
.judgment-progress p{margin:0;color:var(--sub);font-size:11.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
:root[data-theme="light"] .progress-badge.observing{background:#e7eef1;color:#46616e}
:root[data-theme="light"] .progress-badge.result{background:#e7efd6;color:#607431}
.technical-signals{margin:12px 0 10px;border-top:1px solid var(--line);padding-top:10px}.technical-signals summary{cursor:pointer;font-size:11px;color:var(--text)}
.technical-signal-list{display:grid;gap:6px;margin:9px 0}.technical-signal{display:grid;grid-template-columns:76px minmax(110px,.7fr) 1.5fr;gap:8px;align-items:start;padding:7px 8px;border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:6px;background:var(--panel)}
.technical-signal.bullish{border-left-color:var(--up)}.technical-signal.bearish{border-left-color:var(--down)}.technical-signal span,.technical-signal small{font-size:10.5px;color:var(--muted);line-height:1.45}.technical-signal b{font-size:11.5px;line-height:1.45}

/* ══ 删除一张判断 ══════════════════════════════════════════════════════
   删除不可逆，视觉上要「看得见但不抢眼」：列表里是灰的垃圾桶，只在悬停时
   变红；弹窗里是幽灵按钮，进了确认态才整条变红。全部走变量，浅色主题跟随。 */

/* 列表行尾：去复盘 + 删除，两个都是小按钮，靠右对齐 */
.row-actions{display:flex;align-items:center;justify-content:flex-end;gap:3px}
.row-del{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;border-radius:6px;color:var(--muted);opacity:.5;transition:opacity .15s,background .15s,color .15s}
.row-del .icon{width:14px;height:14px}
tr[data-detail]:hover .row-del,tr[data-detail]:focus-within .row-del{opacity:1}
.row-del:hover{background:var(--hover);color:var(--red);opacity:1}
.row-del:focus-visible{opacity:1}

/* 弹窗底部的「删除这张判断」：平时是安静的幽灵按钮，悬停才提示危险 */
.btn.ghost.btn-delete{color:var(--muted);gap:6px}
.btn.ghost.btn-delete .icon{width:14px;height:14px}
.btn.ghost.btn-delete:hover:not(:disabled){color:var(--red);background:var(--hover)}

/* 确认态：整条底栏换成红色调，说明白删掉什么 */
.btn.danger{border-color:var(--red);background:var(--red);color:var(--bg);font-weight:600}
.btn.danger:hover:not(:disabled){background:var(--red);filter:brightness(1.08)}
.dialog-footer.danger-zone{border-top-color:var(--red);background:#33231f}
:root[data-theme="light"] .dialog-footer.danger-zone{background:#fbebe9}
.danger-note{display:flex;align-items:center;gap:7px;color:var(--red);max-width:520px;line-height:1.6}
.danger-note .icon{width:14px;height:14px;flex:none}
@media(max-width:580px){.row-actions{gap:1px}.row-del{opacity:1}.danger-note{max-width:none}.dialog-footer.danger-zone{flex-direction:column;align-items:stretch}.dialog-footer.danger-zone .row{justify-content:flex-end}}

/* ══ 勾选批量删除 ══════════════════════════════════════════════════════
   勾选框平时是安静的灰，勾上之后才在表格上方浮出操作条。
   删除按钮沿用 .btn.danger（红），「再想想」用幽灵按钮优先落位。 */
.queue-pick{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.queue-pick-cell{text-align:center}
.queue-table tr[data-detail]:has(.queue-pick:checked){background:var(--accent-bg)}
.queue-bulk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;
  border-bottom:1px solid var(--line);background:var(--panel2);font-size:12px}
.queue-bulk b{font-family:var(--mono);color:var(--text)}
.queue-bulk.confirming{border-bottom-color:var(--red);background:#33231f}
:root[data-theme="light"] .queue-bulk.confirming{background:#fbebe9}
.queue-bulk .danger-note{max-width:560px}

/* 提示条里的动作按钮（撤销）。撤销窗口只有十几秒，得让人一眼看见。 */
.toast-action{margin-top:9px;border-color:var(--accent);color:var(--accent)}
.toast-action:hover{background:var(--accent);color:var(--accent-ink)}

/* ══ 回收站 ════════════════════════════════════════════════════════════ */
.trash-list{padding:0 20px}
.trash-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.trash-row:last-child{border-bottom:0}
.trash-main{flex:1;min-width:0}
.trash-main strong{font-size:12px}
.trash-main .muted{margin-left:8px;font-size:11px}
.trash-main p{margin-top:3px;font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trash-when{flex:none;white-space:nowrap}
.trash-actions{flex:none;gap:6px}
.trash-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line);background:var(--panel2)}
.trash-foot.danger-zone{border-top-color:var(--red);background:#33231f}
:root[data-theme="light"] .trash-foot.danger-zone{background:#fbebe9}
.trash-actions.confirming .danger-note{color:var(--red)}
@media(max-width:580px){.trash-row{flex-wrap:wrap;gap:8px}.trash-actions{width:100%;justify-content:flex-end}.trash-foot{align-items:flex-start;flex-direction:column}}

/* ══ 图例：缺数据 ══════════════════════════════════════════════════════
   和数据缺口标记同形（一条竖虚线）。只在窗口里真的缺了一段时才出现，
   平时不占位置 —— 股票代币天生缺周六，那种规律性的空档不算「缺数据」。 */
.line-dot.gap{width:0;height:11px;border-left:1px dashed var(--muted);background:none;vertical-align:-2px}

  (function () {
    var guard = document.getElementById('boot-guard');
    var titleEl = document.getElementById('boot-guard-title');
    var detailEl = document.getElementById('boot-guard-detail');

      shown = true;

      detailEl.textContent = String(msg == null ? '' : msg).slice(0, 600) || '（没有更多信息）';

        (e.message || e.error) + (e.filename ? '\n' + e.filename + ':' + (e.lineno || '?') : ''));

    window.addEventListener('unhandledrejection', function (e) {

    if (btn) btn.addEventListener('click', function () { location.reload(); });

          + '当前地址：' + location.href + '\n'
          + '页面协议：' + location.protocol);

  function interpolate(spec, dateStr) {
    const a = spec.anchors;
    if (dateStr < a[0][0] || dateStr > a[a.length - 1][0]) return null;
    for (let i = 0; i < a.length - 1; i++) {
      if (dateStr === a[i][0]) return { v: a[i][1], exact: true };
      if (dateStr > a[i][0] && dateStr < a[i + 1][0]) {
        const t = dayDiff(a[i][0], dateStr) / dayDiff(a[i][0], a[i + 1][0]);
        const v = Math.exp(Math.log(a[i][1]) + t * (Math.log(a[i + 1][1]) - Math.log(a[i][1])));
        return { v, exact: false };
      }
    }
    const last = a[a.length - 1];
    return dateStr === last[0] ? { v: last[1], exact: true } : null;
  }

  /** 生成一份 CandleCache（含盘中未收盘日线；UI 拿不到未收盘数据） */
  function buildSyntheticCache(spec, instrument) {
    const rng = mulberry32(spec.seed);
    const missing = {};
    (spec.missing_days || []).forEach(([d, r]) => (missing[d] = r));
    const bars = [];
    let prevClose = null;
    for (const date of eachDay(spec.listing_date, DEMO_TODAY)) {
      const ip = interpolate(spec, date);
      if (!ip) continue;
      const closeRaw = ip.exact ? ip.v : ip.v * (1 + (rng() * 2 - 1) * spec.noise);
      const n1 = rng() * 2 - 1, n2 = rng(), n3 = rng(), n4 = rng();
      if (missing[date]) { prevClose = prevClose; continue; }
      const close = round(closeRaw, 4);
      const base = prevClose == null ? close : prevClose;
      const open = round(base * (1 + n1 * spec.noise * 0.45), 4);
      const hi = Math.max(open, close), lo = Math.min(open, close);
      const high = round(hi * (1 + n2 * spec.noise), 4);
      const low = round(lo * (1 - n3 * spec.noise), 4);
      const isToday = date === DEMO_TODAY;
      bars.push({
        time: date,
        open_time: barOpenTime(date),
        close_time: barCloseTime(date),
        open: open, high: high, low: Math.max(low, 0.0001), close: close,
        volume: Math.round(spec.volume_base * (0.55 + n4 * 0.9)),
        is_closed: !isToday,
      });
      prevClose = close;
    }
    const closed = bars.filter((b) => b.is_closed);
    const missingRanges = [];
    (spec.missing_days || []).forEach(([d, r]) => {
      // 合并成区间
      const last = missingRanges[missingRanges.length - 1];
      if (last && last.reason === r && last._last === addDays(d, -1)) {
        last.to = barCloseTime(d); last._last = d;
      } else {
        missingRanges.push({ from: barOpenTime(d), to: barCloseTime(d), reason: r, _last: d });
      }
    });
    missingRanges.forEach((r) => delete r._last);
    return {
      schema_version: SCHEMA_VERSION,
      instrument: instrument,
      interval: '1D',
      timezone: POLICY.timezone,
      data_revision: 'rev-' + spec.seed + '-synthetic',
      fetched_at: spec.fetched_at || DEMO_NOW_ISO,
      last_successful_sync_at: spec.last_successful_sync_at || DEMO_NOW_ISO,
      coverage: {
        from: closed.length ? closed[0].open_time : barOpenTime(spec.listing_date),
        to: closed.length ? closed[closed.length - 1].close_time : barOpenTime(spec.listing_date),
        complete: missingRanges.length === 0,
        missing_ranges: missingRanges,
      },
      bars: bars,
      _listing_date: spec.listing_date,
      _missing_map: missing,
    };
  }

  /** 提供 CandleCache JSON 时使用；只做字段校验与规范化，不改数值 */
  function normalizeProvidedCache(raw) {
    const errs = [];
    const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.caches) ? raw.caches : []);
    const caches = list.map((c) => {
      const bars = (c.bars || []).slice().sort((a, b) => (a.open_time < b.open_time ? -1 : 1));
      const missingMap = {};
      ((c.coverage && c.coverage.missing_ranges) || []).forEach((r) => {
        let d = msToLocalDate(utcMs(r.from));
        const end = msToLocalDate(utcMs(r.to));
        while (dayDiff(d, end) > 0) { missingMap[d] = r.reason; d = addDays(d, 1); }
      });
      const closed = bars.filter((b) => b.is_closed);
      return {
        schema_version: SCHEMA_VERSION,
        instrument: c.instrument,
        interval: c.interval || '1D',
        timezone: c.timezone || POLICY.timezone,
        data_revision: c.data_revision || 'rev-provided',
        fetched_at: c.fetched_at || null,
        last_successful_sync_at: c.last_successful_sync_at || c.fetched_at || null,
        coverage: c.coverage || { from: null, to: null, complete: false, missing_ranges: [] },
        bars: bars,
        _listing_date: closed.length ? msToLocalDate(utcMs(closed[0].open_time)) : null,
        _missing_map: missingMap,
        _provided: true,
      };
    });
    return { caches: caches, errors: errs };
  }

  function defaultDataSource() {

  function providedDataSource(raw) {

      ? raw.catalog
      : { catalog_version: raw.catalog_version || 'provided', verified_at: raw.verified_at || DEMO_NOW_ISO, instruments: [] };
    const norm = normalizeProvidedCache(raw);
    if (!catalog.instruments.length) {
      catalog.instruments = norm.caches.map((c) => c.instrument).filter(Boolean);
    }
    return { mode: 'provided', label: '已核验缓存 JSON', catalog: catalog, caches: norm.caches, warnings: norm.errors };
  }

  // ── 6. 指标计算（只用已收盘日线收盘价；每个指标独立判有效性） ──────────
  function makeIndex(cache) {
    const byDate = {};
    cache.bars.forEach((b) => { byDate[b.time] = b; });
    return byDate;
  }

  /**
   * 计算截止到 dateStr（含该日日线）的指标。
   * 所有窗口都要求“连续自然日”全部存在，缺一天即该指标为 null 并给原因。
   */
  function computeMetricsAt(byDate, cache, dateStr) {
    const metrics = {};
    const metric_errors = {};
    const bar = byDate[dateStr];
    const coverageFrom = cache._listing_date;
    const lastAvailable = cache.bars.length ? cache.bars[cache.bars.length - 1].time : null;

    if (!bar || !bar.is_closed) {
      const reason = coverageFrom && dateStr < coverageFrom ? 'no_data_at_cutoff'
        : (lastAvailable && dateStr > lastAvailable ? 'no_data_at_cutoff' : (byDate[dateStr] ? 'no_data_at_cutoff' : 'missing_bars'));
      METRIC_KEYS.forEach((k) => { metrics[k] = null; metric_errors[k] = reason; });
      return { metrics: metrics, metric_errors: metric_errors, bar_date: null, bar_close_time: null, close_price: null };
    }
    if (!isNum(bar.close) || bar.close <= 0) {
      METRIC_KEYS.forEach((k) => { metrics[k] = null; metric_errors[k] = 'invalid_price'; });
      return { metrics: metrics, metric_errors: metric_errors, bar_date: dateStr, bar_close_time: bar.close_time, close_price: null };
    }

    const closeAt = (d) => (byDate[d] && byDate[d].is_closed && isNum(byDate[d].close) && byDate[d].close > 0 ? byDate[d].close : null);
    /** 检查 dateStr 往前 need 根（含自己）是否连续存在 */
    const seriesOrReason = (need) => {
      const arr = [];
      for (let k = 0; k < need; k++) {
        const d = addDays(dateStr, -k);
        const c = closeAt(d);
        if (c == null) {
          if (coverageFrom && d < coverageFrom) return { error: 'insufficient_bars' };
          if (lastAvailable && d > lastAvailable) return { error: 'no_data_at_cutoff' };
          return { error: 'missing_bars' };
        }
        arr.push(c);
      }
      return { values: arr }; // values[0] = C0
    };

    const defs = {
      chg_1d: { need: 2, f: (v) => (v[0] / v[1] - 1) * 100 },
      chg_5d: { need: 6, f: (v) => (v[0] / v[5] - 1) * 100 },
      chg_20d: { need: 21, f: (v) => (v[0] / v[20] - 1) * 100 },
      ma20_gap: { need: 20, f: (v) => (v[0] / (v.reduce((a, b) => a + b, 0) / v.length) - 1) * 100 },
      vol_20d: {
        need: 21,
        f: (v) => {
          const rets = [];
          for (let i = 0; i < 20; i++) rets.push(v[i] / v[i + 1] - 1);
          const m = rets.reduce((a, b) => a + b, 0) / rets.length;
          const ss = rets.reduce((a, b) => a + (b - m) * (b - m), 0);
          const sd = Math.sqrt(ss / (rets.length - POLICY.volatility_ddof)); // 分母 19
          return sd * Math.sqrt(POLICY.annualization_days) * 100;
        },
      },
    };

    METRIC_KEYS.forEach((k) => {
      const s = seriesOrReason(defs[k].need);
      if (s.error) { metrics[k] = null; metric_errors[k] = s.error; return; }
      const v = defs[k].f(s.values);
      if (!isNum(v)) { metrics[k] = null; metric_errors[k] = 'invalid_price'; return; }
      metrics[k] = v;
      metric_errors[k] = null;
    });

    return { metrics: metrics, metric_errors: metric_errors, bar_date: dateStr, bar_close_time: bar.close_time, close_price: bar.close };
  }

  // ── 6b. 判定、周期与技术字段（模块级纯函数；service 内外共用） ───────────
  /** 条件真值：严格比较，等于阈值不算成立 */
  function truthOf(value, cond) {
    if (value == null || !isNum(value)) return 'unknown';
    if (cond.operator === 'lt') return value < cond.threshold ? 'met' : 'not_met';   // 严格比较；等于阈值不算成立
    return value > cond.threshold ? 'met' : 'not_met';
  }
  function distanceOf(value, cond) {
    if (value == null || !isNum(value)) return null;
    if (truthOf(value, cond) === 'met') return 0;
    return cond.operator === 'lt' ? value - cond.threshold : cond.threshold - value;
  }

  /** 周期词表：研究设置（parseSetup）和用户原话（parseHorizonText）共用，口径一致 */
  const HORIZON_WORDS = [
    [/一到两周|1-2周|一两周/, '一到两周', (7 + 14) / 2],
    [/两周|2周/, '两周', 14],
    [/一周|1周|7天/, '一周', 7],
    [/一个月|1个月|30天/, '一个月', 30],
  ];
  /**
   * 从用户原话里读周期。
   * 「近7天」「近两周」是指标窗口，不是周期；「12周」里的「2周」也不是两周，都跳过。
   * @returns {{days:number, quote:string} | null}
   */
  function parseHorizonText(text) {
    const t = String(text || '');
    for (const [re, , days] of HORIZON_WORDS) {
      const g = new RegExp(re.source, 'g');
      let m;
      while ((m = g.exec(t)) !== null) {
        const before = t.slice(0, m.index);
        if (/近\s*$/.test(before) || /\d\s*$/.test(before)) continue;
        return { days: days === 10.5 ? Math.floor(days) : days, quote: m[0] };
      }
    }
    return null;
  }

  /**
   * 「多想一步」用的技术字段，只由 prepare_card 写进冻结快照，不进 METRIC_KEYS。
   * 取数口径与 computeMetricsAt 完全一致：按自然日逐天回溯，缺任何一天，依赖它的字段为 null 并记原因码。
   */
  const TECH_MA_PERIODS = [5, 10, 20];
  const TECH_SLOPE_FLAT_PCT = 0.1;     // 均线两天变化在 ±0.1% 以内算走平
  const TECH_SIDE_MAX = 20;            // 同侧天数最多数到 20
  function computeTechnicalAt(byDate, cache, dateStr) {
    const errors = {};
    const out = { calc: 'technical-v1', as_of: dateStr || null, ma: { 5: null, 10: null, 20: null },
      low_20d: null, days_since_low: null, errors: errors };
    const coverageFrom = cache && cache._listing_date;
    const lastAvailable = cache && cache.bars && cache.bars.length ? cache.bars[cache.bars.length - 1].time : null;
    const closeAt = (d) => (byDate && byDate[d] && byDate[d].is_closed && isNum(byDate[d].close) && byDate[d].close > 0 ? byDate[d].close : null);
    if (!dateStr || closeAt(dateStr) == null) {
      TECH_MA_PERIODS.forEach((n) => { errors['ma' + n] = 'no_data_at_cutoff'; });
      errors.low_20d = 'no_data_at_cutoff';
      return out;
    }
    // 一次取够最长需要的连续自然日（20 天均线 + 20 天同侧），遇到缺日即停并记原因（与 seriesOrReason 同一规则）
    const need = 20 + TECH_SIDE_MAX;
    const C = [];
    let stopReason = null;
    for (let k = 0; k < need; k++) {
      const d = addDays(dateStr, -k);
      const c = closeAt(d);
      if (c == null) {
        stopReason = coverageFrom && d < coverageFrom ? 'insufficient_bars'
          : (lastAvailable && d > lastAvailable ? 'no_data_at_cutoff' : 'missing_bars');
        break;
      }
      C.push(c);                                  // C[0] = 当天收盘
    }
    const L = C.length;
    const errFor = (n) => (L >= n ? null : (stopReason || 'insufficient_bars'));
    const mean = (from, n) => { let s = 0; for (let i = from; i < from + n; i++) s += C[i]; return s / n; };
    TECH_MA_PERIODS.forEach((n) => {
      const key = 'ma' + n;
      errors[key] = errFor(n);
      if (errors[key]) return;                    // 均线本身都算不出，整个 ma[n] 为 null
      const value = mean(0, n);
      const block = { value: value, gap_pct: (C[0] / value - 1) * 100, slope: null, side_days: null };
      errors[key + '_slope'] = errFor(n + 2);
      if (!errors[key + '_slope']) {
        const r = (value / mean(2, n) - 1) * 100;
        block.slope = r > TECH_SLOPE_FLAT_PCT ? 'up' : (r < -TECH_SLOPE_FLAT_PCT ? 'down' : 'flat');
      }
      const sign0 = Math.sign(C[0] - value);
      if (sign0 === 0) block.side_days = 0;
      else {
        let count = 0;
        for (let k = 0; k < TECH_SIDE_MAX && k + n <= L; k++) {
          if (Math.sign(C[k] - mean(k, n)) !== sign0) break;
          count++;
        }
        block.side_days = sign0 * count;          // 正数 = 上方，负数 = 下方
      }
      out.ma[n] = block;
    });
    errors.low_20d = errFor(20);
    if (!errors.low_20d) {
      let low = C[0], at = 0;
      for (let k = 1; k < 20; k++) if (C[k] < low) { low = C[k]; at = k; }   // 并列取最近的一天
      out.low_20d = low;
      out.days_since_low = at;
    }
    return out;
  }

  // ── 卡片 0.4 新字段的清洗：只清洗类型和长度、不理解语义；非法值置空，从不因此拒绝保存 ──
  const CARD_ROLES = ['trigger', 'falsifier', 'confirm', 'observe'];
  const CARD_ROLE_ORIGINS = ['user_chosen', 'ai_extracted', 'inferred'];
  function cleanQuote(q) { return q == null ? '' : String(q).slice(0, 60); }
  function cleanRole(r) { return CARD_ROLES.indexOf(r) >= 0 ? r : null; }
  function cleanRoleOrigin(role, origin) { return role && CARD_ROLE_ORIGINS.indexOf(origin) >= 0 ? origin : null; }
  function cleanTarget(t) {
    if (!t || typeof t !== 'object') return null;
    if ((t.dir !== 'up' && t.dir !== 'down') || !isNum(t.price) || !isNum(t.pct) || !isNum(t.window_days)
      || t.basis !== 'close_since_t0') return null;
    return { dir: t.dir, price: t.price, pct: t.pct, window_days: t.window_days, basis: 'close_since_t0' };
  }
  function cleanReadings(list) {
    if (!Array.isArray(list)) return [];
    const out = [];
    list.slice(0, 4).forEach((r) => {
      if (!r || typeof r !== 'object') return;
      let ps, cs;
      try {
        ps = JSON.stringify(r.params && typeof r.params === 'object' ? r.params : {});
        cs = JSON.stringify(r.computed && typeof r.computed === 'object' ? r.computed : {});
      } catch (_) { return; }
      if (ps.length > 300 || cs.length > 300) return;
      out.push({
        quote: String(r.quote == null ? '' : r.quote).slice(0, 20),
        kind: String(r.kind == null ? '' : r.kind).slice(0, 32),
        params: JSON.parse(ps),
        text: String(r.text == null ? '' : r.text).slice(0, 200),
        computed: JSON.parse(cs),
        target: cleanTarget(r.target),
        adopted_at: typeof r.adopted_at === 'string' ? r.adopted_at.slice(0, 40) : null,
      });
    });
    return out;
  }

  // ── 6c. 市场裁决：《03 市场裁决 · Schema v1.1》──────────────────────────
  // 全部是模块级纯函数：无副作用、不读缓存、不调模型；数据源由调用方注入（closeAt）。
  // 卡片对象在这些函数里**只会被读**：任何角色推断都只现算、绝不写回（03 §2.4）。
  const VERDICT_VERSION = 'verdict-v1';
  const VERDICT_ROLES = ['trigger', 'falsifier', 'confirm', 'observe'];
  const DECIDING_ROLES = ['trigger', 'falsifier', 'confirm'];
  const ROLE_LABELS = { trigger: '触发条件', falsifier: '认错条件', confirm: '验证条件', observe: '只观察' };
  const ROLLING_WINDOW_DAYS = { chg_1d: 1, chg_5d: 5, chg_20d: 20 };
  const VERDICT_BAND_FLOOR = 1.0;   // band 的下限：1 个百分点
  const VERDICT_BAND_K = 0.5;
  const CLOSE_LOOKBACK_DAYS = 3;    // 周期到期时往前最多找几天的收盘
  /* 顺序即优先级：认错最先 */
  const ROLE_WORDS = [
    ['falsifier', /认错|错了|我就走|就走|不玩了|出局|砍掉|割肉|止损|离场|跑路/],
    ['trigger', /就买|才买|再买|就进|才进|再进|接回来|才动手|就动手|就上车|建仓|加仓|再考虑/],
    ['confirm', /说明我对|就对了|就确认|算验证|坐实|印证/],
  ];
  function inferRole(stance, operator, quote) {
    const q = String(quote || '');
    for (const pair of ROLE_WORDS) if (pair[1].test(q)) return pair[0];
    if (stance === 'wait_condition') return 'trigger';
    if (stance === 'neutral') return 'observe';
    if (stance === 'bullish') return operator === 'lt' ? 'falsifier' : 'confirm';
    if (stance === 'bearish') return operator === 'gt' ? 'falsifier' : 'confirm';
    return 'observe';
  }
  /** 只现算，绝不写回卡片；只有 1 个条件时才把整张卡的原话当作该条件的出处 */
  function effectiveRole(cond, card, onlyCondition) {
    if (cond && VERDICT_ROLES.indexOf(cond.role) >= 0) {
      return { role: cond.role, origin: cond.role_origin || 'user_chosen' };
    }
    const quote = (cond && cond.quote) || (onlyCondition ? (card && card.raw_input) : '');
    return { role: inferRole(card && card.stance, cond && cond.operator, quote), origin: 'inferred' };
  }

  /** 目标价描述：收盘达到 182.10（来自「涨一点」，14 天内） */
  function readingTargetLabel(reading) {
    const t = reading && reading.target;
    if (!t) return '';
    const from = String(reading.quote || reading.text || '目标价').slice(0, 20);
    return '收盘' + (t.dir === 'up' ? '达到' : '跌到') + ' ' + fmtPrice(t.price, null)
      + '（来自「' + from + '」，' + t.window_days + ' 天内）';
  }

  /**
   * 记号与时间窗（03 §4.2）：T0 / T1 / H / windowEnd / clockExpired。
   * 目标价自带时钟：卡上没有周期、但记了目标价时，取目标价窗口的最小值当周期。
   */
  function verdictWindow(card, cmp) {
    const snap = (card && card.snapshot) || null;
    const cur = (cmp && cmp.current_snapshot) || null;
    const t0 = snap ? snap.bar_date : null;
    const t1 = cur ? cur.bar_date : null;
    const targets = (card && Array.isArray(card.precise_readings) ? card.precise_readings : [])
      .filter((r) => r && r.target);
    let H = isNum(card && card.horizon_days_at_creation) ? card.horizon_days_at_creation : null;
    let origin = H != null ? (card.horizon_origin || 'setup') : null;
    if (H == null && targets.length) {
      H = targets.reduce((m, r) => Math.min(m, r.target.window_days), Infinity);
      origin = 'target';
    }
    const elapsed = t0 && t1 ? dayDiff(t0, t1) : null;
    const windowEnd = (H != null && t0 && t1) ? (elapsed <= H ? t1 : addDays(t0, H)) : t1;
    return {
      t0: t0, t1: t1, H: H, origin: origin, elapsed: elapsed, windowEnd: windowEnd,
      clockExpired: H != null && elapsed != null && elapsed >= H, targets: targets,
    };
  }

  /** 波动带 band(d) = max(1.0, 0.5 × vol0 × √(d/365))，vol0 用判断当天的冻结值 */
  function verdictBand(card, d) {
    const v = card && card.snapshot && card.snapshot.metrics ? card.snapshot.metrics.vol_20d : null;
    if (!isNum(v)) return null;
    return Math.max(VERDICT_BAND_FLOOR, VERDICT_BAND_K * v * Math.sqrt(Math.max(0, d) / POLICY.annualization_days));
  }

  /** 逐条条件事件：沿 daily_states 走，只有「从不成立翻到成立」才算数（03 §4.3） */
  function verdictConditionItems(card, cmp, windowEnd) {
    const conds = (card && Array.isArray(card.conditions)) ? card.conditions : [];
    const results = (cmp && Array.isArray(cmp.condition_results)) ? cmp.condition_results : [];
    const byId = {};
    results.forEach((r) => { byId[r.condition_id] = r; });
    const only = conds.length === 1;
    return conds.map((cond) => {
      const r = byId[cond.condition_id] || null;
      const eff = effectiveRole(cond, card, only);
      const states = (r && r.scan && Array.isArray(r.scan.daily_states)) ? r.scan.daily_states : [];
      const baseline = r ? r.baseline_state : 'unknown';
      let prev = baseline;
      let first = null, observedOnly = false, afterWindow = null;
      let minGap = null;         // 窗口内离成立最近还差多少个百分点（threshold_unreachable 用）
      const gaps = [];           // 窗口内的缺日
      states.forEach((d) => {
        // dayDiff(from, to) = to - from：日期不晚于 windowEnd 才算在窗口内
        const inside = windowEnd ? dayDiff(d.date, windowEnd) >= 0 : true;
        if (!inside) {
          if (afterWindow == null && d.state === 'met' && (prev === 'not_met' || prev === 'unknown')) afterWindow = d.date;
          prev = d.state;
          return;
        }
        if (d.state === 'unknown') {
          if (gaps.indexOf(d.date) < 0) gaps.push(d.date);
        } else if (isNum(d.value)) {
          const gap = cond.operator === 'lt' ? (cond.threshold - d.value) : (d.value - cond.threshold);
          if (gap > 0 && (minGap == null || gap < minGap)) minGap = gap;
        }
        if (d.state === 'met' && (prev === 'not_met' || prev === 'unknown')) {
          if (first == null) { first = d.date; observedOnly = prev === 'unknown'; }
        }
        prev = d.state;
      });
      const t0 = card && card.snapshot ? card.snapshot.bar_date : null;
      if (baseline === 'unknown' && windowEnd && t0 && gaps.indexOf(t0) < 0) gaps.push(t0);
      // 认错线只被碰了一下就回去了：翻转后连续成立 n 天（n ≤ 2），之后回落到不成立，到 T1 仍不成立
      let grazedDays = null;
      if (first != null) {
        const from = states.findIndex((d) => d.date === first);
        let n = 0;
        for (let i = from; i >= 0 && i < states.length; i += 1) { if (states[i].state === 'met') n += 1; else break; }
        const afterIdx = from + n;
        const backDown = afterIdx < states.length && states[afterIdx].state === 'not_met';
        if (n <= 2 && backDown && r && r.current_state !== 'met') grazedDays = n;
      }
      return {
        kind: 'condition', cond: cond, result: r, role: eff.role, role_origin: eff.origin,
        ref: cond.condition_id, label: r ? r.rule_desc : buildRuleDesc(cond.metric, cond.operator, cond.threshold),
        metric: cond.metric, operator: cond.operator, threshold: cond.threshold, price: null,
        sign: cond.operator === 'gt' ? 1 : -1, ids: [cond.metric],
        baseline_state: baseline, current_state: r ? r.current_state : 'unknown',
        date: first, observed_only: observedOnly, met_after_window: afterWindow,
        grazed_days: grazedDays, min_gap_pp: minGap, gap_dates: gaps,
        distance_pp: r ? r.distance_pp : null,
      };
    });
  }

  /** 目标价事件：只按收盘价、从判断当天起算核对（03 §4.4） */
  function verdictTargetItems(card, win, closeAt) {
    const close = typeof closeAt === 'function' ? closeAt : () => null;
    return (win.targets || []).map((reading, idx) => {
      const t = reading.target;
      const role = inferRole(card && card.stance, t.dir === 'up' ? 'gt' : 'lt', reading.quote);
      const end = (win.t0 && win.t1)
        ? (dayDiff(win.t0, win.t1) <= t.window_days ? win.t1 : addDays(win.t0, t.window_days))
        : win.t1;
      let hit = null;
      const gaps = [];
      if (win.t0 && end) {
        eachDay(addDays(win.t0, 1), end).forEach((d) => {
          const c = close(d);
          if (c == null) { gaps.push(d); return; }
          if (hit == null && ((t.dir === 'up' && c >= t.price) || (t.dir === 'down' && c <= t.price))) hit = d;
        });
      }
      return {
        kind: 'target', reading: reading, ref: 'reading:' + idx, dir: t.dir, role: role,
        role_origin: 'inferred', label: readingTargetLabel(reading), price: t.price,
        metric: null, operator: t.dir === 'up' ? 'gt' : 'lt',
        sign: t.dir === 'up' ? 1 : -1, ids: ['ret_path'],
        date: hit, gap_dates: gaps, window_end: end, observed_only: false,
        grazed_days: null, min_gap_pp: null, current_state: null, distance_pp: null,
      };
    });
  }

  /** 窗口结束当天（或往前最多 3 天内最近一天）的收盘 —— 周期裁决用 */
  function verdictCloseNearEnd(closeAt, date) {
    const close = typeof closeAt === 'function' ? closeAt : () => null;
    for (let k = 0; k <= CLOSE_LOOKBACK_DAYS; k += 1) {
      const d = addDays(date, -k);
      const c = close(d);
      if (c != null) return { date: d, close: c };
    }
    return null;
  }

  /**
   * verdictOf(card, cmp, closeAt) —— 判决由代码机械得出，模型碰不到结论。
   * 纯函数：同样的输入永远得到同样的输出；cache 不在时 closeAt 恒为 null，自然落到「判不了」。
   */
  function verdictOf(card, cmp, closeAt) {
    const close = typeof closeAt === 'function' ? closeAt : () => null;
    const c = cmp || {};
    const win = verdictWindow(card, c);
    const closeT0 = card && card.snapshot && isNum(card.snapshot.close_price) && card.snapshot.close_price > 0
      ? card.snapshot.close_price : null;
    const closeT1 = win.t1 ? close(win.t1) : null;
    const notes = [];
    const note = (code, params) => { notes.push({ code: code, params: params || {} }); };
    const v = {
      version: VERDICT_VERSION, state: null, outcome: null, decided_by: null,
      t0: win.t0, t1: win.t1, window_end: win.windowEnd,
      elapsed_days: win.elapsed, horizon_days: win.H, horizon_origin: win.origin,
      close_t0: closeT0, close_window_end: null, close_t1: closeT1,
      return_window_pct: null,
      return_now_pct: (closeT0 != null && closeT1 != null) ? (closeT1 / closeT0 - 1) * 100 : null,
      band_pct: null, close_at_decision: null, return_at_decision_pct: null,
      post_trigger: null, progress: null, reason: null, notes: notes, path: [],
      deciding: [],   // 全部裁决性条目（含没成立的）——给 divergence/lesson 复用，避免重复扫描
      events: [],     // 其中真正发生的
    };

    // ── ① 判不了：T1 为空 / 数据不可用 / 判断当天没有收盘价 ──
    if (!win.t1 || c.data_state === 'unavailable' || closeT0 == null) {
      v.state = 'undecidable_no_data';
      v.reason = closeT0 == null
        ? '判断当天的收盘价缺失，没法算收益。'
        : (!win.t1 ? '这次复核没有可用的最新日线。' : '这次复核的数据不可用。');
      return v;
    }

    const items = verdictConditionItems(card, c, win.windowEnd)
      .concat(verdictTargetItems(card, win, close));
    const deciding = items.filter((e) => DECIDING_ROLES.indexOf(e.role) >= 0);
    v.deciding = deciding;

    // ── 需要说明的：保存当天就已成立、窗口后才成立 ──
    deciding.forEach((e) => {
      if (e.kind !== 'condition') return;
      if (e.baseline_state === 'met') note('baseline_already_met', { rule: e.label, t0: win.t0 });
      if (e.met_after_window) note('met_after_window', { rule: e.label, date: e.met_after_window, h: win.H });
    });

    // ── ② 收集窗口内事件 ──
    const events = deciding.filter((e) => e.date);
    // dayDiff(b, a) = a - b：a 更早时返回负数，最早的事件排在前面
    events.sort((a, b) => dayDiff(b.date, a.date) || (a.kind < b.kind ? -1 : 1));
    v.events = events.map((e) => ({
      kind: e.kind, role: e.role, date: e.date, label: e.label, sign: e.sign,
      ids: e.ids, ref: e.ref, price: e.price,
    }));

    // ── 窗口内缺日（裁决性条件与目标价都算） ──
    const gapDates = [];
    deciding.forEach((e) => {
      (e.gap_dates || []).forEach((d) => { if (gapDates.indexOf(d) < 0) gapDates.push(d); });
    });
    gapDates.sort();

    const decider = (e) => ({
      kind: e.kind, role: e.role, role_origin: e.role_origin, ref: e.ref, label: e.label,
      metric: e.metric, date: e.date, observed_only: !!e.observed_only,
    });

    if (events.length) {
      const F = events.filter((e) => e.role === 'falsifier')[0] || null;
      const C = events.filter((e) => e.role === 'trigger' || e.role === 'confirm')[0] || null;
      if (F) {
        // 认错压倒验证：认错线一旦被触及，「当时那个判断」就已经被市场否掉了
        v.outcome = 'refuted';
        v.decided_by = decider(F);
        // dayDiff(a, b) = b - a > 0 表示 C 发生在 F 之前（先兑现、后被推翻）
        if (C && dayDiff(C.date, F.date) > 0) {
          note('confirmed_then_refuted', { c_label: C.label, c_date: C.date, f_label: F.label, f_date: F.date });
        }
      } else if (C) {
        v.outcome = 'confirmed';
        v.decided_by = decider(C);
      } else {
        v.state = 'waiting';
      }
      if (v.outcome) v.state = 'resolved';
    } else if (win.clockExpired) {
      // ── ③ 周期到了，什么都没观测到 ──
      if (gapDates.length) {
        v.state = 'undecidable_no_data';
        v.reason = '窗口内有缺日，没法确认条件是否在那几天成立过。';
        note('incomplete_scan', { dates: gapDates.join('、') });
        return v;
      }
      const near = verdictCloseNearEnd(close, win.windowEnd);
      v.close_window_end = near ? near.close : null;
      v.return_window_pct = (closeT0 != null && v.close_window_end != null)
        ? (v.close_window_end / closeT0 - 1) * 100 : null;
      v.band_pct = verdictBand(card, dayDiff(win.t0, win.windowEnd));
      v.decided_by = { kind: 'clock', role: null, role_origin: null, ref: null,
        label: '周期 ' + win.H + ' 天', metric: null, date: win.windowEnd, observed_only: false };
      const stance = card.stance;
      if (stance === 'wait_condition') {
        v.outcome = 'expired_unmet';
      } else if (v.return_window_pct == null || v.band_pct == null) {
        v.outcome = 'expired_flat';
        note('no_return', {});
      } else if (stance === 'neutral') {
        v.outcome = Math.abs(v.return_window_pct) <= v.band_pct ? 'confirmed' : 'refuted';
      } else if (Math.abs(v.return_window_pct) <= v.band_pct) {
        v.outcome = 'expired_flat';
      } else {
        const up = v.return_window_pct > 0;
        const aligned = (stance === 'bullish' && up) || (stance === 'bearish' && !up);
        v.outcome = aligned ? 'confirmed' : 'refuted';
      }
      v.state = 'resolved';
    } else {
      // ── ④ 没有事件，时钟没到（或没有时钟） ──
      if (!deciding.length && win.H == null) {
        v.state = 'undecidable_no_clock';
        v.reason = '这张卡没有能判定对错的条件，也没有周期，系统没法自动结束它。';
      } else {
        v.state = 'waiting';
      }
    }

    // ── 决策日的价格；触发之后的那一段留给下一张卡 ──
    if (v.decided_by) {
      const at = (v.decided_by.date === win.windowEnd && v.close_window_end != null)
        ? { date: win.windowEnd, close: v.close_window_end }
        : verdictCloseNearEnd(close, v.decided_by.date);
      v.close_at_decision = at ? at.close : null;
      v.return_at_decision_pct = (closeT0 != null && v.close_at_decision != null)
        ? (v.close_at_decision / closeT0 - 1) * 100 : null;
      if (v.decided_by.role === 'trigger') {
        const c1 = close(win.t1);
        v.post_trigger = {
          date: v.decided_by.date,
          close: v.close_at_decision,
          return_since_pct: (v.close_at_decision != null && c1 != null)
            ? (c1 / v.close_at_decision - 1) * 100 : null,
        };
      }
    }

    // ── 逐日收益路径：给复盘用（T0 次日 → windowEnd） ──
    if (win.windowEnd && dayDiff(win.t0, win.windowEnd) > 0) {
      eachDay(addDays(win.t0, 1), win.windowEnd).forEach((d) => {
        const cc = close(d);
        v.path.push({
          date: d,
          ret_pct: (cc != null && closeT0 != null) ? (cc / closeT0 - 1) * 100 : null,
          band_pct: verdictBand(card, dayDiff(win.t0, d)),
        });
      });
    }

    // ── progress：只在 waiting 时给「还差多少、周期还剩几天」 ──
    if (v.state === 'waiting') {
      let nearest = null;
      deciding.forEach((e) => {
        if (e.kind !== 'condition') return;
        const d = e.distance_pp;
        if (d == null || d <= 0) return;
        if (!nearest || d < nearest.distance_pp) nearest = { label: e.label, distance_pp: d };
      });
      v.progress = {
        nearest: nearest,
        days_left: (win.H != null && win.elapsed != null) ? Math.max(0, win.H - win.elapsed) : null,
      };
    }

    // ── 其余说明 ──
    if (v.decided_by) {
      if (v.decided_by.observed_only) note('observed_only', { date: v.decided_by.date });
      if (v.decided_by.role_origin === 'inferred') {
        note('role_inferred', { role_label: ROLE_LABELS[v.decided_by.role] || '条件' });
      }
      if (v.decided_by.role === 'trigger') {
        note('trigger_is_entry', { date: v.decided_by.date, t1: win.t1,
          post: (v.post_trigger && v.post_trigger.return_since_pct != null) ? fmtPct(v.post_trigger.return_since_pct) : '—' });
      }
      if (v.decided_by.kind === 'condition' && ROLLING_WINDOW_DAYS[v.decided_by.metric] != null
        && v.return_at_decision_pct != null) {
        const cond = (card.conditions || []).filter((x) => x.condition_id === v.decided_by.ref)[0];
        const sign = (cond && cond.operator === 'gt') ? 1 : -1;
        if (sign * v.return_at_decision_pct <= 0) {
          note('rolling_window', { rule: v.decided_by.label, W: ROLLING_WINDOW_DAYS[v.decided_by.metric],
            date: v.decided_by.date, ret: fmtPct(v.return_at_decision_pct) });
        }
      }
    }
    if (gapDates.length && v.state === 'resolved') note('incomplete_scan', { dates: gapDates.join('、') });

    return v;
  }

  /**
   * 分歧点候选（03 §4.7 / 04 §5）：按日期排序，最多 4 条。
   * 候选是代码算出来的事实，不是编的 —— 所以没有模型时兜底也能直接用。
   */
  function divergenceCandidates(verdict, card, cmp) {
    const out = [];
    (verdict && Array.isArray(verdict.events) ? verdict.events : []).forEach((e) => {
      if (e.kind === 'target') {
        out.push({ date: e.date, sign: e.sign, what_code: 'target_hit', ids: e.ids,
          text: '收盘达到目标价 ' + fmtPrice(e.price, null) });
      } else {
        out.push({ date: e.date, sign: e.sign, what_code: 'rule_crossed', ids: e.ids,
          text: '「' + e.label + '」成立' });
      }
    });
    const stance = card && card.stance;
    const dir = stance === 'bullish' ? 1 : stance === 'bearish' ? -1 : 0;
    if (dir) {
      let against = null, along = null;
      ((verdict && verdict.path) ? verdict.path : []).forEach((p) => {
        if (p.ret_pct == null || p.band_pct == null) return;
        if (against == null && dir * p.ret_pct < -p.band_pct) against = p;
        if (along == null && dir * p.ret_pct > p.band_pct) along = p;
      });
      if (against) out.push({ date: against.date, sign: -dir, what_code: 'path_against', ids: ['ret_path'],
        text: '价格走到了判断当天正常波动范围之外，方向和你的判断相反' });
      if (along) out.push({ date: along.date, sign: dir, what_code: 'path_along', ids: ['ret_path'],
        text: '价格走出了判断当天的正常波动范围，方向和你的判断一致' });
    }
    out.sort((a, b) => dayDiff(b.date, a.date) || (a.what_code < b.what_code ? -1 : 1));
    const limited = out.slice(0, 4);
    limited.forEach((x, i) => { x.i = i; });
    return limited;
  }

  /** 经验字典（04 §6）：每条前提都由代码判定，成立的才进候选。按优先级排列。 */
  function lessonCandidates(verdict, card, cmp) {
    const out = [];
    if (!verdict) return out;
    const d = verdict.decided_by || null;
    const conds = (card && Array.isArray(card.conditions)) ? card.conditions : [];
    const deciding = Array.isArray(verdict.deciding) ? verdict.deciding : [];
    const decideConds = deciding.filter((e) => e.kind === 'condition');
    const anyFalsifier = deciding.some((e) => e.role === 'falsifier');
    const pick = (ref) => decideConds.filter((e) => e.ref === ref)[0] || null;

    // 1 threshold_grazed：认错条件做的裁决，只被碰了 n ≤ 2 天就回去了
    if (d && d.kind === 'condition' && d.role === 'falsifier') {
      const e = pick(d.ref);
      if (e && e.grazed_days != null) out.push('threshold_grazed');
    }
    // 2 early_divergence：判断后很早，价格就走到反方向的正常波动之外
    const stance = card && card.stance;
    const dir = stance === 'bullish' ? 1 : stance === 'bearish' ? -1 : 0;
    if (dir) {
      const win = verdictWindow(card, cmp || {});
      const L = win.H != null ? win.H : (win.windowEnd && win.t0 ? dayDiff(win.t0, win.windowEnd) : null);
      const against = ((verdict.path) || []).filter((p) => p.ret_pct != null && p.band_pct != null && dir * p.ret_pct < -p.band_pct)[0];
      if (against && win.t0 && L) {
        const k = dayDiff(win.t0, against.date);
        if (k <= Math.ceil(L / 3)) out.push('early_divergence');
      }
    }
    // 3 met_then_reversed：触发 / 验证条件做的裁决，但到 T1 已经不成立
    if (d && d.kind === 'condition' && (d.role === 'trigger' || d.role === 'confirm')) {
      const e = pick(d.ref);
      if (e && e.date && e.current_state !== 'met') out.push('met_then_reversed');
    }
    // 4 right_direction_no_trigger：周期做的裁决、方向兑现，但条件/目标价一个都没碰到
    if (d && d.kind === 'clock' && verdict.outcome === 'confirmed') {
      const anyHit = deciding.some((e) => e.date);
      if (!anyHit && deciding.length) out.push('right_direction_no_trigger');
    }
    // 5 threshold_unreachable：周期做的裁决，某条裁决性条件全程最近也差得比 band 远
    if (d && d.kind === 'clock' && verdict.band_pct != null) {
      if (decideConds.some((e) => !e.date && e.min_gap_pp != null && e.min_gap_pp > verdict.band_pct)) {
        out.push('threshold_unreachable');
      }
    }
    // 6 horizon_too_short：周期太短，价格还在这段时间的正常波动里
    if (verdict.outcome === 'expired_flat' && verdict.return_window_pct != null && verdict.band_pct != null) {
      out.push('horizon_too_short');
    }
    // 7 no_falsifier：卡上没有任何认错条件或认错价位
    if (!anyFalsifier) out.push('no_falsifier');
    // 8 single_metric：多个条件用的是同一个指标
    if (conds.length >= 2) {
      const first = conds[0].metric;
      if (conds.every((c) => c.metric === first)) out.push('single_metric');
    }
    return out;
  }

  /** 经验句子由代码拼（04 §6 的代码文案），数字全部由代码填 */
  function lessonTexts(verdict, card, cmp) {
    if (!verdict) return [];
    const kinds = lessonCandidates(verdict, card, cmp);
    const d = verdict.decided_by || null;
    const deciding = Array.isArray(verdict.deciding) ? verdict.deciding : [];
    const decideConds = deciding.filter((e) => e.kind === 'condition');
    const pick = (ref) => decideConds.filter((e) => e.ref === ref)[0] || null;
    const texts = {};
    kinds.forEach((kind) => {
      if (kind === 'threshold_grazed') {
        const e = pick(d && d.ref);
        if (e && e.grazed_days != null) texts[kind] = '认错线只被碰到 ' + e.grazed_days + ' 天就回去了，这条线可能贴得太近。';
      } else if (kind === 'early_divergence') {
        const win = verdictWindow(card, cmp || {});
        const dir = (card && card.stance) === 'bullish' ? 1 : -1;
        const against = (verdict.path || []).filter((p) =>
          p.ret_pct != null && p.band_pct != null && dir * p.ret_pct < -p.band_pct)[0];
        if (against && win.t0) texts[kind] = '保存后第 ' + dayDiff(win.t0, against.date) + ' 天，价格就走到了反方向的正常波动范围之外。';
      } else if (kind === 'met_then_reversed') {
        const e = pick(d && d.ref);
        if (e && e.date) texts[kind] = '你等的情况在 ' + e.date + ' 出现过，但没有持续到 ' + verdict.t1 + '。';
      } else if (kind === 'right_direction_no_trigger') {
        texts[kind] = '方向是对的，价格走了 ' + fmtPct(verdict.return_window_pct) + '，但没碰到你设的条件。';
      } else if (kind === 'threshold_unreachable') {
        const e = decideConds.filter((x) => !x.date && x.min_gap_pp != null
          && verdict.band_pct != null && x.min_gap_pp > verdict.band_pct)[0];
        if (e) texts[kind] = '「' + e.label + '」全程最近也差 ' + e.min_gap_pp.toFixed(1) + ' 个百分点，这个阈值可能一开始就不现实。';
      } else if (kind === 'horizon_too_short') {
        texts[kind] = (verdict.horizon_days || verdict.elapsed_days || 0) + ' 天里价格走了 ' + fmtPct(verdict.return_window_pct)
          + '，还在这段时间的正常波动（±' + fmtPct(verdict.band_pct) + '）以内，周期可能太短。';
      } else if (kind === 'no_falsifier') {
        texts[kind] = verdict.horizon_days != null
          ? '这张卡没有认错条件，走势不对时只能等周期走完。'
          : '这张卡没有认错条件，走势一直不对的话，它不会自己结束。';
      } else if (kind === 'single_metric') {
        const conds = (card && card.conditions) || [];
        texts[kind] = conds.length + ' 个条件用的是同一个指标，等于只有一个条件。';
      }
    });
    return kinds.filter((k) => texts[k]).map((k) => ({ kind: k, text: texts[k] }));
  }

  // ── 7. 服务实现 ──────────────────────────────────────────────────────
  function createService(options) {
    const opts = options || {};
    const now = opts.now || (() => new Date().toISOString());
    let persist = opts.persist;
    if (persist === undefined) { try { persist = typeof localStorage !== 'undefined' ? localStorage : null; } catch (_) { persist = null; } }
    const source = opts.source || defaultDataSource();
    const catalog = source.catalog;
    const instrumentById = {}, instrumentBySymbol = {};
    catalog.instruments.forEach((i) => { instrumentById[i.instrument_id] = i; instrumentBySymbol[i.symbol.toLowerCase()] = i; });
    const cacheById = {};
    source.caches.forEach((c) => {
      if (!c || !c.instrument) return;
      c._byDate = makeIndex(c);
      const closed = c.bars.filter((b) => b.is_closed);
      c._closedCount = closed.length;
      c._lastClosed = closed.length ? closed[closed.length - 1].time : null;
      c._firstClosed = closed.length ? closed[0].time : null;
      cacheById[c.instrument.instrument_id] = c;
    });

    const state = { views: {}, contexts: {}, drafts: {}, reviews: {}, log: [], seq: 0, marketRequests: 0 };
    const KEY = { setup: 'mydesk.v03.setup.', cards: 'mydesk.v03.cards.', idem: 'mydesk.v03.idem.', trash: 'mydesk.v03.trash.' };
    /** 回收站最多留这么多条。删除是每天都可能发生的动作，不设上限会一直长。 */
    const TRASH_LIMIT = 20;
    /** 内存态始终是真源；浏览器下再镜像到 localStorage，保证“关掉再打开仍能读到原卡”。 */
    const memStore = {};
    const readJSON = (k, fb) => {
      if (persist) { try { const s = persist.getItem(k); if (s) return JSON.parse(s); } catch (e) { /* 忽略，回落内存态 */ } }
      return memStore[k] === undefined ? fb : JSON.parse(memStore[k]);
    };
    const writeJSON = (k, v) => {
      const serialized = JSON.stringify(v);
      if (persist) { try { persist.setItem(k, serialized); } catch (e) { return false; } }
      memStore[k] = serialized;
      return true;
    };

    function logEvent(kind, label, detail) {
      state.log.push({ seq: ++state.seq, at: DEMO_NOW_ISO, kind: kind, label: label, detail: detail || null });
      if (state.log.length > 400) state.log.shift();
    }
    /** 失败同样留痕：被拒请求、守卫命中都要出现在审计日志里 */
    function fail(code, message, retryable, label) {
      logEvent('guard', label || ('拒绝 ' + code), message);
      return result.err(code, message, retryable);
    }

    // 默认设置草稿（首次体验：手动选择）
    function defaultSetupDraft() {
      return {
        symbols: catalog.instruments.map((i) => ({ symbol: i.symbol, display_name: i.display_name })),
        horizon_text: '',
        horizon_days: null,
        focus_metrics: DEFAULT_FOCUS_METRICS.slice(),
        unsupported_notes: [],
      };
    }
    function getSetup(wsId) {
      const saved = readJSON(KEY.setup + wsId, null);
      if (saved) return saved;
      const draft = defaultSetupDraft();
      return {
        schema_version: SCHEMA_VERSION,
        workspace_id: wsId,
        raw_input: '',
        symbols: catalog.instruments.slice(),
        horizon_text: '',
        horizon_days: null,
        focus_metrics: draft.focus_metrics,
        ranking_metric: draft.focus_metrics[0],
        unsupported_notes: [],
        research_principles: null,
        updated_at: DEMO_NOW_ISO,
      };
    }
    function getCards(wsId) { return readJSON(KEY.cards + wsId, []); }
    function saveCards(wsId, cards) { return writeJSON(KEY.cards + wsId, cards); }
    function getTrash(wsId) { return readJSON(KEY.trash + wsId, []); }
    function saveTrash(wsId, list) { return writeJSON(KEY.trash + wsId, list.slice(0, TRASH_LIMIT)); }

    /** A 的返回边界：截断必须发生在这里 */
    function visibleBars(cache, cutoffAt) {
      return cache.bars.filter((b) => b.is_closed && b.close_time <= cutoffAt);
    }
    function visibleCoverage(cache, bars) {
      if (!bars.length) return null;
      const from = bars[0].open_time, to = bars[bars.length - 1].close_time;
      const ranges = [];
      const known = {};
      ((cache.coverage && cache.coverage.missing_ranges) || []).forEach((r) => {
        let d = msToLocalDate(utcMs(r.from));
        const end = msToLocalDate(utcMs(r.to));
        while (dayDiff(d, end) > 0) { known[d] = r.reason; d = addDays(d, 1); }
      });
      for (let i = 1; i < bars.length; i++) {
        const gap = dayDiff(bars[i - 1].time, bars[i].time);
        if (gap > 1) {
          let d = addDays(bars[i - 1].time, 1);
          while (dayDiff(d, bars[i].time) > 0) {
            const reason = known[d] || 'provider_missing';
            const last = ranges[ranges.length - 1];
            if (last && last.reason === reason && addDays(last._last, 1) === d) { last.to = barCloseTime(d); last._last = d; }
            else ranges.push({ from: barOpenTime(d), to: barCloseTime(d), reason: reason, _last: d });
            d = addDays(d, 1);
          }
        }
      }
      ranges.forEach((r) => delete r._last);
      return { from: from, to: to, complete: ranges.length === 0, missing_ranges: ranges };
    }

    function buildQuote(wsId, instrument, cache, cutoffAt, selection, targetDate) {
      const bars = visibleBars(cache, cutoffAt);
      const barDate = bars.length ? bars[bars.length - 1].time : null;
      // 没有任何可见日线时，也必须为每个指标给出原因（not_requested 不能用来掩盖）
      const probeDate = barDate || (selection.kind === 'historical' ? selection.as_of : (targetDate || cache._lastClosed));
      const m = computeMetricsAt(cache._byDate, cache, barDate || probeDate);
      const metrics = {}, errors = {};
      METRIC_KEYS.forEach((k) => { metrics[k] = m.metrics[k] == null ? null : m.metrics[k]; errors[k] = m.metric_errors[k] == null ? null : m.metric_errors[k]; });

      // 价格：历史 = 该时点日线收盘；latest = 优先 ticker（盘中未收盘），失败回退收盘价
      let last_price = null, price_basis = 'bar_close', quote_time = null, quote_source = 'cache';
      if (selection.kind === 'historical') {
        last_price = m.close_price;
        price_basis = 'bar_close';
        quote_time = m.bar_close_time;
      } else {
        const intraday = cache.bars.filter((b) => !b.is_closed && b.time <= DEMO_TODAY).pop();
        if (intraday && isNum(intraday.close)) {
          last_price = intraday.close; price_basis = 'ticker'; quote_time = DEMO_NOW_ISO;
        } else {
          last_price = m.close_price; price_basis = 'bar_close'; quote_time = m.bar_close_time;
        }
      }

      let freshness = 'current_for_target';
      if (!barDate) freshness = 'unavailable';
      else if (targetDate && dayDiff(barDate, targetDate) > 0) freshness = 'behind_target';

      return {
        instrument_id: instrument.instrument_id,
        view_time: { mode: 'demo', selection: selection, cutoff_at: cutoffAt },
        last_price: last_price,
        price_basis: price_basis,
        quote_time: quote_time,
        quote_source: quote_source,
        fetched_at: cache.fetched_at,
        bar_date: barDate,
        bar_close_time: m.bar_close_time,
        close_price: m.close_price,
        metrics: metrics,
        metric_errors: errors,
        data_revision: cache.data_revision,
        calculation_version: CALCULATION_VERSION,
        freshness: freshness,
      };
    }

    // ── open_workbench ────────────────────────────────────────────────
    function openWorkbench(req) {
      const wsId = req.workspace_id;
      const selection = req.selection || { kind: 'latest' };
      const setup = getSetup(wsId);
      if (selection.kind === 'historical' && !isValidLocalDate(selection.as_of)) {
        return result.err('INVALID_INPUT', '历史日期格式或取值不合法（需 YYYY-MM-DD）', false);
      }
      const targets = setup.symbols.map((s) => s.instrument_id).filter((id) => cacheById[id]);
      if (!targets.length) return result.err('UNSUPPORTED_SYMBOL', '没有可用标的', false);

      let cutoffAt, targetDate, targetLabel;
      if (selection.kind === 'historical') {
        cutoffAt = cutoffForHistorical(selection.as_of);
        targetDate = selection.as_of;
        targetLabel = selection.as_of;
      } else {
        cutoffAt = DEMO_NOW_ISO;
        targetDate = targets.reduce((mx, id) => {
          const lc = cacheById[id]._lastClosed;
          return lc && (!mx || dayDiff(mx, lc) > 0) ? lc : mx;
        }, null);
        targetLabel = targetDate; // “缓存最新日”
      }

      const perInstrument = {}, rows = [];
      const syncItems = [];
      targets.forEach((id) => {
        const instrument = instrumentById[id];
        const cache = cacheById[id];
        const bars = visibleBars(cache, cutoffAt);
        const quote = buildQuote(wsId, instrument, cache, cutoffAt, selection, targetDate);
        perInstrument[id] = { cache: cache, bars: bars, quote: quote, availableThrough: quote.bar_date };
        let canWrite = !!quote.bar_date;
        let reason = null;
        if (!quote.bar_date) { canWrite = false; reason = 'TARGET_BAR_UNAVAILABLE：该时点没有可用日线'; }
        else if (selection.kind === 'historical' && quote.bar_date !== selection.as_of) {
          canWrite = false;
          reason = 'TARGET_BAR_UNAVAILABLE：选定日 ' + selection.as_of + ' 的日线不存在，实际可用到 ' + quote.bar_date;
        }
        rows.push({
          instrument: instrument,
          quote: quote,
          rank: null,
          sort_value: quote.metrics[setup.ranking_metric] == null ? null : quote.metrics[setup.ranking_metric],
          sort_unavailable_reason: quote.metrics[setup.ranking_metric] == null ? quote.metric_errors[setup.ranking_metric] : null,
          can_write_card: canWrite,
          write_disabled_reason: reason,
        });
        const lag = quote.freshness === 'behind_target';
        syncItems.push({
          instrument_id: id,
          outcome: lag ? 'cache_only' : 'cache_only',
          last_attempt_at: null, // demo 不尝试网络
          last_success_at: cache.last_successful_sync_at,
          available_through: quote.bar_date,
          error: lag ? '缓存落后于共同目标日 ' + targetDate + '（demo 模式不联网）' : null,
        });
      });

      // 排序：降序；相等按 instrument_id 升序；无值置后且 rank=null
      const metric = setup.ranking_metric;
      const valid = rows.filter((r) => r.sort_value != null).sort((a, b) =>
        (b.sort_value - a.sort_value) || (a.instrument.instrument_id < b.instrument.instrument_id ? -1 : 1));
      valid.forEach((r, i) => { r.rank = i + 1; });
      const invalid = rows.filter((r) => r.sort_value == null);
      const sortedRows = valid.concat(invalid);

      const view = {
        view_id: makeUid('view'),
        workspace: { workspace_id: wsId, mode: 'demo' },
        view_time: { mode: 'demo', selection: selection, cutoff_at: cutoffAt },
        created_at: DEMO_NOW_ISO,
        setup: setup,
        sync: {
          requested_at: DEMO_NOW_ISO,
          completed_at: DEMO_NOW_ISO,
          network_attempted: false,
          items: syncItems,
        },
        ranking_metric: metric,
        rows: sortedRows,
      };
      state.views[view.view_id] = { view: view, cutoffAt: cutoffAt, targetDate: targetDate, targetLabel: targetLabel, perInstrument: perInstrument };
      logEvent('service', 'open_workbench(' + (selection.kind === 'historical' ? 'historical ' + selection.as_of : 'latest') + ')',
        'view=' + view.view_id + ' · cutoff=' + cutoffAt + ' · 市场网络请求 network_attempted=false（累计 ' + state.marketRequests + ' 次）');
      Object.keys(perInstrument).forEach((id) => {
        const pi = perInstrument[id];
        const cut = cacheById[id].bars.filter((b) => b.is_closed).length - pi.bars.length;
        if (cut > 0) logEvent('truncate', '截断 ' + instrumentById[id].symbol, '服务边界丢弃 ' + cut + ' 根 cutoff 之后/未收盘的 K 线（不送给界面、模型与排序）');
      });
      return result.ok(view);
    }

    function getView(viewId) {
      const v = state.views[viewId];
      if (!v) return null;
      return v;
    }

    // ── get_chart ─────────────────────────────────────────────────────
    function getChart(input) {
      const v = getView(input.view_id);
      if (!v) return result.err('VIEW_NOT_FOUND', '视图不存在或已失效，请重新打开工作台', true);
      if (input.interval !== '1D') return result.err('UNSUPPORTED_INTERVAL', 'P0 只实现 1D', false);
      const pi = v.perInstrument[input.instrument_id];
      if (!pi) return result.err('UNSUPPORTED_SYMBOL', '该标的不在本次视图中', false);

      // 标记：只返回 cutoff 之内已存在的卡与触发点
      const cutoffDate = msToLocalDate(utcMs(v.cutoffAt) - DAY_MS);
      const wsId = v.view.workspace.workspace_id;
      const markers = [];
      getCards(wsId).filter((c) => c.instrument.instrument_id === input.instrument_id).forEach((c) => {
        if (dayDiff(c.snapshot.bar_date, cutoffDate) < 0) return;
        markers.push({ card_id: c.card_id, condition_id: null, time: c.snapshot.bar_date, kind: 'thesis' });
      });
      const review = state.reviews[input.view_id];
      if (review) {
        review.comparisons.forEach((cmp) => {
          if (cmp.instrument_id !== input.instrument_id) return;
          cmp.condition_results.forEach((r) => {
            if (r.first_met_on) markers.push({ card_id: cmp.card_id, condition_id: r.condition_id, time: r.first_met_on, kind: 'first_met' });
            if (r.first_observed_met_on && r.first_observed_met_on !== r.first_met_on) {
              markers.push({ card_id: cmp.card_id, condition_id: r.condition_id, time: r.first_observed_met_on, kind: 'first_observed_met' });
            }
          });
        });
      }
      return result.ok({
        view_id: input.view_id,
        instrument: pi.cache.instrument,
        interval: '1D',
        view_time: v.view.view_time,
        bars: pi.bars,                        // 已截断
        coverage: visibleCoverage(pi.cache, pi.bars),
        markers: markers,
      });
    }

    // ── prepare_card ──────────────────────────────────────────────────
    function prepareCard(input) {
      const v = getView(input.view_id);
      if (!v) return result.err('VIEW_NOT_FOUND', '视图不存在或已失效，请重新打开工作台', true);
      const pi = v.perInstrument[input.instrument_id];
      if (!pi) return result.err('UNSUPPORTED_SYMBOL', '该标的不在本次视图中', false);
      const q = pi.quote;
      if (!q.bar_date) return result.err('NO_DATA_AT_CUTOFF', '该时点没有可用日线，无法写判断', false);
      if (v.view.view_time.selection.kind === 'historical' && q.bar_date !== v.view.view_time.selection.as_of) {
        return fail('TARGET_BAR_UNAVAILABLE', '选定日 ' + v.view.view_time.selection.as_of + ' 的日线缺失，实际可用到 ' + q.bar_date + '，该日禁用保存', false, '拒绝保存：目标日无日线');
      }
      const contextId = makeUid('ctx');
      const ctx = {
        context_id: contextId,
        view_id: input.view_id,
        workspace_id: v.view.workspace.workspace_id,
        instrument: pi.cache.instrument,
        frozen_at: now(),
        analysis_as_of: v.view.view_time,
        snapshot: {
          bar_date: q.bar_date,
          bar_close_time: q.bar_close_time,
          close_price: q.close_price,
          price: q.last_price,
          price_basis: q.price_basis,
          price_time: q.quote_time,
          quote_source: q.quote_source,
          fetched_at: q.fetched_at || DEMO_NOW_ISO,
          metrics: JSON.parse(JSON.stringify(q.metrics)),
          metric_errors: JSON.parse(JSON.stringify(q.metric_errors)),
          data_revision: q.data_revision,
          calculation_version: q.calculation_version,
          technical: computeTechnicalAt(pi.cache._byDate, pi.cache, q.bar_date),
        },
        focus_metrics: v.view.setup.focus_metrics.slice(),
        horizon_days: v.view.setup.horizon_days,
        research_principles: v.view.setup.research_principles,
      };
      state.contexts[contextId] = ctx;
      logEvent('service', 'prepare_card(' + pi.cache.instrument.symbol + ')',
        '冻结快照 T0=' + ctx.snapshot.bar_date + ' · price=' + ctx.snapshot.price + '(' + ctx.snapshot.price_basis + ') · data_revision=' + ctx.snapshot.data_revision);
      return result.ok(ctx);
    }

    // ── P2：模型（演示用确定性规则；正式由 C 实现，A 负责校验与重试） ────
    function draftFromText(ctx, text) {
      const t = text || '';
      const problems = [];
      let stance = 'neutral';
      if (/等.{0,4}(回调|回踩|跌|下来)|观望|再看|先不急/.test(t)) stance = 'wait_condition';
      else if (/看多|做多|接回来|买|加仓|看好|突破/.test(t)) stance = 'bullish';
      else if (/看跌|做空|减仓|卖了|卖出|走弱/.test(t)) stance = 'bearish';

      const conditions = [];
      // 用户明确说出的量化阈值：只做提取，不改写原话
      const re = /(低于|小于|跌破|高于|大于|超过|突破)\s*(-?\d+(?:\.\d+)?)\s*%/g;
      let m;
      while ((m = re.exec(t)) && conditions.length < POLICY.max_conditions) {
        const op = /低于|小于|跌破/.test(m[1]) ? 'lt' : 'gt';
        const th = parseFloat(m[2]);
        let metric = null;
        const window5 = /近?5\s*天|5日|一周|7天/.test(t);
        const window20 = /近?20\s*天|20日|月|30天/.test(t);
        if (/均线|MA20|ma20/.test(t)) metric = 'ma20_gap';
        else if (/上一日线|昨日|前一天|单日|昨天/.test(t)) metric = 'chg_1d';
        else if (window20) metric = 'chg_20d';
        else if (window5) metric = 'chg_5d';
        else metric = ctx.focus_metrics[0] || 'chg_5d';
        if (VISIBLE_METRIC_KEYS.indexOf(metric) >= 0) {
          conditions.push({
            text: METRIC_LABELS[metric] + ' ' + OPERATOR_LABELS[op] + ' ' + fmtThreshold(th) + '%',
            metric: metric, operator: op, threshold: th, threshold_origin: 'user_explicit',
          });
        } else {
          problems.push('“' + m[0] + '”无法映射到已支持的指标');
        }
      }
      // 模型“建议的量化条件”：必须标 model_proposed，界面提示用户确认
      if (!conditions.length && /回调|回踩|跌下来|均线/.test(t)) {
        const metric = ctx.focus_metrics[0] || 'chg_5d';
        const th = metric === 'ma20_gap' ? -2 : -3;
        conditions.push({
          text: METRIC_LABELS[metric] + ' 低于 ' + fmtThreshold(th) + '%',
          metric: metric, operator: 'lt', threshold: th, threshold_origin: 'model_proposed',
        });
      }
      // 关注指标里 T0 值不可用的、以及系统算不出来的，全部落 unsupported_notes
      const unsupported = [];
      if (/财报|业绩|PE|市盈率|估值|毛利|营收/.test(t)) unsupported.push('“财报 / PE 等基本面数据”系统不提供，需自行确认后再人工判断');
      if (/别那么震|剧烈|情绪|消息面|政策/.test(t)) unsupported.push('“波动感受 / 消息面”无法用确定性条件表达，保留为人工提醒');

      return {
        judgment_text: t.replace(/\s+/g, ' ').trim(),   // 不添加自由发挥内容，只用用户原话
        stance: stance,
        conditions: conditions.slice(0, POLICY.max_conditions),
        unsupported_notes: unsupported,
        notes: problems.length ? problems : undefined,
      };
    }

    function generateCardDraft(input) {
      const ctx = state.contexts[input.context_id];
      if (!ctx) return result.err('CONTEXT_NOT_FOUND', '原冻结上下文已不可取回，请重新起草（不会用当前行情替代）', true);
      let lastErr = null;
      for (let attempt = 1; attempt <= POLICY.model_max_attempts; attempt++) {
        if (state.forceModelFailure) {
          lastErr = '第 ' + attempt + ' 次：模型输出未通过格式/语义校验（演示：模拟连续失败）';
          logEvent('model', 'P2 generate_card 第 ' + attempt + ' 次尝试失败', lastErr);
          continue;
        }
        const draft = draftFromText(ctx, input.user_text);
        const invalid = [];
        if (!draft.judgment_text) invalid.push('judgment_text 为空');
        draft.conditions.forEach((c) => {
          if (!isNum(c.threshold)) invalid.push('threshold 非有限数');
          if (VISIBLE_METRIC_KEYS.indexOf(c.metric) < 0) invalid.push('metric 不在可见指标内');
          if (ctx.snapshot.metrics[c.metric] == null) invalid.push(METRIC_LABELS[c.metric] + ' 在 T0 无可用值');
        });
        if (invalid.length) {
          lastErr = '第 ' + attempt + ' 次：' + invalid.join('；');
          logEvent('model', 'P2 generate_card 第 ' + attempt + ' 次尝试失败', lastErr);
          continue;
        }
        const draftId = makeUid('draft');
        state.drafts[draftId] = { draft: draft, context_id: ctx.context_id, raw_input: input.user_text };
        logEvent('model', 'P2 generate_card 第 ' + attempt + ' 次通过校验', 'draft=' + draftId + ' · 条件 ' + draft.conditions.length + ' 条（' +
          draft.conditions.map((c) => c.threshold_origin).join('/') + '）');
        return result.ok({ draft_id: draftId, context_id: ctx.context_id, draft: draft, attempts: attempt });
      }
