    var thesis = String(dossier && dossier.user_thesis || '');
    var observations = [];
    (Array.isArray(parsed.thesis_signal_observations) ? parsed.thesis_signal_observations : []).slice(0, 6).forEach(function (item) {
      if (!item || typeof item !== 'object') return;
      var quote = typeof item.quote === 'string' ? item.quote.trim().slice(0, 80) : '';
      var interpretation = typeof item.interpretation === 'string' ? item.interpretation.trim().slice(0, 160) : '';
      var definitionSource = item.definition_source === 'user' ? 'user' : 'conventional';
      var state = ['met', 'not_met', 'unverifiable'].indexOf(item.state) >= 0 ? item.state : '';
      if (!quote || !interpretation || !state || thesis.indexOf(quote) < 0) return;
      var dates = [];
      (Array.isArray(item.evidence_dates) ? item.evidence_dates : []).forEach(function (v) {
        var d = date(v);
        if (d && dates.indexOf(d) < 0 && dates.length < 4) dates.push(d);
      });
      var firstMet = state === 'met' ? date(item.first_met_on) : null;
      if (firstMet && dates.indexOf(firstMet) < 0) dates.unshift(firstMet);

    });
    return {
      status: status,
      headline: headline,
      arrangement_break_date: date(parsed.arrangement_break_date),
      reversal_date: date(parsed.reversal_date),
      technical_add_date: date(parsed.technical_add_date),
      explanation: explanation,
      evidence_dates: evidence,
      thesis_signal_observations: observations,
      confidence: confidence,
    };
  }

  function ruleThesisReview(dossier, reason) {
    var d = dossier || {};
    var c = d.candidates || {};
    var latest = d.latest || {};
    var status = 'waiting';
    var headline = '原判断仍在等待更明确的技术信号。';
    var explanation = '行情已经更新，但目前还没有同时满足趋势结构改善与连续确认。';
    if (!d.available_dates || !d.available_dates.length || !latest || latest.ma60 == null) {
      status = 'insufficient_data';
      headline = '日线或均线历史不足，暂时不能复核这条判断。';
      explanation = '至少需要足够的已收盘日线计算 MA5、MA10、MA20 和 MA60。';
    } else if (c.confirmed_reversal_date) {
      status = 'review_now';
      headline = '空头结构已经变化，并出现了可复核的反转确认。';
      explanation = '价格重新站上中期均线，短期均线关系改善且连续确认；这已经到了回看原 thesis 与加仓条件的时点。';
    } else if (c.bearish_break_date) {
      headline = '空头排列已经被打破，但反转尚未完全确认。';
      explanation = '均线不再维持标准空头排列；不过尚未同时出现并连续确认完整的反转组合，因此继续观察。';
    } else if (latest.bearish_stack) {
      headline = '空头排列仍在，原判断继续等待。';
      explanation = '最新日线仍满足 MA5 低于 MA10、MA10 低于 MA20、MA20 低于 MA60，尚未出现结构性反转确认。';
    }

      .filter(function (x, i, a) { return x && a.indexOf(x) === i; }).slice(0, 4);
    return {
      ok: true, version: TR_VERSION, source: 'rule', via: null, model: null,
      fallback_reason: reason || '', needsSetup: false,
      status: status, headline: headline,
      arrangement_break_date: c.bearish_break_date || null,
      reversal_date: c.confirmed_reversal_date || null,
      technical_add_date: c.confirmed_reversal_date || null,

  }

  function thesisReview(dossier, opts) {
    var o = opts || {};

      if (o.forceRule) return Promise.resolve(ruleThesisReview(dossier, '已指定规则版'));
      var local = readConfig(o.storage);
      var base = [
        { role: 'system', content: trSystemPrompt() },
        { role: 'user', content: trUserPrompt(dossier) },
      ];
      var useDirect = o.prefer === 'direct';
      var send = function (cfg, messages, temperature) {
        var oo = {};

        valid.via = res.via || null; valid.model = res.model || null; valid.fallback_reason = '';

  function auditPanel(card, review) {

    });

      const r=byId[x.cond.condition_id];

      return {desc:E.buildRuleDesc(x.cond.metric,x.cond.operator,x.cond.threshold),state:st,inferred:x.eff.origin==='inferred'};
    });

    return `<section class="merged-grid">${callOff}<div class="merged-block"><div class="row between"><h3>审计链</h3><button class="text-btn" data-action="verify-ledger">验证链条</button></div><div class="ledger-line"><span class="mono">T0 · ${card.snapshot.bar_date}</span><code>${first}</code></div><div class="ledger-line"><span class="mono">T1 · ${S.date}</span><code>${second}</code></div><p class="tiny muted">每次冻结与复核都留下前序指纹，便于复盘来源。</p></div></section>`;
  }
  function chartPanel() {

    if(!r) return `<section class="panel chart-panel" aria-label="行情研究">${empty('这个日期还没有可用行情','换一天，或者换一只标的再看看。')}</section>`;
    const q=r.quote,symbol=r.instrument.symbol,maOptions=[5,10,20,60,120,200],subOptions=[['volume','成交量'],['macd','MACD'],['kdj','KDJ'],['rsi','RSI']],intervalLabel=chartIntervalLabels[S.chartInterval],indicatorSource=S.chartInterval==='1D'?(S.live.mode==='live'?'Bitget rToken 日K':'当前缓存日K'):'Bitget rToken '+intervalLabel+' K',windowInfo=chartWindow(),hasOlder=windowInfo.offset<windowInfo.maxOffset,hasNewer=windowInfo.offset>0;
    return `<section class="panel chart-panel" aria-label="行情研究"><div class="chart-header"><div class="row between"><div class="instrument-title">${logo(symbol)}<div><h2>${esc(symbol)} <span class="badge">${intervalLabel}</span></h2><small>${company[symbol]||esc(r.instrument.display_name)} · 代币化股票 / USDT</small></div></div><select aria-label="研究标的" id="asset-select" style="background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;font-size:10px;max-width:105px">${service.catalog().instruments.filter(i=>S.watch.some(w=>watchKey(w)===watchKey(i.symbol))).map(i=>`<option value="${i.instrument_id}" ${i.instrument_id===S.instrument?'selected':''}>${i.symbol}</option>`).join('')}</select></div><div class="price-block"><span class="price">${price(q.close_price)}</span><span class="price-change">${pct(q.metrics.chg_1d)} <span class="muted">单日</span></span></div></div>
      <div class="chart-controls"><div class="chart-legend"><span><i class="line-dot"></i>${intervalLabel}${S.chartType==='line'?'收盘':''}</span>${S.chartInterval==='1D'?'<span><i class="line-dot dashed"></i>判断时点</span>':''}${chartHoles(windowInfo.bars).length?'<span><i class="line-dot gap"></i>缺数据</span>':''}</div><div class="row chart-top-actions"><div class="segments chart-intervals" role="group" aria-label="K线周期">${['1H','4H','1D'].map(key=>`<button data-chart-interval="${key}" class="${S.chartInterval===key?'active':''}" aria-pressed="${S.chartInterval===key}">${chartIntervalLabels[key]}</button>`).join('')}</div><button class="icon-btn" data-action="chart-type" aria-label="${S.chartType==='line'?'切换为K线图':'切换为收盘折线图'}" title="${S.chartType==='line'?'切换为K线图':'切换为收盘折线图'}">${icon(S.chartType==='line'?'candle':'chart')}</button></div></div>

      <div class="chart-indicators" role="group" aria-label="均线叠加"><span class="indicator-title">叠加均线</span>${maOptions.map(p=>`<label class="ma-toggle ma-${p}"><input type="checkbox" data-ma-period="${p}" ${S.maPeriods.includes(p)?'checked':''}><i></i>MA${p}</label>`).join('')}<span class="indicator-source">${indicatorSource}</span></div>
      <div class="chart-indicators chart-sub-indicators" role="group" aria-label="技术指标副图"><span class="indicator-title">技术指标</span>${subOptions.map(([name,label])=>`<label class="ma-toggle sub-toggle sub-${name}"><input type="checkbox" data-sub-indicator="${name}" ${S.subIndicators.includes(name)?'checked':''}><i></i>${label}</label>`).join('')}<span class="indicator-source">仅使用已收盘${intervalLabel}</span></div>

      <div class="replay-bar" aria-label="研究时点控制"><div class="replay-title">${icon('clock')}<div><strong>研究时点</strong><small>只看截至 ${S.date} 已收盘的数据</small></div></div><label class="research-date-picker" for="research-date"><span>选择日期</span><input class="date-input" type="date" id="research-date" aria-label="选择研究时点" value="${S.date}" min="${minDate()}" max="${maxDate()}"></label><div class="replay-presets" role="group" aria-label="研究时点快捷跳转"><button class="text-btn" data-action="date-preset" data-date="${minDate()}">起始日</button><button class="text-btn" data-action="date-preset" data-date="${E.DEMO_T1_DATE}">最近 7 天</button></div><span class="spacer"></span><button class="icon-btn" data-action="step-date" data-days="-1" aria-label="前一天" ${S.date<=minDate()?'disabled':''}>${icon('back')}</button><button class="btn small" data-action="step-date" data-days="1" ${S.date>=maxDate()?'disabled':''}>后一天${icon('chevron')}</button><button class="btn small ghost" data-action="latest" ${S.date===maxDate()?'disabled':''}>缓存最新</button></div>

  }
  function withTechnicalIndicators(history, maPeriods) {
    const bars=history.map(bar=>Object.assign({},bar,{mas:{},technical:{volume:bar.volume,macd:null,kdj:null,rsi:null}}));
    const closes=bars.map(bar=>bar.close);
    maPeriods.forEach(period=>bars.forEach((bar,index)=>{
      if(index+1>=period) bar.mas[period]=closes.slice(index-period+1,index+1).reduce((sum,value)=>sum+value,0)/period;
    }));

    const ema=(period)=>{
      let value=null;
      return closes.map((close,index)=>{
        if(index+1<period) return null;
        if(index+1===period) value=closes.slice(0,period).reduce((sum,item)=>sum+item,0)/period;
        else value=(close-value)*(2/(period+1))+value;
        return value;
      });
    };
    const fast=ema(12),slow=ema(26),dif=fast.map((value,index)=>E.isNum(value)&&E.isNum(slow[index])?value-slow[index]:null);
    let dea=null,signal=[];
    dif.forEach((value,index)=>{
      if(!E.isNum(value)) return;
      signal.push(value);
      if(signal.length<9) return;
      if(signal.length===9) dea=signal.reduce((sum,item)=>sum+item,0)/9;
      else dea=(value-dea)*(2/10)+dea;
      bars[index].technical.macd={dif:value,dea,hist:2*(value-dea)};
    });

    let k=50,d=50;
    bars.forEach((bar,index)=>{
      if(index+1<9) return;
      const window=bars.slice(index-8,index+1),high=Math.max(...window.map(item=>item.high)),low=Math.min(...window.map(item=>item.low));
      const rsv=high===low?50:(bar.close-low)/(high-low)*100;
      k=(2*k+rsv)/3;d=(2*d+k)/3;
      bar.technical.kdj={k:k,d:d,j:3*k-2*d};
    });

    let gains=[],losses=[],avgGain=null,avgLoss=null;
    for(let index=1;index<bars.length;index+=1){
      const change=bars[index].close-bars[index-1].close,gain=Math.max(change,0),loss=Math.max(-change,0);
      gains.push(gain);losses.push(loss);
      if(gains.length<14) continue;
      if(gains.length===14){avgGain=gains.reduce((sum,item)=>sum+item,0)/14;avgLoss=losses.reduce((sum,item)=>sum+item,0)/14;}
      else {avgGain=(avgGain*13+gain)/14;avgLoss=(avgLoss*13+loss)/14;}
      bars[index].technical.rsi=avgLoss===0?(avgGain===0?50:100):100-100/(1+avgGain/avgLoss);
    }
    return bars;
  }

  function chartTimeMs(bar) {
    const value=Date.parse(bar && (bar.open_time||bar.time));
    return Number.isFinite(value)?value:0;
  }
  /** 标称间隔：只在拿不到真实间隔时兜底 */
  function nominalStep() {
    return S.chartInterval==='1H'?3600000:S.chartInterval==='4H'?14400000:86400000;
  }
  /**
   * 这套数据自己的「正常间隔」= 相邻两根出现最多的那个差值（众数）。
   *
   * 为什么不直接用标称间隔：rToken 的日线**天生缺周六**。实测 rMETA 300 根日K，
   * 相邻间隔是 24h×264、48h×31、72h×4 —— 48h 就是漏掉的周六，72h 是长周末。
   * 原来是「超过标称 1.5 倍（36h）就断线」，于是 300 根里有 **35 处**被剪断，
   * 每个周末收盘线和均线都断一次，整张图看着是碎的。
   * 用众数当基准之后，断线只代表「缺了明显不正常的一段」，而不是「市场那天没开」。
   */
  function chartStep(bars) {
    const counts=new Map();
    for(let i=1;i<bars.length;i+=1){
      const delta=chartTimeMs(bars[i])-chartTimeMs(bars[i-1]);
      if(delta>0)counts.set(delta,(counts.get(delta)||0)+1);
    }
    let best=0,bestCount=0;
    counts.forEach((n,delta)=>{if(n>bestCount||(n===bestCount&&delta<best)){best=delta;bestCount=n;}});
    return best||nominalStep();
  }
  /** 超过正常间隔的 4 倍、并且至少空满 4 天，才算「缺了一段」。 */
  const CHART_GAP_RATIO=4;
  const CHART_GAP_MIN_MS=96*3600000;
  /**
   * 断线阈值（毫秒），两档取大：
   *  ① 正常间隔的 4 倍 —— 日线的长周末（72h）是 3 倍，仍然算连续；
   *  ② 空满 4 天 —— 各周期的「规律性休市」都比这个短，不该被当成数据缺失。
   *
   * 为什么底线是 4 天而不是更短（实测数据说话）：
   *  - 1 小时线：最大空档 8h。按 4 倍算是 4h，于是那些几小时的洞把 MA5/10/20 各切成 3 段。
   *  - 4 小时线：每周末固定空 48~76h（起于周五 20:00 UTC，缺口前后量能从 800 万掉到几万），
   *    按 24h 的底线算，一张 60 天的图会被打上 8~10 条「缺口」竖虚线 —— 全是休市，不是缺数据。
   *  - 日线：自身阈值就是 96h（24h×4），不受这条底线影响。
   * → 只有真的缺了好几天（数据源挂掉那种）才断线、才标竖虚线。这是异常提示，不是常规装饰。
   */
  function chartGapMs(step) {
    return Math.max((step||nominalStep())*CHART_GAP_RATIO,CHART_GAP_MIN_MS);
  }
  function chartGap(previous,current,step) {
    return chartTimeMs(current)-chartTimeMs(previous)>chartGapMs(step);
  }
  /** 阈值的说法：不到 48 小时就报小时，否则报天。 */
  function chartGapLabel(step) {
    const ms=chartGapMs(step);
    return ms<48*3600000?(ms/3600000)+' 小时':(ms/86400000)+' 天';
  }
  /** 可见窗口里真正缺了一段的位置（下标）。画虚线、写图例、aria-label 都用它。 */
  function chartHoles(bars) {
    const step=chartStep(bars),holes=[];
    for(let i=1;i<bars.length;i+=1)if(chartGap(bars[i-1],bars[i],step))holes.push(i);
    return holes;
  }
  function chartTimeLabel(bar,compact=false) {
    if (!bar) return '—';
    if (S.chartInterval==='1D') return String(bar.time).slice(0,10);
    const time=chartTimeMs(bar);
    if (!time) return String(bar.time||'—');
    const parts=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(time));
    const part=type=>parts.find(item=>item.type===type)?.value||'';
    return compact?part('month')+'/'+part('day')+' '+part('hour')+':'+part('minute'):part('month')+'-'+part('day')+' '+part('hour')+':'+part('minute');
  }
  function chartHistory() {
    const daily=S.chartInterval==='1D';
    const raw=daily?(S.chart?.bars||[]):(S.intradayChart?.bars||[]);
    const cutoff=daily?null:Date.parse(S.date+'T16:00:00.000Z');
    return raw.filter(b=>b && [b.open,b.high,b.low,b.close].every(E.isNum)
      && (daily ? String(b.time).slice(0,10)<=S.date : b.is_closed!==false && (!Number.isFinite(cutoff)||chartTimeMs(b)<cutoff)))
      .slice().sort((a,b)=>chartTimeMs(a)-chartTimeMs(b));
  }
  function chartWindow(history) {
    const all=history||chartHistory(),total=all.length,zoom=Math.min(Math.max(30,S.chartZoom),Math.max(30,Math.min(360,total||30)));
    const maxOffset=Math.max(0,total-Math.min(total,zoom)),offset=Math.min(Math.max(0,S.chartOffset),maxOffset),end=Math.max(0,total-offset),start=Math.max(0,end-zoom);
    return {history:all,bars:all.slice(start,end),total,zoom,offset,maxOffset};
  }
  function lineSegments(bars, valueOf, x, y, step) {
    const segments=[];let last=-1;
    bars.forEach((bar,index)=>{
      const value=valueOf(bar);
      if(!E.isNum(value)){last=-1;return;}
      if(last<0||chartGap(bars[last],bar,step)) segments.push([]);
      segments[segments.length-1].push([x(index),y(value)]);last=index;
    });
    return segments.filter(segment=>segment.length).map(segment=>'M'+segment.map(point=>point.join(',')).join(' L')).join(' ');
  }

  function indicatorPanel(name,bars) {
    const W=800,H=92,L=12,R=44,T=20,B=10,iw=W-L-R,ih=H-T-B;
    const x=index=>L+(bars.length===1?iw*.5:iw*index/(bars.length-1));
    const config={
      volume:{title:'成交量',detail:'VOL · Bitget '+chartIntervalLabels[S.chartInterval]+' K',latest:bars[bars.length-1].volume,series:[{value:bar=>bar.volume,color:'var(--sub)'}]},
      macd:{title:'MACD',detail:'12 / 26 / 9',series:[{value:bar=>bar.technical.macd?.dif,color:'#e7b95c'},{value:bar=>bar.technical.macd?.dea,color:'#73b8d9'}]},
      kdj:{title:'KDJ',detail:'9 / 3 / 3',fixed:[-20,120],guides:[20,80],series:[{value:bar=>bar.technical.kdj?.k,color:'#e7b95c'},{value:bar=>bar.technical.kdj?.d,color:'#73b8d9'},{value:bar=>bar.technical.kdj?.j,color:'#b995e8'}]},
      rsi:{title:'RSI',detail:'14',fixed:[0,100],guides:[30,70],series:[{value:bar=>bar.technical.rsi,color:'#b995e8'}]},
    }[name];
    if(!config) return '';
    const values=config.series.flatMap(series=>bars.map(series.value).filter(E.isNum));
    if(!values.length) return `<section class="indicator-panel indicator-${name}" aria-label="${config.title}"><div class="indicator-head"><b>${config.title}</b><span>${config.detail}</span></div><p class="indicator-empty">历史${chartIntervalLabels[S.chartInterval]}不足，暂不能计算该指标。</p></section>`;
    let lo=config.fixed?config.fixed[0]:Math.min(...values),hi=config.fixed?config.fixed[1]:Math.max(...values);
    if(name==='macd'){lo=Math.min(lo,0);hi=Math.max(hi,0);}
    const spread=(hi-lo)||1; if(!config.fixed){lo-=spread*.12;hi+=spread*.12;}
    const step=chartStep(bars),holes=chartHoles(bars);
    const y=value=>T+ih*(hi-value)/(hi-lo);
    const grid=(config.guides||[lo+(hi-lo)*.25,lo+(hi-lo)*.75]).map(value=>`<line x1="${L}" x2="${W-R}" y1="${y(value)}" y2="${y(value)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${W-R+6}" y="${y(value)+3}" fill="var(--muted)" font-size="8" font-family="var(--mono)">${value.toFixed(name==='volume'?0:1)}</text>`).join('');
    const series=config.series.map(series=>{const path=lineSegments(bars,series.value,x,y,step);return path?`<path d="${path}" fill="none" stroke="${series.color}" stroke-width="1.45" vector-effect="non-scaling-stroke"/>`:'';}).join('');
    const volume=name==='volume'?(()=>{const top=Math.max(...values)||1,cw=Math.max(1.5,iw/bars.length*.72);return bars.map((bar,index)=>`<rect x="${x(index)-cw/2}" y="${T+ih*(1-bar.volume/top)}" width="${cw}" height="${Math.max(1,ih*bar.volume/top)}" fill="${bar.close>=bar.open?'var(--red)':'var(--green)'}" opacity=".72"/>`).join('');})():'';
    const histogram=name==='macd'?(()=>{const hist=bars.map(bar=>bar.technical.macd?.hist),zero=y(0),cw=Math.max(1.5,iw/bars.length*.72);return hist.map((value,index)=>E.isNum(value)?`<rect x="${x(index)-cw/2}" y="${Math.min(zero,y(value))}" width="${cw}" height="${Math.max(1,Math.abs(y(value)-zero))}" fill="${value>=0?'var(--red)':'var(--green)'}" opacity=".62"/>`:'').join('')+'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+zero+'" y2="'+zero+'" stroke="var(--muted)" opacity=".65"/>';})():'';
    const latest=E.isNum(config.latest)?config.latest.toFixed(2):'';
    return `<section class="indicator-panel indicator-${name}" aria-label="${config.title} ${config.detail}"><div class="indicator-head"><b>${config.title}</b><span>${config.detail}</span>${latest?'<strong>'+latest+'</strong>':''}</div><svg class="indicator-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${config.title} 指标图${holes.length?'，其中 '+holes.length+' 处缺数据':''}">${grid}${volume}${histogram}${series}${holes.map(i=>`<line class="chart-gap-mark" x1="${x(i-.5)}" x2="${x(i-.5)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" opacity=".55" stroke-dasharray="2 3"/>`).join('')}</svg></section>`;
  }

  let chartPoints=[];
  function drawChart() {
    // 日K 按研究时点截断；小时 K 线同样只显示该日期结束前的已收盘柱。
    const history=chartHistory();
    const maPeriods=S.maPeriods.filter(p=>[5,10,20,60,120,200].includes(p));
    const enriched=withTechnicalIndicators(history,maPeriods);
    const window=chartWindow(enriched),bars=window.bars;
    chartPoints=bars;
    if (!bars.length) return '<div class="chart-empty">此时点还没有可用'+esc(chartIntervalLabels[S.chartInterval])+'<br><span class="tiny">试试切换周期、推进研究时点，或查看其他标的</span></div>';
    const W=800,H=255,L=12,R=65,T=25,B=38,iw=W-L-R,ih=H-T-B;
    const maValues=maPeriods.flatMap(period=>bars.map(b=>b.mas[period]).filter(E.isNum));
    let lo=Math.min(...bars.map(b=>b.low),...maValues),hi=Math.max(...bars.map(b=>b.high),...maValues);
    const spread=(hi-lo)||1;lo-=spread*.14;hi+=spread*.14;
    const step=chartStep(bars),holes=chartHoles(bars);
    const x=i=>L+(bars.length===1?iw*.5:iw*i/(bars.length-1));
    const y=v=>T+ih*(hi-v)/(hi-lo);
    let grid='';
    for(let i=0;i<5;i++) {const yy=T+ih*i/4,v=hi-(hi-lo)*i/4;grid+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="2 5" opacity=".7"/><text x="${W-R+13}" y="${yy+4}" fill="var(--muted)" font-size="10" font-family="var(--mono)">${v.toFixed(2)}</text>`;}
    const parts=[];bars.forEach((b,i)=>{if(!i||chartGap(bars[i-1],b,step))parts.push([]);parts[parts.length-1].push([x(i),y(b.close)]);});
    const line=parts.map(p=>`<path d="M${p.map(v=>v.join(',')).join(' L')}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M${p[0][0]},${H-B} L${p.map(v=>v.join(',')).join(' L')} L${p[p.length-1][0]},${H-B} Z" fill="url(#chart-fill)"/>`).join('');
    // 实体宽度取到槽宽的 0.72（原来 0.55）：240 根时实体只有 1.7px、槽宽 3.0px，
    // 蜡烛之间留出 1.3px 空隙，整排看着像梳子 —— 这也是用户说的「断」。
    const candle=bars.map((b,i)=>{const c=b.close>=b.open?'var(--red)':'var(--green)',cw=Math.max(1,Math.min(8,iw/bars.length*.72));return `<line x1="${x(i)}" x2="${x(i)}" y1="${y(b.high)}" y2="${y(b.low)}" stroke="${c}"/><rect class="chart-candle" x="${x(i)-cw/2}" y="${Math.min(y(b.open),y(b.close))}" width="${cw}" height="${Math.max(1,Math.abs(y(b.close)-y(b.open)))}" fill="${c}"/>`;}).join('');
    const maColors={5:'#e7b95c',10:'#73b8d9',20:'#b995e8',60:'#70c4a2',120:'#ed9a70',200:'#e176a5'};
    const maLines=maPeriods.map(period=>{
      const segments=[];let last=-1;
      bars.forEach((bar,index)=>{
        const value=bar.mas[period];
        if(!E.isNum(value)){last=-1;return;}
        if(last<0||chartGap(bars[last],bar,step))segments.push([]);
        segments[segments.length-1].push([x(index),y(value)]);last=index;
      });
      return segments.filter(segment=>segment.length).map(segment=>`<path class="ma-line ma-line-${period}" data-period="${period}" d="M${segment.map(v=>v.join(',')).join(' L')}" fill="none" stroke="${maColors[period]}" stroke-width="1.65" vector-effect="non-scaling-stroke"/>`).join('');
    }).join('');
    const marks=S.chartInterval==='1D'?(S.chart?.markers||[]).filter(m=>m.kind==='thesis'):[];
    const unique=[...new Set(marks.map(m=>m.time))];
    const markers=unique.map(date=>{const i=bars.findIndex(b=>b.time===date);if(i<0)return '';return `<line x1="${x(i)}" x2="${x(i)}" y1="12" y2="${H-B}" stroke="var(--amber)" opacity=".6" stroke-dasharray="3 4"/><rect x="${Math.min(x(i)-22,W-R-60)}" y="5" width="60" height="18" rx="4" fill="#3b3426"/><text x="${Math.min(x(i)+8,W-R-30)}" y="17" text-anchor="middle" font-size="9" fill="var(--amber)">T0 · ${date.slice(5)}</text>`;}).join('');
    const dates=[...new Set([0,Math.floor((bars.length-1)*.25),Math.floor((bars.length-1)*.5),Math.floor((bars.length-1)*.75),bars.length-1])].map(i=>`<text x="${x(i)}" y="${H-13}" text-anchor="${i===0?'start':i===bars.length-1?'end':'middle'}" fill="var(--muted)" font-size="10" font-family="var(--mono)">${chartTimeLabel(bars[i],true)}</text>`).join('');
    // 真的缺了一段的地方画一条竖虚线，位置放在缺口的当中。
    // x 轴按「根数」等距，所以光看日期标签看不出中间跳过了几天 —— 线可以连着，
    // 但不能让人以为每一天都在图上。
    const holeMarks=holes.map(i=>`<line class="chart-gap-mark" x1="${x(i-.5)}" x2="${x(i-.5)}" y1="${T}" y2="${H-B}" stroke="var(--muted)" opacity=".55" stroke-dasharray="2 3"/>`).join('');
    const last=bars[bars.length-1];
    const panels=S.subIndicators.map(name=>indicatorPanel(name,bars)).join('');
    return `<svg id="price-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${currentSymbol()} 截至 ${S.date} 的 ${bars.length} 根 Bitget rToken ${chartIntervalHints[S.chartInterval]}${maPeriods.length?'，已叠加 MA'+maPeriods.join('、MA'):''}${holes.length?'，其中 '+holes.length+' 处缺数据（空档超过 '+chartGapLabel(step)+'）':'，区间连续无缺口（相邻间隔均短于 '+chartGapLabel(step)+'）'}" data-chart-width="${W}" data-chart-left="${L}" data-chart-inner-width="${iw}"><defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b3d277" stop-opacity=".16"/><stop offset="1" stop-color="#b3d277" stop-opacity="0"/></linearGradient></defs>${grid}${S.chartType==='line'?line:candle}${holeMarks}${maLines}${markers}<circle cx="${x(bars.length-1)}" cy="${y(last.close)}" r="3.5" fill="var(--accent)"/><line x1="${L}" x2="${W-R}" y1="${y(last.close)}" y2="${y(last.close)}" stroke="var(--accent)" opacity=".23" stroke-dasharray="3 4"/>${dates}<line id="crosshair" class="hidden" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--sub)" stroke-dasharray="3 3"/><rect id="chart-hit" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/></svg>${panels?'<div class="indicator-panels">'+panels+'</div>':''}`;
  }
  /** 周期一旦写进卡片就是裁决的时钟，用户必须在保存前知道（00 §7.4） */
  function horizonHintText(f){
    const t=E.parseHorizonText?E.parseHorizonText(f.rawText||f.text):null;
    return t?'将按 <b>'+t.days+' 天</b>计时（来自你写的「'+esc(t.quote)+'」）':'你没写周期：系统仍会在每次刷新后，把原话和最新行情对照';
  }
  function composer() {

  }
  /** 列表行上显示的标的代码 —— 取消关注的标的要从冻结卡片里找回 */
  function rowSymbol(c){
    const inst=service.instrumentById(c.instrument_id);
    const card=allCards().find(x=>x.card_id===c.card_id);
    return (inst||(card&&card.instrument)||{symbol:c.instrument_id}).symbol;
  }
  function queueData() {
    // 取消关注不删除历史研究，标的信息可从冻结卡片中恢复。
    let cs=S.review.comparisons.slice();
    // 搜索与标的筛选：控件原来是「研究档案」那页的，三页合并后直接作用于这张表
    const q=(S.search||'').trim().toLowerCase();
    if(q){
      cs=cs.filter(c=>{
        const card=allCards().find(x=>x.card_id===c.card_id);
        return (rowSymbol(c)+' '+((card&&card.raw_input)||'')+' '+((card&&card.judgment_text)||'')).toLowerCase().includes(q);
      });
    }
    if(S.journalAsset&&S.journalAsset!=='all')cs=cs.filter(c=>c.instrument_id===S.journalAsset);
    if(S.filter==='pending') {const ids=new Set(resultJudgments().map(c=>c.card_id));cs=cs.filter(c=>ids.has(c.card_id));}
    else if(S.filter==='waiting') {const ids=new Set(waitingJudgments().map(c=>c.card_id));cs=cs.filter(c=>ids.has(c.card_id));}
    const order={met_now:0,unknown:1,met_before:2,waiting:3,no_conditions:4};
    return cs.sort((a,b)=>(reviewActionable(a)?0:1)-(reviewActionable(b)?0:1)
      || order[a.bucket]-order[b.bucket] || a.instrument_id.localeCompare(b.instrument_id));
  }
  const empty=(title,desc)=>`<div class="empty-state">${icon('book')}<h3>${title}</h3><p>${desc}</p></div>`;
  function legacySettingsBase() {
    return heading('清楚每一条数据从哪里来。','演示数据、本地存储和计算口径，都在这里。','TRANSPARENT BY DESIGN')+`<div class="insight-grid"><section class="panel"><div class="panel-header"><h2>工作区与数据</h2>${icon('layers')}</div><div class="data-list"><div class="data-row"><span>当前空间</span><span>${S.ws==='example'?'示例工作区':'我的研究空间'}</span></div><div class="data-row"><span>行情来源</span><span class="accent">固定种子的合成日线</span></div><div class="data-row"><span>缓存区间</span><span class="mono">2026.06.15 – 09.15</span></div><div class="data-row"><span>行情网络请求</span><span class="mono">${service.marketRequests()}</span></div><div class="data-row"><span>研究记录</span><span>${allCards().length} 张</span></div><div class="data-row"><span>存储方式</span><span>${storage?'当前浏览器的本地存储':'仅本次会话内存'}</span></div><div class="row wrap" style="margin-top:17px"><button class="btn small" data-action="workspace">${icon('layers')}切换到${S.ws==='example'?'我的研究':'示例空间'}</button><button class="btn small" data-action="export">${icon('download')}导出 JSON</button></div></div></section><section class="panel"><div class="panel-header"><h2>读懂这张快照</h2>${icon('lock')}</div><div class="help-text"><p>研究日期是当时允许看见数据的边界。保存时间是真实操作的时刻。历史回放中，两者可以不同。</p><p style="margin-top:13px">新判断会把原话与已收盘行情持续对照；旧卡已经保存的机械条件仍按原口径回看。缺失日线不会补成零，也不会宣称确定的首次触发日。</p><p style="margin-top:13px">红色表示上涨，绿色表示下跌。USDT 报价属于演示中的代币化股票，不代表纳斯达克原股票现价。演示产品代码尚未通过官方接口核验。</p></div></section><section class="panel"><div class="panel-header"><h2>你的研究，由你保管</h2>${icon('folder')}</div><div class="help-text"><p>数据保存在当前浏览器与当前打开地址下。移动 HTML 文件、换浏览器或清理浏览器数据后，原有本地记录可能无法读取。建议定期导出 JSON，保留原话、快照、复盘与承接关系。</p><p style="margin-top:13px">示例空间与个人空间相互独立。界面没有连接真实行情、交易或 AI 服务。此版本的导出文件用于备份与外部处理，暂不支持导入恢复。</p></div></section><section class="panel"><div class="panel-header"><h2>服务活动</h2><span class="badge">最近 8 条</span></div><div class="data-list">${service.getLog().slice(-8).reverse().map(l=>`<div class="log-item">${esc(l.label)}<p>${esc(l.detail)}</p></div>`).join('')}</div></section></div>`;
  }
  /* ── 「我的判断」────────────────────────────────────────────────────────
     原来的「研究档案 / 复核队列 / 研究洞察」三页并成一页：它们展示的本来就是
     同一批卡片，只是切法不同。现在用页内筛选区分，导航上只留一个入口。 */

  /** 表格主体。类名保持 .queue-table —— meta-regression 测试按下标取
   *  #detail-dialog .snapshot-price，表格结构和行内元素不能动。 */
  /** 勾选之后出现的操作条。空选时不渲染，所以平时完全不占位置。 */
  function bulkBar() {
    if (!S.picks.size) return '';
    return `<div class="queue-bulk${S.bulkAsk?' confirming':''}">`
      + (S.bulkAsk
        ? '<span class="danger-note">'+icon('info')+'这 '+S.picks.size+' 张会一起删掉：原话、冻结快照和它们的复盘都会移进回收站。</span>'
          +'<div class="row" style="gap:8px"><button class="btn small ghost" data-action="pick-cancel">再想想</button>'
          +'<button class="btn small danger" data-action="pick-confirm">确认删除 '+S.picks.size+' 张</button></div>'
        : '<span>已勾选 <b>'+S.picks.size+'</b> 张</span>'
          +'<div class="row" style="gap:8px"><button class="btn small ghost" data-action="pick-clear">取消勾选</button>'
          +'<button class="btn small danger" data-action="pick-delete">删除所选</button></div>')
      +'</div>';
  }

  /**
   * 勾选变化时只动操作条和勾选框，不重建整张表 ——
   * 重建会把表格的滚动位置弹回顶部，勾一行跳一次很难用。
   *
   * 逐行的勾选框必须显式同步：全选 / 取消勾选改的是 S.picks，行上的 <input> 不会
   * 自己跟着变。漏掉这一步就会出现「底栏写着已勾选 2 张，行上只勾了一个」。
   */
  function refreshPickState() {
    const box=$('#journal-results');
    if(!box)return;
    const bar=box.querySelector('.queue-bulk'), html=bulkBar();
    if(bar){if(html)bar.outerHTML=html;else bar.remove();}
    else if(html)box.insertAdjacentHTML('afterbegin',html);

    const cs=queueData();
    let picked=0;
    box.querySelectorAll('[data-pick]').forEach(el=>{
      const on=S.picks.has(el.dataset.pick);
      el.checked=on;
      if(on)picked+=1;
    });
    const all=box.querySelector('[data-pick-all]');
    if(all){
      all.checked=cs.length>0&&picked>=cs.length;
      // 勾了一部分时给全选框一个「半选」态，否则看不出表里还有没勾的
      all.indeterminate=picked>0&&picked<cs.length;
    }
  }

  function judgmentsTable() {
    const cs=queueData();
    // 勾选集合里可能有已经被删掉的卡（删完不重渲染那一路），对着现存卡片清一遍。
    // 用 allCards() 而不是 cs：换筛选条件不该把已勾选的选择丢掉。
    const known=new Set(allCards().map(c=>c.card_id));
    S.picks.forEach(id=>{if(!known.has(id))S.picks.delete(id);});
    if(!S.picks.size) S.bulkAsk=false;

    const bulk=bulkBar();

    // 列表可能是空的（换了筛选），但勾选还在 —— 操作条要跟着出来，不能让人清不掉选择
    if(!cs.length){
      const hasAny=S.review.comparisons.length>0;
      const title=S.filter==='waiting'?'目前没有正在观察的判断':S.filter==='pending'?'目前还没有已经出结果的判断':hasAny?'没有找到符合当前筛选的判断':'还没有写下判断';
      const desc=hasAny?(S.filter==='all'?'换个关键词或标的再试试。':'其他判断可以在“全部”里查看。'):'先写下第一张判断，系统会跟着后面的行情继续看。';
      return bulk+empty(title,desc);
    }

    const allPicked=cs.every(c=>S.picks.has(c.card_id));
    const head='<thead><tr><th style="width:4%"><input type="checkbox" class="queue-pick" data-pick-all '
      +(allPicked?'checked ':'')+'aria-label="全选当前列表的判断"></th>'
      +'<th style="width:15%">研究标的</th><th style="width:28%">当时的判断</th><th style="width:13%">记录时点</th>'
      +'<th style="width:18%">现在怎么样</th><th style="width:11%">已经过了</th><th style="width:11%"></th></tr></thead>';

    const rows=cs.map(c=>{
      const sym=(service.instrumentById(c.instrument_id)||allCards().find(x=>x.card_id===c.card_id)?.instrument||{symbol:c.instrument_id}).symbol;
      const reflected=reflectFor(c.card_id).some(r=>r.asOf===S.date);
      const actionText=reflected?'已复盘':reviewActionable(c)?'复盘结果':'查看进展';
      return `<tr data-detail="${c.card_id}" tabindex="0" role="button" aria-label="回看 ${sym} 的判断">`
        +`<td class="queue-pick-cell"><input type="checkbox" class="queue-pick" data-pick="${c.card_id}" `
        +(S.picks.has(c.card_id)?'checked ':'')+`aria-label="勾选 ${sym} 的这张判断"></td>`
        +`<td><div class="asset-cell">${logo(sym)}<div><strong>${sym}</strong></div></div></td>`
        +`<td><p class="judgment-preview">${esc(c.raw_input||c.last_judgment)}</p></td>`
        +`<td class="mono muted">${c.baseline_snapshot.bar_date.slice(5).replace('-',' / ')}</td>`
        +`<td><div class="judgment-progress">${progressBadge(c)}<p>${esc(progressDetail(c))}</p></div></td>`
        +`<td class="mono sub">${c.days_since??'—'} <span class="tiny muted">天</span></td>`
        +`<td><div class="row-actions"><button class="review-link" data-detail="${c.card_id}" aria-label="回看 ${sym} 的判断">${actionText}${icon('arrow')}</button>`
        +`<button class="row-del" data-del-card="${c.card_id}" aria-label="删除 ${sym} 的这张判断" title="删除这张判断">${icon('trash')}</button></div></td></tr>`;
    }).join('');

    return bulk+'<div class="table-scroll"><table class="queue-table">'+head+'<tbody>'+rows+'</tbody></table></div>';
  }

  /** 工作台底部的提醒条：只在真有事的时候出现，0 条时整条不渲染。 */
  function reviewReminder() {
    const n=pending().length;
    if(!n) return '';
    return '<button class="review-reminder" data-page="judgments" data-filter="pending">'
      + icon('spark')

      + '<span class="rr-go">去看看'+icon('arrow')+'</span></button>';
  }

  /** 原来的「研究洞察」收进折叠区 —— 想看的人点开，不占主视线 */
  function insightsPanel(data, done, percent) {
    if(!data.length) return '';
    const observing=waitingJudgments().length,results=resultJudgments().length,total=Math.max(1,observing+results);
    return '<details class="jdg-more"><summary>展开统计</summary>'
      + `<div class="insight-grid"><section class="panel"><div class="panel-header"><h2>记录之后，有没有回来看？</h2></div><div class="insight-body"><div class="quality-ring" style="--progress:${percent}%"><div><strong>${percent}%</strong><small>留下复盘的比例</small></div></div><p class="tiny sub" style="text-align:center">${done} / ${data.length} 张记录留下了复盘 · ${observing} 张仍在观察</p></div></section><section class="panel"><div class="panel-header"><h2>当前进展</h2></div><div class="insight-body"><div class="bar-row"><span>正在观察</span><div class="bar-track"><div class="bar-fill" style="width:${observing/total*100}%;opacity:.6"></div></div><span class="mono">${observing}</span></div><div class="bar-row"><span>已经出了结果</span><div class="bar-track"><div class="bar-fill" style="width:${results/total*100}%"></div></div><span class="mono">${results}</span></div><p class="tiny muted">每个标的最近一张判断 · ${S.date}</p></div></section><section class="panel"><div class="panel-header"><h2>给下一次研究的小提示</h2>${icon('spark')}</div><div class="help-text"><p>把等待的信号、会改变看法的事实直接写进原话，系统会沿着这段话继续观察。</p><p style="margin-top:18px">${pending().length?`${pending().length} 条判断已经有了新结果，还没留下这次复盘。`:'现在没有遗漏的新结果，其余判断会继续观察。'}</p>${pending().length?'<button class="btn small" style="margin-top:24px" data-page="judgments" data-filter="pending">查看已经出的结果'+icon('arrow')+'</button>':''}</div></section></div>`
      + '</details>';
  }

  /** 「我的判断」：列表层只给用户看「正在观察 / 已经出了结果 / 全部」。 */
  function judgments() {
    // 旧数据里 S.filter 可能是 met_now 之类（那时导航上有对应项），收敛到三档
    if(JUDGMENT_FILTERS.indexOf(S.filter)<0) S.filter='all';

    const data=cards();
    const done=data.filter(c=>reflectFor(c.card_id).some(r=>r.asOf<=S.date)).length;
    const percent=data.length?Math.round(done/data.length*100):0;
    const nResults=resultJudgments().length;
    const nWaiting=waitingJudgments().length;
    if((S.filter==='pending'&&!nResults)||(S.filter==='waiting'&&!nWaiting))S.filter='all';

    const stats='<div class="jdg-stats">'
      +'<span><b>'+data.length+'</b> 条判断</span>'
      +'<span><b>'+nWaiting+'</b> 条正在观察</span>'
      +'<span><b>'+percent+'%</b> 留下了复盘</span></div>';

    const tools='<div class="journal-tools">'
      +'<label class="search-field">'+icon('search')+'<input id="journal-search" aria-label="搜索判断" placeholder="搜索标的、判断或理由…" value="'+esc(S.search)+'"></label>'
      +'<select id="journal-asset" aria-label="筛选研究标的" class="btn"><option value="all">全部标的</option>'
      +service.catalog().instruments.map(i=>'<option value="'+i.instrument_id+'" '+(S.journalAsset===i.instrument_id?'selected':'')+'>'+i.symbol+'</option>').join('')
      +'</select><span class="badge">可见边界 '+S.date+'</span></div>';

    const filters='<div class="filters" role="group" aria-label="判断筛选">'
      +[['waiting','正在观察',nWaiting],['pending','已经出了结果',nResults],['all','全部',data.length]].filter(([k,,n])=>k==='all'||n>0)
        .map(([k,l,n])=>'<button class="filter '+(S.filter===k?'active':'')+'" data-filter="'+k+'" aria-pressed="'+(S.filter===k)+'">'+l
          +(n?' <b class="count">'+n+'</b>':'')+'</button>').join('')
      +'</div>';

    return heading('你留下的每一条判断。','写下之后不用盯着；市场有了值得回看的变化，这里会告诉你。','YOUR JUDGMENTS')
      +stats+insightsPanel(data,done,percent)+tools+filters
      +'<section class="panel queue-panel"><div id="journal-results">'+judgmentsTable()+'</div>'
      +'<div class="queue-foot"><span>每个标的展示最近一张判断 · 截至 '+S.date+'</span><span>结果来自行情变化，不等于交易建议</span></div></section>';
  }

  function render() {
    document.documentElement.dataset.theme=S.theme;
    // 离开设置页就把回收站的确认态收掉：下次再进来不该还停在「确认清空」上
    if(S.page!=='settings')S.trashAsk=null;
    write('mydesk.next.prefs',{page:S.page,date:S.date,instrument:S.instrument,chartInterval:S.chartInterval,chartZoom:S.chartZoom,chartOffset:S.chartOffset,chartType:S.chartType,theme:S.theme,maPeriods:S.maPeriods,subIndicators:S.subIndicators});
    let content='';
    if(S.page==='overview')content=heading('<span class="title-part">把判断留下，</span><span class="title-part">让时间回答。</span>','你的独立研究空间。想清楚，记下来，再回来验证。')+onboarding()+`<div class="research-grid">${chartPanel()}${composer()}</div>`+reviewReminder();
    if(S.page==='judgments')content=judgments();
    if(S.page==='settings')content=settings();
    $('#app').innerHTML=sidebar()+`<div class="app-main">${header()}<main id="main" class="main-content">${content}<footer class="footer"><span>${icon('lock')}${storage?'记录仅保存在此浏览器':'当前为内存模式，请及时导出'} · 我的研究空间</span><span>MyDesk Next / 把时间，变成研究的一部分。</span></footer></main></div>`;
    bindChart();
  }
  function renderComposer() { const el=$('.composer');if(el)el.outerHTML=composer(); }

  /* ── AI 转译 ──────────────────────────────────────────────────────────
     把口语化的想法转成更清楚的专业技术面表述。
     模型这一层由 translate.js 负责；这里只管交互与落地：
       转译 → 并排展示（原话 / 转译）→ 用户点「采用」才写进表单。
     原话永远保留在 draft.rawText 里，保存时作为 raw_input 一起入库。 */

  function aiConfigured() {
    if (!T) return false;
    if (T.cfgComplete(T.readConfig(storage))) return true;
    return !!(S.aiServer && S.aiServer.configured);
  }

  function aiSourceLabel(res) {
    if (!res) return '';
    if (res.source === 'ai') return res.via === 'direct' ? 'AI · 浏览器直连' : 'AI · 服务端中转';
    return '规则转译 · 未调用 AI';
  }

  // 名词统一：这一步叫「读一遍」，主体是「它」，界面上不再出现「条件 Agent」——
  // 用户看到的是「有东西把我的原话读懂了」，而不是「一个叫条件的机器在跑」。
  function aiHint() {
    if (!T) return '转译模块未加载';
    if (aiConfigured()) return '';
    return '未配置 LLM';
  }

  /** 引导块上那行标题：按「读过没有」换语气，读完就安静下来，不一直抢眼 */
  function aiCtaTitle(f) {
    if (f.ai && f.ai.busy) return '转译中…';
    if (f.ai && f.ai.result) return '已转译';
    return '读一遍';
  }

  /**
   * 第一次用的提醒：没配 LLM 也能读，但只有规则版。
   * 用户点过「知道了」就收起来（记在本地），但在配好之前不会消失 ——
   * 只提醒一次、之后就装作没事，等于没提醒。
   */
  function aiFirstRun() {
    if (!T || aiConfigured() || S.aiWarnClosed) return '';
    return '<div class="ai-firstrun">' + icon('info')
      + '<div class="ai-firstrun-copy"><b>未配置 LLM</b>'
      + '<span class="tiny muted">当前使用规则转译</span></div>'
      + '<button class="btn small" data-action="ai-open-settings">配置</button>'
      + '<button class="icon-btn" data-action="ai-firstrun-close" aria-label="知道了，先不配置" title="知道了，先不配置">' + icon('close') + '</button></div>';
  }

  function aiPanel(f) {
    const a = f.ai;
    if (!a) return '';
    if (a.busy) {
      return '<div class="ai-panel"><div class="ai-loading">' + icon('clock') 
        + ' 转译中…</div></div>';
    }
    if (a.error && !a.result) {
      return '<div class="ai-panel"><div class="ai-warn">' + icon('info') + ' ' + esc(a.error) + '</div>'
        + '<div class="row" style="gap:8px;margin-top:10px">'
        + '<button class="btn small" data-action="ai-translate">重试</button>'
        + '<button class="btn small ghost" data-action="ai-discard">关掉</button></div></div>';
    }
    const r = a.result;
    if (!r) return '';
    return '<div class="ai-panel">'
      + '<div class="ai-pair">'
      +   '<div class="ai-side"><div class="ai-label">' + icon('pen') + ' 你的原话</div><p>' + esc(f.rawText || f.text) + '</p></div>'
      +   '<div class="ai-side ai-side-out"><div class="ai-label">' + icon('spark') + ' 转译后的专业表述'
      +     '<span class="ai-tag">' + esc(aiSourceLabel(r)) + '</span></div><p>' + esc(r.professional) + '</p></div>'
      + '</div>'
      + (a.adopted
          ? '<div class="row ai-actions"><span class="tiny muted ai-done">' + icon('check')
            + ' 已采用</span>'
            + '<button class="btn small ghost" data-action="ai-revert">恢复原话</button></div>'
          : '<div class="row ai-actions">'
            + '<button class="btn small primary" data-action="ai-adopt">采用</button>'
            + '<button class="btn small ghost" data-action="ai-discard">保留原话</button></div>')
      + '</div>';
  }

  /* ══ 多想一步 · 说清楚 ═══════════════════════════════════════════════════
     和上面的转译是两次独立调用：并行、互不阻塞、各自失败。结果放在草稿的 f.plain，
     不挂在 f.ai 下面（转译返回时会整个替换 f.ai，挂在下面会被冲掉）。
     模型不写数字：它只挑读法和参数，所有数字由 translate.js 按冻结快照算；这里只管
     拼证据、渲染、落地。规格：《01 多想一步 · Schema v2.2》§2、§4、§6，《02 多想一步 · LLM 约束 v2.4》。 */
  const PS_MAX_READINGS = 4;
  const PS_SLOPE_TEXT = {up:'上行', flat:'走平', down:'下行'};
  const PS_BAND_SHARE = {small:'其中一半', mid:'一倍', large:'两倍'};
  const PS_SIDE_MAX = 20;                                     // = 引擎 TECH_SIDE_MAX：同侧天数最多数到 20，数满了就是「20 天以上」
  const psSideText = n => !E.isNum(n) ? '—' : n === 0 ? '正好压线'
    : (n > 0 ? '上方 ' : '下方 ') + Math.abs(n) + ' 天' + (Math.abs(n) >= PS_SIDE_MAX ? '以上' : '');
  const psSinceText = n => !E.isNum(n) ? '—' : (n === 0 ? '就是今天' : `${n} 天前`);
  const psReason = code => (E.REASON_LABELS && E.REASON_LABELS[code]) || '数据不可用';
  const psReady = () => !!(T && T.plainSpeak && T.rulePlainSpeak && T.PS_VERSION);

  /** AI 看的是你屏幕上显示的东西：5 / 10 天均线只有在图上勾了才进；20 天那组永远在。 */
  const psVisibleMas = () => [5,10].filter(n => S.maPeriods.includes(n)).concat(20);
  /**
   * 立场：界面上已经没有手选立场了，所以它**永远是从原话读出来的** ——
   * 「读一遍」给出过就从它那儿拿（stanceTouched），否则用同步规则从原话推看多 / 看跌。
   * 不推的话「我觉得会涨」会被当成「等条件」，异议的方向整个反过来。
   */
  function psStance(f, text) {
    let rule = null;
    try { rule = T && T.ruleTranslate ? T.ruleTranslate({text}).stance : null; } catch (_) { rule = null; }
    if (!f.stanceTouched && f.stance === 'wait_condition' && (rule === 'bullish' || rule === 'bearish')) return {stance:rule, source:'rule'};
    return {stance:f.stance, source:'form'};
  }
  /** 除数据本身以外、决定结果的全部输入：原话、立场、周期、显示的均线 */
  function psParts(f, text) {
    const t = String(text || '').trim();
    const hz = E.parseHorizonText ? E.parseHorizonText(t) : null;
    const st = psStance(f, t);
    return {text:t, horizon:hz, stance:st.stance, stance_source:st.source, mas:psVisibleMas()};
  }
  /** 缓存键。数据用「标的 + 日期 + 数据版本」标识，不用 context_id：刷新页面后会重新冻结出新 id，但数据没变。
      新判断不再维护独立条件表，所以只跟原话、立场、周期、显示的均线一起变化。 */
  function psKeyOf(data, p) {
    return [T.PS_VERSION, data.instrument_id, data.bar_date, data.data_revision, p.stance, p.text, p.horizon ? p.horizon.days : '',
      p.mas.join(',')].join('|');
  }
  const psDataOf = ctx => ({instrument_id:ctx.instrument.instrument_id, bar_date:ctx.snapshot.bar_date, data_revision:ctx.snapshot.data_revision});
  /** 此刻的数据标识：已经冻结过就用冻结的那份（保存时用的也是它）；还没冻结就用视图里同一份行情，不在渲染时去冻结 */
  function psDataNow() {
    const d = S.memoryDrafts.get(draftKey());
    if (d) return psDataOf(d.ctx);
    const r = row();
    return r && r.quote ? {instrument_id:r.instrument.instrument_id, bar_date:r.quote.bar_date, data_revision:r.quote.data_revision} : null;
  }
  /** 「说清楚」此刻该翻译哪段话：判断框没动过、或者是刚采用的专业表述 → 仍是上次那段原话；否则就是判断框里的新文字 */
  function psSourceNow(f) {
    const box = String(f.text || '').trim(), p = f.plain;
    const adopted = f.ai && f.ai.adopted && f.ai.result ? String(f.ai.result.professional || '').trim() : null;
    if (adopted !== null && box === adopted && f.rawText) return String(f.rawText).trim();
    if (p && typeof p.text === 'string' && box === p.box) return p.text;
    return box;
  }
  function psCurrentKey(f) { const data = psDataNow(); return data && psReady() ? psKeyOf(data, psParts(f, psSourceNow(f))) : null; }
  /** 过期 = 现算的键和生成时的不一致：改了原话、立场、显示的均线，或者数据更新了 */
  const psIsStale = f => !!(f.plain && f.plain.key && !f.plain.busy && psCurrentKey(f) !== f.plain.key);

  /** 证据表（01 §4.1）：冻结快照是唯一数据源。value 只给代码算数；text 发给模型，也用在界面的数值标签上 */
  function psEvidence(ctx, f, mas) {
    const snap = ctx.snapshot || {}, m = snap.metrics || {}, me = snap.metric_errors || {};
    const tech = snap.technical || null, te = (tech && tech.errors) || {}, rows = [];
    const num = v => E.isNum(v) ? v : null;
    const add = (id, label, value, text, code) => rows.push(value == null || text == null
      ? {id, label, status:'unavailable', value:null, text:null, reason:psReason(code)}
      : {id, label, status:'ok', value, text});
    const close = num(snap.close_price);
    add('close', '收盘价', close, close == null ? null : E.fmtPrice(close), 'no_data_at_cutoff');
    ['chg_1d','chg_5d','chg_20d'].forEach(k => { const v = num(m[k]); add(k, E.METRIC_LABELS[k], v, v == null ? null : E.fmtPct(v), me[k]); });
    const vol = num(m.vol_20d);
    add('vol_20d', E.METRIC_LABELS.vol_20d, vol, vol == null ? null : E.fmtPct(vol).replace(/^\+/, ''), me.vol_20d);   // fmtPct 会给正数加「+」，波动率不要
    const s1 = vol == null ? null : vol / Math.sqrt(E.POLICY.annualization_days);                                       // 引擎口径：自然日、年化 365
    add('sigma_1d', '单日正常波动', s1, s1 == null ? null : '±' + s1.toFixed(1) + '%', me.vol_20d);
    [20].concat(mas.filter(n => n !== 20)).forEach(n => {
      const b = tech && tech.ma ? tech.ma[n] : null, why = tech ? te['ma' + n] : 'not_requested';
      add('ma' + n, n + '天均线', b ? b.value : null, b ? E.fmtPrice(b.value) : null, why);
      const gap = n === 20 ? num(m.ma20_gap) : (b ? num(b.gap_pct) : null);                                        // 20 天用系统指标本身，同一个数
      add('ma' + n + '_gap', '相对' + n + '天均线偏离', gap, gap == null ? null : E.fmtPct(gap), n === 20 ? me.ma20_gap : why);
      add('ma' + n + '_slope', n + '天均线方向', b && b.slope ? b.slope : null, b && b.slope ? PS_SLOPE_TEXT[b.slope] : null, b ? te['ma' + n + '_slope'] : why);
      add('ma' + n + '_side', '在' + n + '天均线哪一侧', b && E.isNum(b.side_days) ? b.side_days : null, b && E.isNum(b.side_days) ? psSideText(b.side_days) : null, why);
    });
    const low = tech ? num(tech.low_20d) : null, since = tech ? num(tech.days_since_low) : null;
    add('low_20d', '近20天最低收盘', low, low == null ? null : E.fmtPrice(low), tech ? te.low_20d : 'not_requested');
    add('since_low', '距近20天最低收盘', since, since == null ? null : psSinceText(since), tech ? te.low_20d : 'not_requested');
    return rows;
  }
  function psInput(ctx, f, p) {
    return {
      text:p.text, stance:p.stance, stance_source:p.stance_source,
      horizon_days:p.horizon ? p.horizon.days : null, horizon_quote:p.horizon ? p.horizon.quote : null,
      as_of:ctx.snapshot.bar_date, evidence:psEvidence(ctx, f, p.mas), visible_mas:p.mas.slice(),
      data_mode:S.live && S.live.mode === 'live' ? 'live' : 'synthetic',
      verdict_enabled:typeof E.verdictOf === 'function',       // 《03 市场裁决》上线前为假：目标价不承诺「到期自动核对」
    };
  }
  /** 渲染要用的最小一份：数值标签只留可用的行 */
  function psMeta(input) {
    const ev = {};
    input.evidence.forEach(r => { if (r.status === 'ok') ev[r.id] = [r.label, r.text]; });
    return {as_of:input.as_of, stance_source:input.stance_source, horizon_days:input.horizon_days, horizon_quote:input.horizon_quote,
      mas:input.visible_mas, data_mode:input.data_mode, ev};
  }
  /** 存进草稿前去掉校验日志：被删的原文可能正好是「可以考虑逢低加仓」，不给用户看，只进控制台（02 §8.8） */
  function psStore(res) {
    const r = res && typeof res === 'object' ? res : T.rulePlainSpeak({}, '没有返回结果');
    const {log, ...rest} = r;
    if (r.source === 'ai' && Array.isArray(log) && log.length) console.info('[说清楚] 校验记录', log);
    return rest;
  }

  /** 传进来的是用户原话（f.rawText），不是判断框当前文字：采用转译后判断框会被换掉，但读法翻译的是他自己的话 */
  function runPlainSpeak(text) {
    if (!psReady()) return;
    const dk = draftKey(), f = form(), src = String(text || '').trim();
    if (!src) return;                                                   // 判断框为空时不运行
    const base = {text:src, box:String(f.text || '').trim()};
    if (S.chartInterval !== '1D') {                                     // 02 §2.3：非日线时，图上的均线和系统算的不是同一条线
      f.plain = {...base, disabled:'interval', interval:S.chartInterval};
      persistDraft(); renderComposer(); return;
    }
    const c = contextQuiet();
    if (!c.ok) { f.plain = {...base, disabled:'no_context', reason:(c.error && c.error.message) || ''}; persistDraft(); renderComposer(); return; }
    const p = psParts(f, src), input = psInput(c.d.ctx, f, p), key = psKeyOf(psDataOf(c.d.ctx), p), meta = psMeta(input);
    if (f.plain && f.plain.busy && f.plain.key === key) return;        // 同一个请求还在路上
    if (S.psCache.has(key)) { f.plain = {...base, key, meta, result:S.psCache.get(key)}; persistDraft(); renderComposer(); return; }
    f.plain = {...base, key, meta, busy:true};
    renderComposer();
    const done = res => {
      const out = psStore(res);
      if (out.source === 'ai') S.psCache.set(key, out);                 // 只缓存 AI 的结果：规则版可能只是这次没连上，下次还该再试
      const f2 = S.drafts[dk];
      if (!f2 || !f2.plain || f2.plain.key !== key || !f2.plain.busy) return;   // 期间重新生成过、或草稿已保存，丢弃
      f2.plain = {...f2.plain, busy:false, result:out};
      persistDraft();
      if (dk === draftKey()) renderComposer();
    };
    Promise.resolve(T.plainSpeak(input, {storage:storage})).then(done)
      .catch(e => done(T.rulePlainSpeak(input, (e && e.message) || '说清楚出错')));
  }

  const psSig = r => r.kind + '|' + JSON.stringify(Object.keys(r.params || {}).sort().map(k => [k, r.params[k]]));
  const psIsKept = (f, r) => (f.readings || []).some(x => psSig(x) === psSig(r));
  const psFind = (f, id) => (f.plain && f.plain.result && f.plain.result.readings || []).find(r => r.id === id) || null;
  /** 一条读法的整句（纯文本 + 带加粗的 HTML）。纯文本原样存进卡片，以后不依赖这里的渲染代码（01 §6.4） */
  function psView(r) {
    const c = r.computed || {}, p = r.params || {}, q = '「' + r.quote + '」';
    let parts = [], line2 = '';

      parts = [[q + '≈ ' + (p.dir === 'down' ? '跌' : '涨') + ' '], [Number(c.pct).toFixed(1) + '%', 1], ['（约 '], [E.fmtPrice(c.price), 1], ['）']];
      line2 = c.h + ' 天正常波动 ±' + Number(c.sigma_h).toFixed(1) + '%，取' + (PS_BAND_SHARE[p.band] || '');
    } else if (r.kind === 'close_vs_ma') {
      const where = [c.ma + '天均线（' + E.fmtPrice(c.ma_value) + '）', 1], side = [p.side === 'below' ? '下方' : '上方'];
      parts = c.days > 1 ? [[q + '= 连续 '], [String(c.days), 1], [' 天收盘在 '], where, side] : [[q + '= 收盘在 '], where, side];
      line2 = '现在：' + psSideText(c.side_now) + (c.satisfied_now ? '（已满足）' : '');
    } else if (r.kind === 'no_new_low') {
      parts = [[q + '= '], [String(c.days), 1], [' 天内不再跌破 '], [E.fmtPrice(c.low), 1], ['（近20天最低收盘，' + psSinceText(c.since_low) + '）']];
    } else if (r.kind === 'ma_turn') {
      const to = p.to === 'up' ? '向上' : '走平或向上';
      parts = [[q + '= '], [c.ma + '天均线', 1], [c.slope_now === 'down' ? '由下行转为' + to : '保持' + to]];
      const ok = p.to === 'up' ? c.slope_now === 'up' : (c.slope_now === 'up' || c.slope_now === 'flat');
      line2 = '现在：' + (PS_SLOPE_TEXT[c.slope_now] || '—') + (ok ? '（已满足）' : '');

      parts = [[q]];
    }

  }
  function psKeep(id, quiet) {
    const f = form(), r = psFind(f, id);
    if (!r || psIsStale(f)) return false;
    if (!Array.isArray(f.readings)) f.readings = [];
    if (psIsKept(f, r)) return true;
    if (f.readings.length >= PS_MAX_READINGS) { toast('最多记 ' + PS_MAX_READINGS + ' 条', '一张卡最多存 ' + PS_MAX_READINGS + ' 条读法，先去掉一条再记。', true); return false; }
    f.readings.push({quote:r.quote, kind:r.kind, params:{...r.params}, text:psView(r).text,
      computed:{...r.computed}, target:r.target ? {...r.target} : null, adopted_at:new Date().toISOString()});
    persistDraft();
    if (!quiet) renderComposer();
    return true;
  }
  function psUnkeep(i) {
    const f = form();

  }
  /** 用「此刻该翻译的那段话」跑一次。判断框里是新写的话，它就是新的原话（和 runTranslate 同一口径） */
  function psRun(f) {
    const src = psSourceNow(f);
    if (!src) { toast('先写下你的想法', '判断框是空的，没有可以说清楚的话。'); return; }
    if (!f.plain || src !== f.plain.text) f.rawText = src;
    runPlainSpeak(src);
  }
  function psRegen() {
    const f = form();
    [f.plain && f.plain.key, psCurrentKey(f)].forEach(k => { if (k) S.psCache.delete(k); });
    psRun(f);
  }
  /** 保存前先多想一步：这段判断还没让「说清楚」看过，或者看过之后又改了。
      用不了的情况（非日线、该时点冻结不了、模块没加载）不拦，照常保存 */
  function psWillGate(f) {
    if (!psReady() || S.chartInterval !== '1D') return false;
    const p = f.plain;
    if (p && p.disabled === 'no_context') return false;
    if (p && p.busy) return true;
    return !(p && p.result && !psIsStale(f));
  }
  const psSaveLabel = f => psWillGate(f) ? icon('spark') + '多想一步' : icon('plus') + '保存判断与快照';
  /** 点保存时：该多想一步就只去跑（从没转译过就连转译一起跑），这次不存；看完再点一次才存 */
  function psGate(f) {
    if (!psWillGate(f)) return false;
    if (f.plain && f.plain.busy) { toast('还在分析', '可直接保存'); return true; }
    if (!f.ai) runTranslate(); else psRun(f);
    toast('看完再点保存', '');
    return true;
  }
  /** 打字或切换均线时只重画这一块（不碰输入框，光标不丢），让「已过期」即时出现或消失 */
  function psRefresh() {
    const el = $('.ps-block'), f = form(), btn = $('.save-btn'), gate = psWillGate(f) ? '1' : '0';
    if (btn && btn.dataset.gate !== gate) { btn.dataset.gate = gate; btn.innerHTML = psSaveLabel(f) + '<kbd>Ctrl ↵</kbd>'; }
    if (!el || !f.plain || f.plain.busy || !f.plain.result) return;
    if (el.classList.contains('is-stale') === psIsStale(f)) return;
    el.outerHTML = psBlock(f);
  }

  /* 界面：结构和文案见 LLM 约束 v2.4 §4、§7。类名一律 ps-*。 */
  function psBlock(f) {
    if (!psReady()) return '';
    const p = f.plain, kept = Array.isArray(f.readings) ? f.readings : [];
    if (!p && !kept.length) return '';
    const stale = !!(p && p.result && !p.busy && psIsStale(f));
    let body = '';
    if (p && p.busy) body = '<div class="ps-loading">' + icon('clock') + ' 分析中…<button class="text-btn" data-action="save-now">直接保存</button></div>';
    else if (p && p.disabled === 'interval') {
      body = '<div class="ps-off" title="' + esc((chartIntervalHints[p.interval] || p.interval) + '的均线按 K 线根数计算，和日线口径不同') + '">仅日线可用'
        + (S.chartInterval === '1D' ? '<button class="text-btn" data-action="ps-regen">已切回日线，重新生成</button>' : '') + '</div>';
    } else if (p && p.disabled === 'no_context') {
      body = '<div class="ps-off" title="' + esc(p.reason || '') + '">该日没有日线'
        + '<button class="text-btn" data-action="ps-regen">重新生成</button></div>';
    }
    // 已记下的读法紧跟在读法后面；没有结果（分析中 / 用不了）时也照样列出来
    body = p && p.result && !p.busy && !p.disabled ? psResult(f, p, stale, psKeptList(kept)) : body + psKeptList(kept);
    return '<section class="ps-block' + (stale ? ' is-stale' : '') + '" aria-label="说清楚">'
      + '<div class="ps-head"><div class="ps-title">' + icon('spark') + ' 说清楚<span>· 非投资建议</span></div></div>'
      + body + '</section>';
  }
  function psResult(f, p, stale, keptHtml) {
    const r = p.result, m = p.meta || {}, ev = m.ev || {};
    const src = psStance(f, p.text).source;
    const hz = r.horizon_used || 5;
    const stanceText = (E.STANCE_LABELS[r.stance_used] || r.stance_used || '') + (src === 'rule' ? '（推断）' : '');
    const horizonText = m.horizon_days != null ? hz + ' 天（「' + (m.horizon_quote || '') + '」）' : '按 ' + hz + ' 天';
    const metaLine = (m.as_of || '—') + ' 收盘 · ' + stanceText + ' · ' + horizonText;
    const chips = ids => '<div class="ps-chips">' + (ids || []).filter(id => ev[id]).map(id => '<span class="ps-chip">' + esc(ev[id][0]) + ' <b>' + esc(ev[id][1]) + '</b></span>').join('') + '</div>';
    const readings = (r.readings || []).length
      ? r.readings.map(x => psReadingHtml(f, x, stale)).join('')
      : '<p class="ps-empty">你这段话已经说得挺具体了，没有需要翻译的地方。</p>';
    const objections = (r.objections || []).length
      ? r.objections.map(o => '<div class="ps-objection"><p>' + esc(o.point) + '</p>' + chips(o.cites) + '</div>').join('')
      : '<p class="ps-empty" title="本次没有读取新闻和基本面">技术面没看到冲突</p>'
        + (r.vol_hint ? '<div class="ps-vol"><p>最近一天的涨跌还在这只票的单日正常波动以内。</p>' + chips(r.vol_hint.cites) + '</div>' : '');
    const others = (m.mas || []).filter(n => n !== 20);
    // 这四行和系统的实际能力是绑死的：以后改数据源、改图表指标，必须同步改这里（02 §11）
    const blind = [
      '只用截至 ' + (m.as_of || '—') + ' 的日线：涨跌、20天均线' + (others.length ? '、' + others.join('/') + '天均线' : '') + '、近20天最低、波动率',
      'MACD、KDJ、RSI、成交量本次不参与换算',
      '本次不看新闻、财报、公告、资金',
      m.data_mode === 'live' ? '价格：Bitget 代币化股票，非美股原股' : '合成演示数据，非真实行情',

    const foot = [r.source === 'ai' ? 'AI' + (r.model ? ' · ' + r.model : '') : '规则生成 · ' + ruleReason];
    if (r.struck_count > 0) foot.push('删掉 ' + r.struck_count + ' 条');
    if (r.notice) foot.push(r.notice);

      + (stale ? '<div class="ps-stale" title="判断、立场、显示的均线或数据已经变化"><span>已过期</span><button class="text-btn" data-action="ps-regen">重新生成</button></div>' : '')
      + '<div class="ps-section ps-readings">' + readings + '</div>' + (keptHtml || '')
      + '<div class="ps-section ps-objections"><h4>可能不成立</h4>' + objections + '</div>'
      + '<div class="ps-fixed"><h4>本次未读取</h4><ul>' + blind.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul></div>'

  function psReadingHtml(f, x, stale) {
    const v = psView(x), kept = psIsKept(f, x);

  function runTranslate() {
    if (!T) { toast('转译模块未加载', '页面构建不完整，请重新构建。', true); return; }
    const f = form();
    const text = String(f.text || '').trim();
    if (!text) { toast('先写下你的想法', '口语化也行，比如「我想等回踩买入」。'); return; }
    // 原话要不要更新：只有当输入框里是「用户自己写的内容」时才更新。
    // 如果里面已经是上一次转译的输出（用户刚点过采用、还没动手改），就保持原话不变，
    // 否则连点两次转译会把原话覆盖成转译结果本身。
    const lastOut = (f.ai && f.ai.adopted && f.ai.result) ? String(f.ai.result.professional || '') : '';
    if (!f.rawText || f.text !== lastOut) f.rawText = text;
    f.ai = { busy: true, result: null, error: '' };
    renderComposer();
    const dk = draftKey();

    const input = { text: text };

    Promise.resolve(T.translate(input, { storage: storage })).then((res) => {
      const f2 = S.drafts[dk];
      if (!f2) return;
      if (!res || !res.ok) {
        f2.ai = { busy: false, result: null, error: (res && res.error) || '转译失败' };
        if (dk === draftKey()) renderComposer();
        return;
      }
      f2.ai = { busy: false, result: res, error: '', adopted: false };
      if (dk === draftKey()) renderComposer();
      if (res.source === 'rule' && !res.needsSetup && res.fallbackReason) {
        console.info('[转译] AI 出错，已用规则：', res.fallbackReason);
        toast('AI 出错，已用规则', '');
      }
    }).catch((e) => {
      const f2 = S.drafts[dk];
      if (!f2) return;
      f2.ai = { busy: false, result: null, error: (e && e.message) || '转译失败' };
      if (dk === draftKey()) renderComposer();
    });
    // 「说清楚」和转译并行、互不阻塞。传用户原话：采用转译后判断框会被换掉，但要翻译的是他自己的话
    runPlainSpeak(f.rawText || text);
  }

  function adoptTranslation() {
    const f = form();
    const a = f.ai;
    if (!a || !a.result) return;
    const r = a.result;
    f.text = String(r.professional || '').trim();
    if (T && T.STANCES.indexOf(r.stance) >= 0) { f.stance = r.stance; f.stanceTouched = true; }
    f.conditions = [];
    a.adopted = true;
    persistDraft();
    renderComposer();
  }

  function discardTranslation() {

  }

  function saveAiConfig() {

  function revertTranslation() {
    const f = form();
