      return result.err('MODEL_UNAVAILABLE_MANUAL_REQUIRED', '模型两次输出均未通过校验，已回退到手动表单。' + (lastErr || ''), true);
    }

    // ── confirm_card（原子保存；不再取行情） ───────────────────────────
    function confirmCard(req) {
      const ctx = state.contexts[req.context_id];
      if (!ctx) return result.err('CONTEXT_NOT_FOUND', '冻结上下文不存在，请重新起草', true);
      if (req.conditions_confirmed !== true) return result.err('INVALID_INPUT', '用户未明确确认表单', false);
      const chartInterval = req.chart_interval == null ? '1D' : req.chart_interval;
      if (!CHART_INTERVALS.includes(chartInterval)) return result.err('INVALID_INPUT', '图表周期只支持 1H、4H 或 1D', false);

      const wsId = ctx.workspace_id;
      const idemKey = KEY.idem + wsId;
      const idem = readJSON(idemKey, {});
      const payloadShape = JSON.stringify({
        context_id: req.context_id, raw_input: req.raw_input,
        judgment_text: req.judgment_text, stance: req.stance,
        chart_interval: chartInterval,
        conditions: (req.conditions || []).map((c) => [c.metric, c.operator, c.threshold, c.threshold_origin, cleanRole(c.role)]),
        readings: (Array.isArray(req.precise_readings) ? req.precise_readings : []).map((r) => [r && r.kind, r && r.text]),
      });
      if (!req.idempotency_key || typeof req.idempotency_key !== 'string') return result.err('INVALID_INPUT', '保存请求缺少幂等标识', false);
      const alreadySaved = getCards(wsId).find(c => c.idempotency_key === req.idempotency_key);
      if (alreadySaved) {
        if (alreadySaved.idempotency_shape !== payloadShape) return result.err('INVALID_INPUT', '重复保存请求内容不一致', false);
        return result.ok(alreadySaved);
      }
      if (idem[req.idempotency_key]) {
        if (idem[req.idempotency_key].shape !== payloadShape) {
          logEvent('guard', '幂等拒绝：同一 idempotency_key 携带了不同 payload', req.idempotency_key);
          return fail('INVALID_INPUT', '同一 idempotency_key 提交了不同内容，已拒绝', false, '拒绝异体幂等请求');
        }
        const existing = getCards(wsId).filter((c) => c.card_id === idem[req.idempotency_key].card_id)[0];
        if (existing) {
          logEvent('guard', '幂等命中：重复确认未新增卡片', 'key=' + req.idempotency_key + ' → ' + existing.card_id + '（当前共 ' + getCards(wsId).length + ' 张卡）');
          return result.ok(existing);
        }
      }
      if (!req.judgment_text || !req.judgment_text.trim()) return fail('INVALID_INPUT', '判断文字不能为空', false);
      if (!STANCES.includes(req.stance)) return result.err('INVALID_INPUT', '判断方向无效', false);
      if ((req.conditions || []).length > POLICY.max_conditions) return result.err('INVALID_INPUT', '条件不能超过 ' + POLICY.max_conditions + ' 条', false);
      const bad = (req.conditions || []).filter((c) =>
        !isNum(c.threshold) || VISIBLE_METRIC_KEYS.indexOf(c.metric) < 0 ||
        ctx.snapshot.metrics[c.metric] == null || ['lt', 'gt'].indexOf(c.operator) < 0);
      if (bad.length) return fail('INVALID_INPUT', '条件与冻结上下文不匹配：' + bad.map((c) => c.metric).join('、'), false, '拒绝与冻结上下文不匹配的条件');

      const draftRec = req.draft_id ? state.drafts[req.draft_id] : null;
      if (req.draft_id && !draftRec) return result.err('DRAFT_CONTEXT_MISMATCH', '草稿不存在或不属于该上下文', false);
      if (draftRec && draftRec.context_id !== ctx.context_id) return result.err('DRAFT_CONTEXT_MISMATCH', '草稿与上下文不匹配', false);

      const isManual = !draftRec;
      const textEdited = draftRec ? draftRec.draft.judgment_text !== req.judgment_text : false;
      const structEdited = draftRec ? JSON.stringify({
        stance: draftRec.draft.stance,
        conditions: draftRec.draft.conditions.map((c) => [c.metric, c.operator, c.threshold]),
        notes: draftRec.draft.unsupported_notes,
      }) !== JSON.stringify({
        stance: req.stance,
        conditions: (req.conditions || []).map((c) => [c.metric, c.operator, c.threshold]),
        notes: req.unsupported_notes,
      }) : false;

      // 00 §7.3：周期优先用研究设置；设置里没有（现有软件里永远没有）就从用户原话读。
      // 必须先看 raw_input —— judgment_text 可能已经被采用成 AI 的专业表述，
      // 而周期是预先登记的一部分，必须来自用户自己的话。
      const fromText = parseHorizonText(req.raw_input || req.judgment_text);
      const hz = ctx.horizon_days != null
        ? { days: ctx.horizon_days, origin: 'setup', quote: null }
        : (fromText
          ? { days: fromText.days, origin: 'text', quote: fromText.quote }
          : { days: null, origin: null, quote: null });

      const card = {
        schema_version: CARD_SCHEMA_VERSION,
        workspace_id: wsId,
        card_id: makeUid('card'),
        batch_id: makeUid('batch'),
        instrument: ctx.instrument,
        context_id: ctx.context_id,
        created_at: now(),
        idempotency_key: req.idempotency_key,
        idempotency_shape: payloadShape,
        analysis_as_of: ctx.analysis_as_of,
        is_replay: true,                          // 来源标记：当时是 historical
        raw_input: req.raw_input || (draftRec ? draftRec.raw_input : ''),
        judgment_text: req.judgment_text,
        stance: req.stance,
        chart_interval: chartInterval,
        condition_interval: POLICY.decision_interval,
        entry_source: isManual ? 'manual' : 'ai_confirmed',
        user_edited: isManual ? false : textEdited,
        structured_fields_edited: isManual ? false : structEdited,
        focus_metrics_at_creation: ctx.focus_metrics.slice(),
        horizon_days_at_creation: hz.days,
        horizon_origin: hz.origin,
        horizon_quote: hz.quote,
        snapshot: JSON.parse(JSON.stringify(ctx.snapshot)),
        conditions: (req.conditions || []).map((c) => ({
          condition_id: makeUid('cond'),
          text: c.text || buildRuleDesc(c.metric, c.operator, c.threshold),
          metric: c.metric, operator: c.operator, threshold: c.threshold,
          threshold_origin: c.threshold_origin || (isManual ? 'user_explicit' : 'user_edited'),
          quote: cleanQuote(c.quote),
          role: cleanRole(c.role),
          role_origin: cleanRoleOrigin(cleanRole(c.role), c.role_origin),
          confirmed_at: now(),
          user_state: { state: 'active', changed_at: now() },
        })),
        unsupported_notes: req.unsupported_notes || [],
      };
      const preciseReadings = cleanReadings(req.precise_readings);
      if (preciseReadings.length) card.precise_readings = preciseReadings;

      const cards = getCards(wsId);
      cards.push(card);
      const okWrite = saveCards(wsId, cards);
      if (!okWrite) return fail('STORAGE_ERROR', '写盘失败，表单内容请先保留', true);
      idem[req.idempotency_key] = { card_id: card.card_id, shape: payloadShape };
      writeJSON(idemKey, idem);

      const t0Met = card.conditions.filter((c) => truthOf(card.snapshot.metrics[c.metric], c) === 'met');
      logEvent('service', 'confirm_card(' + card.instrument.symbol + ')',
        card.card_id + ' · created_at=' + card.created_at + ' · T0=' + card.snapshot.bar_date +
        ' · 条件 ' + card.conditions.length + ' 条' + (t0Met.length ? ' · 其中 ' + t0Met.length + ' 条在保存时已成立' : '') +
        ' · 未重新取行情');
      return result.ok(card);
    }

    // ── 复核：逐日扫描 ────────────────────────────────────────────────
    // truthOf / distanceOf 已提到模块顶层（6b 节），这里直接用。

    function evaluateCondition(card, cond, cache, cutoffAt, currentBarDate) {
      const byDate = cache._byDate;
      const base = card.snapshot.metrics[cond.metric];
      const baseline_state = truthOf(base, cond);
      const current = computeMetricsAt(byDate, cache, currentBarDate);
      const current_value = current.metrics[cond.metric];
      const current_state = truthOf(current_value, cond);

      const t0 = card.snapshot.bar_date;
      const scanDates = currentBarDate && dayDiff(t0, currentBarDate) > 0 ? eachDay(addDays(t0, 1), currentBarDate) : [];
      const unknown_dates = [];
      const daily_states = [];   // 演示扩展：从同一份扫描派生的逐日真值，仅供界面画时间轴，不参与任何判定
      let first_observed = null;
      let metCount = 0;
      scanDates.forEach((d) => {
        const v = computeMetricsAt(byDate, cache, d).metrics[cond.metric];
        const st = truthOf(v, cond);
        daily_states.push({ date: d, state: st, value: v == null ? null : v });
        if (st === 'unknown') { unknown_dates.push(d); return; }
        // 基线真值不算区间内首次日期
        if (st === 'met') { metCount++; if (!first_observed) first_observed = d; }
      });
      const history_complete = unknown_dates.length === 0 && baseline_state !== 'unknown';

      // 分类顺序：met_now → unknown（当前无可用值）→ met_before → waiting
      // 注：met_before 要求“当前明确不成立”；当前未知时只能说数据不足以确认，
      //     但区间内曾观测到的成立日期仍会通过 first_observed_met_on 展示出来。
      let display_status;
      if (current_state === 'met') display_status = 'met_now';
      else if (current_state === 'unknown') display_status = 'unknown';
      else if (baseline_state === 'met' || metCount > 0) display_status = 'met_before';
      else if (baseline_state === 'not_met' && unknown_dates.length === 0) display_status = 'waiting';
      else display_status = 'unknown';

      return {
        condition_id: cond.condition_id,
        rule_desc: buildRuleDesc(cond.metric, cond.operator, cond.threshold),
        baseline_state: baseline_state,
        baseline_value: base == null ? null : base,
        current_state: current_state,
        current_value: current_value == null ? null : current_value,
        current_error: current_value == null ? (current.metric_errors[cond.metric] || 'unknown') : null,
        first_observed_met_on: first_observed,
        first_met_on: history_complete ? first_observed : null,
        display_status: display_status,
        distance_pp: current_state === 'met' ? 0 : distanceOf(current_value, cond),
        scan: {
          from_date: scanDates.length ? scanDates[0] : null,
          to_date: scanDates.length ? scanDates[scanDates.length - 1] : null,
          expected_days: scanDates.length,
          evaluated_days: scanDates.length - unknown_dates.length,
          unknown_dates: unknown_dates,
          history_complete: history_complete,
          daily_states: daily_states,
        },
      };
    }

    function reviewCards(input) {
      const v = getView(input.view_id);
      if (!v) return result.err('VIEW_NOT_FOUND', '视图不存在或已失效，请重新打开工作台', true);
      const wsId = v.view.workspace.workspace_id;
      const cutoffDate = msToLocalDate(utcMs(v.cutoffAt) - DAY_MS);
      const all = getCards(wsId);

      let selected;
      if (input.card_ids && input.card_ids.length) {
        selected = [];
        for (const id of input.card_ids) {
          const c = all.filter((x) => x.card_id === id)[0];
          if (!c) return result.err('INVALID_INPUT', '卡片不存在：' + id, false);
          if (dayDiff(c.snapshot.bar_date, cutoffDate) < 0) {
            return fail('FUTURE_CARD', '该卡的研究时点 ' + c.snapshot.bar_date + ' 晚于本次可见边界 ' + cutoffDate, false, '拒绝未来卡');
          }
          selected.push(c);
        }
      } else {
        // 每个产品选一张：snapshot.bar_date 降序 → created_at 降序 → card_id 降序；只取 T0<=cutoff 的卡
        const byInstrument = {};
        all.filter((c) => dayDiff(c.snapshot.bar_date, cutoffDate) >= 0).forEach((c) => {
          const k = c.instrument.instrument_id;
          if (!byInstrument[k]) byInstrument[k] = [];
          byInstrument[k].push(c);
        });
        selected = [];
        // 默认范围：本次设置里的产品 + 已有研究卡的产品（含已从自选删掉的）
        const watch = {};
        v.view.setup.symbols.forEach((s) => (watch[s.instrument_id] = true));
        Object.keys(byInstrument).forEach((k) => (watch[k] = true));
        Object.keys(watch).forEach((k) => {
          const list = byInstrument[k];
          if (!list) return;
          list.sort((a, b) =>
            (dayDiff(a.snapshot.bar_date, b.snapshot.bar_date)) ||
            (a.created_at < b.created_at ? 1 : a.created_at > b.created_at ? -1 : 0) ||
            (a.card_id < b.card_id ? 1 : -1));
          selected.push(list[0]);
        });
        selected.sort((a, b) => a.instrument.instrument_id < b.instrument.instrument_id ? -1 : 1);
      }

      const comparisons = selected.map((card) => {
        const pi = v.perInstrument[card.instrument.instrument_id];
        const cache = cacheById[card.instrument.instrument_id];
        const warnings = [];
        let current;
        if (!cache) {
          current = null;
        } else {
          current = buildQuote(wsId, card.instrument, cache, v.cutoffAt, v.view.view_time.selection, v.targetDate);
        }
        const currentBarDate = current && current.bar_date ? current.bar_date : null;

        const results = card.conditions.map((c) => cache
          ? evaluateCondition(card, c, cache, v.cutoffAt, currentBarDate)
          : {
            condition_id: c.condition_id, rule_desc: buildRuleDesc(c.metric, c.operator, c.threshold),
            baseline_state: truthOf(card.snapshot.metrics[c.metric], c), baseline_value: card.snapshot.metrics[c.metric],
            current_state: 'unknown', current_value: null, current_error: 'api_error',
            first_observed_met_on: null, first_met_on: null, display_status: 'unknown', distance_pp: null,
            scan: { from_date: null, to_date: null, expected_days: 0, evaluated_days: 0, unknown_dates: [], history_complete: false, daily_states: [] },
          });

        const condition_counts = { met_now: 0, met_before: 0, waiting: 0, unknown: 0 };
        results.forEach((r) => { condition_counts[r.display_status]++; });
        let bucket;
        if (!card.conditions.length) bucket = 'no_conditions';
        else if (condition_counts.met_now > 0) bucket = 'met_now';
        else if (condition_counts.unknown > 0) bucket = 'unknown';
        else if (condition_counts.met_before > 0) bucket = 'met_before';
        else bucket = 'waiting';

        // 变化量
        const changes = { price: null, metrics: {} };
        const display_changes = { price: null, metrics: {} };
        if (card.conditions.length || true) {
          const keys = {};
          card.focus_metrics_at_creation.concat(card.conditions.map((c) => c.metric)).forEach((k) => (keys[k] = true));
          Object.keys(keys).forEach((k) => {
            const a = card.snapshot.metrics[k], b = current ? current.metrics[k] : null;
            if (a != null && b != null && a !== b) {
              changes.metrics[k] = { from: a, to: b, delta: b - a };
              if (Math.abs(b - a) >= POLICY.change_display_min_pp) display_changes.metrics[k] = { from: a, to: b, delta: b - a };
            }
          });
        }
        const fromPrice = card.snapshot.price, toPrice = current ? current.last_price : null;
        if (isNum(fromPrice) && isNum(toPrice) && fromPrice > 0) {
          const pc = {
            from: fromPrice, to: toPrice, delta_pct: (toPrice / fromPrice - 1) * 100,
            from_basis: card.snapshot.price_basis, to_basis: current.price_basis,
            from_time: card.snapshot.price_time, to_time: current.quote_time || current.bar_close_time,
          };
          changes.price = pc; display_changes.price = pc;
        }

        // data_state 优先级：unavailable → partial → no_new_daily_bar → ready
        let data_state;
        if (!current || !current.bar_date || dayDiff(current.bar_date, card.snapshot.bar_date) > 0) data_state = 'unavailable';
        else if (current.freshness === 'behind_target' || results.some((r) => r.current_error) || results.some((r) => !r.scan.history_complete)) data_state = 'partial';
        else if (current.bar_date === card.snapshot.bar_date) data_state = 'no_new_daily_bar';
        else data_state = 'ready';

        const days_since = (!current || !current.bar_date || dayDiff(current.bar_date, card.snapshot.bar_date) > 0)
          ? null : dayDiff(card.snapshot.bar_date, current.bar_date);
        if (days_since === 0) warnings.push('本次没有新增日线（可能只有盘中价格更新），条件不会冒充多扫描了一天');
        if (current && current.freshness === 'behind_target') warnings.push('该产品缓存落后于共同目标日 ' + v.targetDate + '，本次复核只到实际可用日 ' + current.bar_date + '；不假报已到达目标日');
        if (results.some((r) => r.scan.unknown_dates.length)) {
          const ds = [];
          results.forEach((r) => r.scan.unknown_dates.forEach((d) => { if (ds.indexOf(d) < 0) ds.push(d); }));
          warnings.push('扫描区间存在缺日：' + ds.join('、') + '，首次日期不能作确定宣称');
        }
        if (current && current.price_basis === 'bar_close' && v.view.view_time.selection.kind === 'latest') {
          warnings.push('ticker 不可用，价格已回退到收盘价（口径与历史收盘价一致）');
        }
        const baseMet = results.filter((r) => r.baseline_state === 'met');
        baseMet.forEach((r) => warnings.push('“' + r.rule_desc + '”在保存时（' + card.snapshot.bar_date + '）就已成立，不是后来才等到'));
        results.forEach((r) => {
          if (r.display_status === 'unknown' && r.first_observed_met_on) {
            warnings.push('“' + r.rule_desc + '”在 ' + r.first_observed_met_on + ' 曾观测到成立，但当前值不可用，不能确认现在是否成立');
          }
          if (!r.scan.history_complete && r.first_observed_met_on) {
            warnings.push('“' + r.rule_desc + '”扫描区间不完整，只能报告“最早观测到 ' + r.first_observed_met_on + '”，不能宣称区间内真正首次日期');
          }
        });

        const cmp = {
          comparison_id: makeUid('cmp'),
          workspace_id: wsId,
          view_id: input.view_id,
          card_id: card.card_id,
          instrument_id: card.instrument.instrument_id,
          computed_at: DEMO_NOW_ISO,
          review_as_of: v.view.view_time,
          days_since: days_since,
          data_state: data_state,
          last_judgment: card.judgment_text,
          raw_input: card.raw_input,
          stance: card.stance,
          user_edited: card.user_edited,
          baseline_snapshot: card.snapshot,
          current_snapshot: current || buildQuote(wsId, card.instrument, {
            bars: [], _byDate: {}, _listing_date: null, _lastClosed: null,
            fetched_at: null, data_revision: null,
          }, v.cutoffAt, v.view.view_time.selection, v.targetDate),
          changes: changes,
          display_changes: display_changes,
          condition_results: results,
          condition_counts: condition_counts,
          bucket: bucket,
          unsupported_notes: card.unsupported_notes,
          warnings: warnings,
          verdict: null,
        };
        // 《03 市场裁决》§4.1：判决由代码机械得出，模型碰不到结论。
        // closeAt 与 computeMetricsAt 取值规则同一套；cache 不在时恒返回 null，verdictOf 自然落到「判不了」。
        const closeAt = (d) => {
          const b = cache && cache._byDate ? cache._byDate[d] : null;
          return b && b.is_closed && isNum(b.close) && b.close > 0 ? b.close : null;
        };
        cmp.verdict = verdictOf(card, cmp, closeAt);
        return cmp;
      });

      const summary = { total_cards: comparisons.length, met_now: 0, unknown: 0, met_before: 0, waiting: 0, no_conditions: 0 };
      comparisons.forEach((c) => { summary[c.bucket]++; });

      const batch = {
        view_id: input.view_id,
        generated_at: DEMO_NOW_ISO,
        cards: selected,
        comparisons: comparisons,
        summary: summary,
      };
      state.reviews[input.view_id] = batch;
      logEvent('service', 'review_cards()',
        '复核 ' + selected.length + ' 张卡 · 截止 ' + cutoffDate + ' · 不调用模型 · 桶 ' +
        JSON.stringify(summary));
      return result.ok(batch);
    }

    // ── P1：研究设置解析（演示用规则解析，正式由 C 实现） ──────────────
    const ALIASES = {
      NVDAx: ['nvda', '英伟达', 'nvidia'], AAPLx: ['aapl', '苹果', 'apple'],
      TSLAx: ['tsla', '特斯拉', 'tesla'], MSFTx: ['msft', '微软', 'microsoft'],
      METAx: ['meta', '脸书', 'facebook'],
    };
    // HORIZON_WORDS 已提到模块顶层（6b 节），parseSetup 与 parseHorizonText 共用。
    const UNSUPPORTED_WINDOWS = [/近?\s*7\s*天/, /近?\s*30\s*天/, /近?\s*10\s*天/, /近?\s*3\s*天/];

    function parseSetup(input) {
      const text = input.user_input || '';
      const matched = [], notes = [];
      const wl = input.whitelist || [];
      wl.forEach((s) => {
        const aliases = ALIASES[s.symbol] || [];
        const hit = aliases.concat([s.symbol.toLowerCase()]).some((a) => text.toLowerCase().indexOf(a) >= 0)
          || (s.display_name && text.indexOf(s.display_name.replace(/（.*?）/, '')) >= 0);
        if (hit) matched.push({ symbol: s.symbol, display_name: s.display_name });
      });
      // 白名单外的中文名 → 明确记入 unsupported_notes，不静默忽略
      ['茅台', '贵州茅台', '宁德时代', '比亚迪', '腾讯', '阿里', '苹果概念'].forEach((n) => {
        if (text.indexOf(n) >= 0 && !matched.some((m) => m.display_name.indexOf(n) >= 0)) notes.push('未收录 / 不支持的标的：' + n);
      });
      if (/pe|市盈率|财报|业绩|估值/i.test(text)) notes.push('PE / 财报等基本面数据不在系统可计算范围');
      UNSUPPORTED_WINDOWS.forEach((re) => {
        const m = text.match(re);
        if (m && !/一到两周|1-2周/.test(text)) {
          const label = m[0].replace(/\s/g, '');
          const explicit = /近?(5|20)\s*天/.test(label);
          if (explicit) return;
          notes.push('不支持的窗口“' + label + '”：系统只按 5 / 20 个连续自然日窗口计算，不会悄悄改成 5 或 20 天');
        }
      });

      let horizon_text = '', horizon_days = null;
      for (const [re, label, days] of HORIZON_WORDS) {
        if (re.test(text)) {
          horizon_text = label;
          horizon_days = days === 10.5 ? Math.floor(days) : days; // 范围取平均后向下取整
          break;
        }
      }
      const boundary = POLICY.recent_change_horizon_boundary_days;
      let primaryMetric = POLICY.missing_horizon_recent_metric;
      if (horizon_days != null) primaryMetric = horizon_days <= boundary ? 'chg_5d' : 'chg_20d';
      if (/近?\s*5\s*天/.test(text)) primaryMetric = 'chg_5d';
      if (/近?\s*20\s*天/.test(text)) primaryMetric = 'chg_20d';

      const focus = DEFAULT_FOCUS_METRICS.slice().filter((m) => m !== primaryMetric);
      const ordered = [primaryMetric].concat(focus);
      if (/均线|ma20/i.test(text) && ordered.indexOf('ma20_gap') < 0) ordered.push('ma20_gap');
      if (/波动|风险|vol/i.test(text) && ordered.indexOf('chg_1d') < 0) ordered.push('chg_1d');

      return result.ok({
        draft_id: makeUid('setupdraft'),
        context_id: null,      // P1 没有冻结上下文
        attempts: 1,
        draft: {
          symbols: matched.length ? matched : wl.slice(0, 3),
          horizon_text: horizon_text,
          horizon_days: horizon_days,
          focus_metrics: ordered,
          unsupported_notes: notes,
          notes: matched.length ? undefined : ['没有从这句话里识别到已收录的标的，已保留默认选择'],
        },
      });
    }

    function confirmSetup(req) {
      if (!req.confirmed || !req.confirmed.symbols || !req.confirmed.symbols.length) {
        return result.err('INVALID_INPUT', '至少需要一个受支持的产品', false);
      }
      if (!req.confirmed.focus_metrics || !req.confirmed.focus_metrics.length) {
        return result.err('INVALID_INPUT', '至少需要一个可见指标', false);
      }
      const symbols = req.confirmed.symbols.map((s) => instrumentBySymbol[(s.symbol || '').toLowerCase()])
        .filter(Boolean);
      if (symbols.length !== req.confirmed.symbols.length) {
        return result.err('UNSUPPORTED_SYMBOL', '有标的无法在白名单中补全产品映射，请确认代码是否歧义', false);
      }
      const setup = {
        schema_version: SCHEMA_VERSION,
        workspace_id: req.workspace_id,
        raw_input: req.raw_input || '',
        symbols: symbols,
        horizon_text: req.confirmed.horizon_text || '',
        horizon_days: req.confirmed.horizon_days == null ? null : req.confirmed.horizon_days,
        focus_metrics: req.confirmed.focus_metrics.slice(),
        ranking_metric: req.confirmed.focus_metrics[0],
        unsupported_notes: req.confirmed.unsupported_notes || [],
        research_principles: req.research_principles || null,
        updated_at: DEMO_NOW_ISO,
      };
      writeJSON(KEY.setup + req.workspace_id, setup);
      logEvent('service', 'confirm_setup(' + (req.draft_id ? 'draft ' + req.draft_id : '手动选择') + ')',
        '标的 ' + symbols.map((s) => s.symbol).join('/') + ' · 排序依据 ' + setup.ranking_metric + ' · 周期 ' + (setup.horizon_days == null ? '未指定' : setup.horizon_days + ' 天'));
      return result.ok(setup);
    }

    function setConditionUserState(input) {
      const cards = getCards(input.workspace_id);
      const card = cards.filter((c) => c.card_id === input.card_id)[0];
      if (!card) return result.err('INVALID_INPUT', '卡片不存在', false);
      const cond = card.conditions.filter((c) => c.condition_id === input.condition_id)[0];
      if (!cond) return result.err('INVALID_INPUT', '条件不存在', false);
      cond.user_state = { state: input.state, changed_at: DEMO_NOW_ISO };
      saveCards(input.workspace_id, cards);
      logEvent('service', 'set_condition_user_state', cond.condition_id + ' → ' + input.state + '（仅用户处理状态，不改变条件真值）');
      return result.ok(card);
    }

    /**
     * 删除单张判断卡片。
     *
     * 为什么需要：在这之前，研究记录只增不减 —— 选错标的、条件填反、只是随手
     * 试一张，都会永远留在「我的判断」里。唯一的出口是「重置工作区」，那会把
     * 同一空间里所有卡一起清掉，代价太大。删除必须能只针对一张。
     *
     * 幂等记录要一并释放：confirm_card 会用 idempotency_key 命中已有卡。如果
     * 只删卡不清 key，用户在同一个上下文里重新保存时会直接拿回一张已经不存在的
     * 卡（界面表现为「保存成功但列表里没有」）。
     *
     * 删除是「先挪进回收站」而不是真删：卡片原样存在回收站里，可以随时恢复。
     * 真正丢掉数据只发生在两处 —— 回收站满了被挤掉、或者用户手动清空。
     *
     * `snapshot` 是给调用方塞「跟着卡片走的旁路数据」用的（界面上是复盘记录、
     * 承接关系、弹过的裁决）。引擎不解释它的内容，只负责在删除时存下、
     * 恢复时原样交还。这样界面在删卡后可以立刻把这些清干净（导出就不会带孤儿数据），
     * 撤销时又不会丢东西。
     *
     * 这里只做数据层的事：不碰界面、不做二次确认 —— 确认由调用方负责。
     */
    function deleteCard(input) {
      const wsId = input && input.workspace_id;
      const cardId = input && input.card_id;
      if (!wsId || !cardId) return result.err('INVALID_INPUT', '删除请求缺少工作区或卡片标识', false);

      const cards = getCards(wsId);
      const idx = cards.findIndex((c) => c.card_id === cardId);
      if (idx < 0) return result.err('INVALID_INPUT', '这张判断已经不在记录里了', false);
      const removed = cards.splice(idx, 1)[0];
      if (!saveCards(wsId, cards)) return fail('STORAGE_ERROR', '删除没有写进本地存储，请稍后重试', true);

      const idemKey = KEY.idem + wsId;
      const idem = readJSON(idemKey, {});
      let released = 0;
      Object.keys(idem).forEach((k) => {
        if (idem[k] && idem[k].card_id === cardId) { delete idem[k]; released += 1; }
      });
      if (released) writeJSON(idemKey, idem);

      // 复核批次是会话内的缓存，里面可能还留着这张卡的比较结果
      if (state.reviews) delete state.reviews[cardId];

      const trash = getTrash(wsId);
      const entry = {
        trash_id: makeUid('trash'),
        card_id: cardId,
        symbol: removed.instrument.symbol,
        bar_date: removed.snapshot.bar_date,
        judgment: removed.judgment_text || removed.raw_input || '',
        deleted_at: now(),
        // group 把「一次操作删掉的几张」绑在一起，界面才能一次撤销整批。
        group: input.group || null,
        snapshot: input.snapshot === undefined ? null : input.snapshot,
        card: removed,
      };
      trash.unshift(entry);
      const dropped = trash.splice(TRASH_LIMIT);
      saveTrash(wsId, trash);

      logEvent('service', 'delete_card(' + removed.instrument.symbol + ')',
        cardId + ' · T0=' + removed.snapshot.bar_date + ' · 剩余 ' + cards.length + ' 张'
        + (released ? ' · 释放幂等记录 ' + released + ' 条' : '')
        + ' · 已移入回收站（' + trash.length + ' 条）'
        + (dropped.length ? ' · 回收站已满，挤掉最旧 ' + dropped.length + ' 条' : ''));
      return result.ok({
        card_id: cardId, deleted: true, remaining: cards.length,
        trash_id: entry.trash_id, trash_size: trash.length, dropped: dropped.map((d) => d.card_id),
      });
    }

    /** 挑出要恢复的回收站条目：给了 trash_id 就那一条，给了 group 就那一整批。 */
    function pickTrash(trash, input) {
      if (input.trash_id) return trash.filter((t) => t.trash_id === input.trash_id);
      if (input.group) return trash.filter((t) => t.group && t.group === input.group);
      return [];
    }

    /** 从回收站恢复。恢复把卡片放回列表，并把当初存下的旁路数据原样交还。 */
    function restoreCard(input) {
      const wsId = input && input.workspace_id;
      if (!wsId) return result.err('INVALID_INPUT', '缺少工作区标识', false);
      const wanted = pickTrash(getTrash(wsId), input || {});
      if (!wanted.length) return result.err('INVALID_INPUT', '这条删除记录已经不在回收站里了', false);

      const pickIds = wanted.map((t) => t.trash_id);
      const cards = getCards(wsId);
      const snapshots = [];
      const restored = [];
      let skipped = 0;
      wanted.forEach((entry) => {
        // 已经在列表里就不重复放回去（正常不会发生，兜一层）
        if (cards.some((c) => c.card_id === entry.card_id)) { skipped += 1; return; }
        cards.push(entry.card);
        snapshots.push(entry.snapshot === undefined ? null : entry.snapshot);
        restored.push(entry.card_id);
      });
      if (!restored.length) return result.err('INVALID_INPUT', '这张判断已经在列表里了', false);
      if (!saveCards(wsId, cards)) return fail('STORAGE_ERROR', '恢复没有写进本地存储，请稍后重试', true);
      saveTrash(wsId, getTrash(wsId).filter((t) => pickIds.indexOf(t.trash_id) < 0));

      // 幂等记录也补回来：不补的话，用户在同一上下文重新保存会再生成一张重复的卡
      const idemKey = KEY.idem + wsId;
      const idem = readJSON(idemKey, {});
      let restoredIdem = 0;
      wanted.forEach((entry) => {
        const key = entry.card && entry.card.idempotency_key;
        if (key && !idem[key]) { idem[key] = { card_id: entry.card_id, shape: entry.card.idempotency_shape }; restoredIdem += 1; }
      });
      if (restoredIdem) writeJSON(idemKey, idem);

      logEvent('service', 'restore_card(' + restored.length + ' 张)',
        restored.join('、') + ' · 回到列表（共 ' + cards.length + ' 张）'
        + (skipped ? ' · 跳过已在列表里的 ' + skipped + ' 张' : ''));
      return result.ok({
        card_ids: restored, snapshots: snapshots, remaining: cards.length,
        trash_size: getTrash(wsId).length,
      });
    }

    /** 回收站列表。卡片本体不给出去 —— 界面只需要够展示和恢复的信息。 */
    function listTrash(input) {
      const wsId = input && input.workspace_id;
      if (!wsId) return result.err('INVALID_INPUT', '缺少工作区标识', false);
      return result.ok(getTrash(wsId).map((t) => ({
        trash_id: t.trash_id, card_id: t.card_id, group: t.group, symbol: t.symbol, bar_date: t.bar_date,
        judgment: t.judgment, deleted_at: t.deleted_at,
      })));
    }

    /**
     * 永久删除。给了 trash_id 删一条，给了 group 删那一批，都没给就清空。
     * 返回被清掉卡片的 id 列表 —— 界面拿到之后才能把旁路数据（复盘、承接关系、
     * 弹过的裁决）也一起清干净，否则 storage 里会留一堆指不到卡片的孤儿。
     */
    function purgeTrash(input) {
      const wsId = input && input.workspace_id;
      if (!wsId) return result.err('INVALID_INPUT', '缺少工作区标识', false);
      const req = input || {};
      const trash = getTrash(wsId);
      let removed;
      if (req.trash_id || req.group) {
        const wanted = pickTrash(trash, req);
        if (!wanted.length) return result.err('INVALID_INPUT', '这条删除记录已经不在回收站里了', false);
        const ids = wanted.map((t) => t.trash_id);
        removed = trash.filter((t) => ids.indexOf(t.trash_id) >= 0);
        saveTrash(wsId, trash.filter((t) => ids.indexOf(t.trash_id) < 0));
      } else {
        removed = trash.splice(0, trash.length);
        saveTrash(wsId, trash);
      }
      const scope = req.trash_id ? 'purge_trash(1)' : req.group ? 'purge_trash(批)' : 'purge_trash(all)';
      logEvent('service', scope, '彻底删除 ' + removed.length + ' 张 · 回收站剩 ' + getTrash(wsId).length + ' 条');
      return result.ok({ purged: removed.map((t) => t.card_id), trash_size: getTrash(wsId).length });
    }

    function resetWs(wsId) {
      const keys = [KEY.setup + wsId, KEY.cards + wsId, KEY.idem + wsId, KEY.trash + wsId];
      if (persist) keys.forEach((k) => persist.removeItem(k));
      keys.forEach((k) => { delete memStore[k]; });
      state.views = {}; state.contexts = {}; state.drafts = {}; state.reviews = {}; state.log = [];
      logEvent('demo', '重置演示数据', '工作区 ' + wsId + ' 的设置、卡片与幂等记录已清空');
    }

    // ── 演示脚本：通过真实调用链路（prepare → 起草 → 确认）铺好一批判断 ──
    const DEMO_SCRIPT = [
      {
        instrument_id: 'bitget:spot:NVDAx', as_of: '2026-09-01',
        raw_input: '英伟达这波涨得太急，我不追高，等它回调下来再考虑接回来。如果近5天涨跌低于 -3% 我先建半仓。另外近20天涨跌只要还高于 5%，趋势就还在。相对20天均线偏离高于 10% 我就彻底不碰了。财报日期需要我自己确认。',
        stance: 'wait_condition',
        conditions: [
          { metric: 'chg_5d', operator: 'lt', threshold: -3, threshold_origin: 'user_explicit' },
          { metric: 'chg_20d', operator: 'gt', threshold: 5, threshold_origin: 'user_explicit' },
          { metric: 'ma20_gap', operator: 'gt', threshold: 10, threshold_origin: 'user_explicit' },
        ],
      },
      {
        instrument_id: 'bitget:spot:TSLAx', as_of: '2026-09-01',
        raw_input: '特斯拉这波跌得急，如果近5天涨跌低于 -2% 我接一点。单日跌超 1% 也算机会。',
        stance: 'wait_condition',
        conditions: [
          { metric: 'chg_5d', operator: 'lt', threshold: -2, threshold_origin: 'user_explicit' },
          { metric: 'chg_1d', operator: 'lt', threshold: -1, threshold_origin: 'user_explicit' },
        ],
      },
      {
        instrument_id: 'bitget:spot:AAPLx', as_of: '2026-09-01',
        raw_input: '苹果走得很稳，我想看它动能能不能延续：近5天涨跌高于 0.4% 就先不动。上一日线涨跌真要高于 0.5% 我再考虑加。',
        stance: 'neutral',
        conditions: [
          { metric: 'chg_5d', operator: 'gt', threshold: 0.4, threshold_origin: 'user_explicit' },
          { metric: 'chg_1d', operator: 'gt', threshold: 0.5, threshold_origin: 'user_explicit' },
        ],
      },
      {
        instrument_id: 'bitget:spot:MSFTx', as_of: '2026-09-01',
        raw_input: '微软走得太稳，我想等它相对20天均线明显偏离再加仓：偏离高于 2% 我才动手。等它自己的财报出来再判断，别的地方看到的消息我不打算用来改这张卡。',
        stance: 'wait_condition',
        conditions: [{ metric: 'ma20_gap', operator: 'gt', threshold: 2, threshold_origin: 'user_explicit' }],
      },
      {
        instrument_id: 'bitget:spot:METAx', as_of: '2026-09-06',
        raw_input: 'Meta 的注记：近一个月走势逐步走稳。我先保留这次观察，等价格和均线关系发生变化时再回来复核。',
        stance: 'wait_condition', manual: true, conditions: [],
        unsupported_notes: [
          '财报日期需自行确认，系统不代查基本面数据',
        ],
      },
    ];

    function seedDemoCards(wsId, opts) {
      const skip = (opts && opts.skip) || [];
      const created = [];
      DEMO_SCRIPT.forEach((step, idx) => {
        if (skip.indexOf(idx) >= 0) return;
        const openRes = openWorkbench({ workspace_id: wsId, selection: { kind: 'historical', as_of: step.as_of }, trigger: 'open' });
        if (!openRes.ok) { logEvent('demo', '演示卡组：打开 ' + step.as_of + ' 失败', openRes.error.code); return; }
        const prepared = prepareCard({ view_id: openRes.data.view_id, instrument_id: step.instrument_id });
        if (!prepared.ok) { logEvent('demo', '演示卡组：冻结 ' + step.instrument_id + ' 失败', prepared.error.code); return; }
        const ctx = prepared.data;
        let draftId = null, judgment = step.raw_input;
        if (!step.manual) {
          const d = generateCardDraft({ context_id: ctx.context_id, user_text: step.raw_input });
          if (d.ok) { draftId = d.data.draft_id; }
        }
        const confirmed = confirmCard({
          context_id: ctx.context_id,
          draft_id: draftId,
          idempotency_key: 'demo-seed-' + idx,
          raw_input: step.raw_input,
          judgment_text: judgment,
          stance: step.stance,
          conditions: step.conditions.map((c) => ({
            text: buildRuleDesc(c.metric, c.operator, c.threshold),
            metric: c.metric, operator: c.operator, threshold: c.threshold, threshold_origin: c.threshold_origin,
          })),
          unsupported_notes: step.unsupported_notes || ['“财报 / PE 等基本面数据”系统不提供，需自行确认后再人工判断'],

    // 目录按关注顺序重排，保证界面排序稳定
    const ordered = wanted.map((s) => instruments.find((i) => i.symbol === s)).filter(Boolean);

    return {
      source: {
        mode: 'provided',
        label: 'Bitget 实时行情（代币化美股）',
        catalog: {
          catalog_version: 'bitget-live-' + new Date().toISOString().slice(0, 10),
          verified_at: new Date().toISOString(),
          verified: true,                        // product_symbol 取自官方 instruments 接口
          note: '代币化美股目录来自 Bitget /api/v2/spot/public/symbols（areaSymbol=yes）。',
          instruments: ordered,
        },
        caches: finalCaches,
        warnings: warnings,
      },
      // 全量目录一并交回去：界面拿它做「搜索添加标的」，
      // 否则还得让用户再手动点一次「拉取全市场目录」，多一步且没网就卡住。
      universe: catalogRes.instruments,
      meta: {
        via: quoteVia || catalogRes.via,
        universe: catalogRes.instruments.length,   // 全市场可用标的数
        selected: ordered.length,
        fetched_at: new Date().toISOString(),
        warnings: warnings,
      },
    };
  }

  // ── 关注列表存储 ────────────────────────────────────────────────────────
  const WATCH_KEY = 'mydesk.next.watchlist';

  function readWatchlist(store) {
    try {
      const raw = store && store.getItem(WATCH_KEY);
      const arr = raw ? JSON.parse(raw) : null;
      if (Array.isArray(arr)) return arr.filter(s => typeof s === 'string' && s.length);
    } catch (e) { /* 损坏则回落默认 */ }
    return DEFAULT_WATCHLIST.slice();
  }

  function writeWatchlist(store, symbols) {
    const clean = [];
    (symbols || []).forEach((s) => { if (s && clean.indexOf(s) < 0) clean.push(s); });
    try { if (store) store.setItem(WATCH_KEY, JSON.stringify(clean)); } catch (e) { /* 存不下就算了 */ }
    return clean;
  }

  return {
    UPSTREAM: UPSTREAM,
    RELAY: RELAY,
    DEFAULT_WATCHLIST: DEFAULT_WATCHLIST,
    POPULAR_STOCKS: POPULAR_STOCKS,
    CURATED_GROUPS: CURATED_GROUPS,
    WATCH_KEY: WATCH_KEY,
    get: get,
    fetchSymbols: fetchSymbols,
    fetchDailyBars: fetchDailyBars,
    fetchChartBars: fetchChartBars,
    fetchQuotes: fetchQuotes,
    applyQuotes: applyQuotes,
    toCache: toCache,
    loadDataSource: loadDataSource,
    readWatchlist: readWatchlist,
    writeWatchlist: writeWatchlist,
    msToLocalDate: msToLocalDate,
    underlyingOf: underlyingOf,
  };
});

      var err = new Error(e && e.name === 'AbortError' ? '请求超时（' + Math.round(timeoutMs / 1000) + ' 秒）' : ('连不上中转：' + (e && e.message ? e.message : e)));
      err.code = 'NO_RELAY';
      throw err;
    });
  }

  /** 浏览器直连（中转不可用时的兜底；要求目标服务允许跨域） */
  function chatDirect(messages, cfg, opts) {
    var f = resolveFetch(opts);
    if (!f) return Promise.reject(new Error('当前环境没有可用的网络请求能力'));
    var url = String(cfg.baseUrl).replace(/\/+$/, '') + '/chat/completions';
    var t = withTimeout((opts && opts.timeoutMs) || DEFAULT_TIMEOUT);
    var body = {
      model: cfg.model,
      messages: messages,
      temperature: (opts && typeof opts.temperature === 'number') ? opts.temperature : 0.2,
      response_format: { type: 'json_object' },
    };
    return f(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + cfg.apiKey,
      },
      body: JSON.stringify(body),
      signal: t.signal,
    }).then(function (r) {
      t.done();
      return r.text().then(function (txt) {
        if (!r.ok) {
          var e = new Error('接口返回 HTTP ' + r.status + '：' + String(txt).slice(0, 200));
          e.code = 'AI_HTTP_' + r.status;
          throw e;
        }
        var j;
        try { j = JSON.parse(txt); } catch (e2) { throw new Error('接口返回不是合法 JSON'); }
        var content = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
        if (!content) throw new Error('接口返回里没有内容');
        return { content: content, via: 'direct', model: cfg.model };
      });
    }, function (e) {
      t.done();
      var err = new Error(e && e.name === 'AbortError'
        ? '请求超时（' + Math.round(((opts && opts.timeoutMs) || DEFAULT_TIMEOUT) / 1000) + ' 秒）'
        : ('直连失败（可能是跨域或网络）：' + (e && e.message ? e.message : e)));
      err.code = e && e.name === 'AbortError' ? 'AI_TIMEOUT' : 'AI_NETWORK';
      throw err;
    });
  }

  /**
   * 主入口：转译一段口语化的判断。
   *
   * @param {object} input { text }
   * @param {object} opts  { storage, fetchImpl, timeoutMs, forceRule, prefer:'relay'|'direct' }
   * @returns {Promise<{ok, professional, stance, source, via?, error?}>}
   */
  function translate(input, opts) {
    var o = opts || {};
    var text = String((input && input.text) || '').trim();
    if (!text) {
      return Promise.resolve({ ok: false, error: '先写点什么，再转译。', source: 'none' });
    }

    var local = readConfig(o.storage);

    if (o.forceRule) {
      var r = ruleTranslate(input);
      r.ok = true; r.source = 'rule';
      return Promise.resolve(r);
    }

    var messages = [
      { role: 'system', content: systemPrompt() },
      { role: 'user', content: userPrompt(input) },
    ];

    function fromRule(reason) {
      var rr = ruleTranslate(input);
      rr.ok = true;
      rr.source = 'rule';
      rr.fallbackReason = reason || '';
      return rr;
    }

    function finish(content, via, model) {
      var parsed = extractJson(content);
      if (!parsed) {
        return { ok: false, error: '模型返回的内容不是合法 JSON，已保留原话。', source: 'ai', via: via, raw: String(content).slice(0, 300) };
      }
      var norm = normalize(parsed, text);
      if (!norm.professional) {
        return { ok: false, error: '模型没有给出转译结果，已保留原话。', source: 'ai', via: via };
      }
      norm.ok = true;
      norm.source = 'ai';
      norm.via = via;
      norm.model = model;
      return norm;
    }

    var useDirect = o.prefer === 'direct';

    // 浏览器没配 Key，也没要求强制规则 → 试试服务端有没有配
    function attempt(cfg) {
      var p = useDirect ? chatDirect(messages, cfg, o) : chat(messages, cfg, o);
      return p.then(function (res) {
        return finish(res.content, res.via, res.model);
      }, function (e) {
        // 中转没有 → 退回直连（前提是浏览器有 Key）
        if (e && e.code === 'NO_RELAY' && !useDirect && cfg.apiKey) {
          return chatDirect(messages, cfg, o).then(function (res) {
            return finish(res.content, res.via, res.model);
          });
        }
        throw e;
      });
    }

    if (cfgComplete(local)) {
      return attempt(local).catch(function (e) {
        var rr = fromRule((e && e.message) || 'AI 调用失败');
        rr.error = (e && e.message) || 'AI 调用失败';
        return rr;
      });
    }

    // 浏览器没配全 → 看服务端
    return probeServer(o).then(function (srv) {
      if (srv && srv.configured) {
        return attempt({ baseUrl: srv.baseUrl || local.baseUrl, model: srv.model || local.model, apiKey: '' })
          .catch(function (e) {
            var rr = fromRule((e && e.message) || 'AI 调用失败');
            rr.error = (e && e.message) || 'AI 调用失败';
            return rr;
          });
      }
      var rr = fromRule('还没有配置 AI 接口');
      rr.needsSetup = true;
      return rr;
    });
  }

  /* ══ 多想一步 · 说清楚（plain-speak-v2.4）════════════════════════════════
     和上面的转译是两次独立的调用：互不阻塞、各自失败、各自缓存。
       ① readings：把用户原话里说不清的词，翻成图上能验证的读法；
       ② objections：技术面上真正和判断冲突的地方，最多 2 条，可以为空。
     模型永远不写数字：它只从字典里挑 kind 和参数，所有数字由代码按冻结快照算。
     这一段只处理 app.js 传进来的纯数据（证据表、周期、立场），不依赖引擎。

  var PS_VERSION = 'plain-speak-v2.4';

  var PS_STANCE_LABELS = { bullish: '看多', bearish: '看跌', neutral: '波动', wait_condition: '等条件' };
  var PS_KINDS = ['move_band', 'close_vs_ma', 'no_new_low', 'ma_turn'];
  /* 读法字典。ma 的取值 'MA' 表示「本次可用的均线周期」，发送前按数据裁剪；needs 里的 N 替换成均线周期。 */
  var PS_DICT = {
    move_band:   { params: { dir: ['up', 'down'], band: ['small', 'mid', 'large'] },
                   needs: ['close', 'vol_20d'], use: '涨一点、跌一点、反弹一下、回调一下、涨一波、大涨大跌' },
    close_vs_ma: { params: { ma: 'MA', side: ['above', 'below'], days: [1, 2, 3, 5] },
                   needs: ['close', 'maN', 'maN_side'], use: '站稳、站上、守住、跌破、失守' },
    no_new_low:  { params: { days: [3, 5, 10, 20] },
                   needs: ['low_20d', 'since_low'], use: '筑底、见底、底部信号、跌不动了、止跌' },
    ma_turn:     { params: { ma: 'MA', to: ['up', 'flat_or_up'] },
                   needs: ['maN_slope'], use: '筑底、企稳、止跌、走强、转势' },
  };
  var PS_BAND_K = { small: 0.5, mid: 1.0, large: 2.0 };
  var PS_BAND_SHARE = { small: '一半', mid: '一倍', large: '两倍' };

  function psRound(v, dp) { var f = Math.pow(10, dp); return Math.round(v * f) / f; }
  function psEvidence(input) {
    var m = {};
    ((input && input.evidence) || []).forEach(function (r) { if (r && r.id) m[r.id] = r; });
    return m;
  }
  function psOk(ev, id) { return !!(ev[id] && ev[id].status === 'ok'); }
  function psNeedsOk(kind, ma, ev) {
    return PS_DICT[kind].needs.every(function (id) { return psOk(ev, id.replace('N', String(ma))); });
  }
  /** 本次可用的均线周期：20 恒在；5 / 10 只在用户图上勾了时才进 */
  function psVisibleMas(input) {
    var vis = ((input && input.visible_mas) || []).map(Number)
      .filter(function (n) { return n === 5 || n === 10 || n === 20; });
    if (vis.indexOf(20) < 0) vis.push(20);
    return vis.sort(function (a, b) { return a - b; });
  }
  /** 按本次数据裁剪后的字典：依赖行不全可用的 kind 拿掉；ma 只留依赖行全可用的周期 */
  function psDictFor(input, ev) {
    var out = {};
    PS_KINDS.forEach(function (kind) {
      var spec = PS_DICT[kind], params = {};
      if (spec.params.ma === 'MA') {
        var mas = psVisibleMas(input).filter(function (n) { return psNeedsOk(kind, n, ev); });
        if (!mas.length) return;
        Object.keys(spec.params).forEach(function (k) { params[k] = k === 'ma' ? mas : spec.params[k].slice(); });
      } else {
        if (!psNeedsOk(kind, '', ev)) return;
        Object.keys(spec.params).forEach(function (k) { params[k] = spec.params[k].slice(); });
      }
      out[kind] = { params: params, use: spec.use };
    });
    return out;
  }

  function psMaFamily(n) { return ['ma' + n, 'ma' + n + '_gap', 'ma' + n + '_slope', 'ma' + n + '_side']; }
  var PS_MENTION = [
    [/收盘价|现价/, ['close']],

  function psMentionOk(point, cites) {

  var PS_DIR = [
    [/上方|站上|上涨|转涨|在涨|走高|上行|向上|往上|反弹/, 1],
    [/下方|跌破|下跌|转跌|在跌|走低|回落|下行|向下|往下|回调/, -1],
  ];
  function psRowSign(r) {
    if (!r || r.status !== 'ok') return null;
    var v = r.value;
    if (/_slope$/.test(r.id)) return v === 'up' ? 1 : (v === 'down' ? -1 : 0);
    if (/^chg_|_gap$|_side$/.test(r.id)) return typeof v === 'number' && isFinite(v) ? (v > 0 ? 1 : (v < 0 ? -1 : 0)) : null;
    return null;
  }
  /** 句子里出现的每种方向都要有同号的引用行；异议还必须含有与立场相反的方向 */
  function psDirectionOk(point, cites, ev, stance) {
    var words = [];
    PS_DIR.forEach(function (d) { if (d[0].test(point)) words.push(d[1]); });
    if (!words.length) return true;
    var rows = cites.map(function (id) { return psRowSign(ev[id]); });
    if (!words.every(function (w) { return rows.indexOf(w) >= 0; })) return false;
    if (stance === 'bullish' && words.indexOf(-1) < 0) return false;
    if (stance === 'bearish' && words.indexOf(1) < 0) return false;
    return true;
  }

  /** 把参数算成数字，并判断记下来之后到期能不能自动核对（规格 02 §4.3、§4.5） */
  function psCompute(reading, input, evIn) {
    var ev = evIn || psEvidence(input);
    var p = reading.params || {};
    var out = { computed: {}, check: 'none', as_condition: null, target: null, check_note: '不自动核对' };
    if (reading.kind === 'move_band') {
      var h = input.horizon_days != null ? Number(input.horizon_days) : PS_DEFAULT_HORIZON;
      var vol = Number(ev.vol_20d.value), close = Number(ev.close.value);
      var sigmaH = vol * Math.sqrt(h / 365);                          // 引擎口径：自然日、年化 365
      var pct = Math.max(1.0, Math.round(PS_BAND_K[p.band] * sigmaH * 2) / 2);
      var price = close * (1 + (p.dir === 'up' ? pct : -pct) / 100);
      out.computed = { h: h, sigma_h: psRound(sigmaH, 1), pct: pct, price: psRound(price, 2), share: PS_BAND_SHARE[p.band] };
      if (input.verdict_enabled) {
        out.check = 'target';
        out.target = { dir: p.dir, price: psRound(price, 2), pct: pct, window_days: h, basis: 'close_since_t0' };
        out.check_note = '到期按收盘价核对（' + h + ' 天内）';
      } else {
        out.check_note = '暂不自动核对';
      }
    } else if (reading.kind === 'close_vs_ma') {
      var n = Number(p.ma), days = Number(p.days);
      var side = Number(ev['ma' + n + '_side'].value);
      out.computed = { ma: n, days: days, ma_value: psRound(Number(ev['ma' + n].value), 2), side_now: side,
        satisfied_now: p.side === 'above' ? side >= days : side <= -days };
      out.check_note = '按原话复核';
    } else if (reading.kind === 'no_new_low') {
      out.computed = { days: Number(p.days), low: psRound(Number(ev.low_20d.value), 2), since_low: Number(ev.since_low.value) };
    } else if (reading.kind === 'ma_turn') {
      var m = Number(p.ma);
      out.computed = { ma: m, to: p.to, slope_now: ev['ma' + m + '_slope'].value };
    }
    return out;
  }

  /** 校验流水线（规格 02 §8）。只删、只清空，从不改写模型的句子。 */
  function psValidate(parsed, input) {
    var ev = psEvidence(input);
    var res = { malformed: false, readings: [], objections: [], struck: 0, struck_readings: 0, log: [] };
    if (!parsed || typeof parsed !== 'object'
      || (!Array.isArray(parsed.readings) && !Array.isArray(parsed.objections))) {
      res.malformed = true;
      return res;
    }
    var dict = psDictFor(input, ev);
    var userNorm = psNorm(input.text);
    function strike(isReading, why, item) {
      res.struck++;
      if (isReading) res.struck_readings++;
      var s = '';
      try { s = JSON.stringify(item); } catch (_) { s = String(item); }
      res.log.push(why + '：' + String(s).slice(0, 160));
    }
    var seen = {}, perQuote = {};
    (Array.isArray(parsed.readings) ? parsed.readings : []).forEach(function (r) {
      if (!r || typeof r !== 'object') { strike(true, 'R0 不是对象', r); return; }
      var quote = typeof r.quote === 'string' ? r.quote.trim() : '';
      var nq = psNorm(quote);
      if (nq.length < 2 || nq.length > 20 || userNorm.indexOf(nq) < 0) { strike(true, 'R1 引用不在原话里', r); return; }
      if (psQuoteHasNumber(quote)) { strike(true, 'R2 原话已经说具体了', r); return; }
      var spec = dict[r.kind];
      if (!spec) { strike(true, 'R3 不在本次字典里', r); return; }
      var params = r.params && typeof r.params === 'object' ? r.params : null;
      var keys = Object.keys(spec.params);
      if (!params || Object.keys(params).length !== keys.length) { strike(true, 'R4 参数键不对', r); return; }
      var clean = {}, okParams = true;
      keys.forEach(function (k) {
        var allowed = spec.params[k], v = params[k];
        if (typeof allowed[0] === 'number' && typeof v === 'string' && /^\d+$/.test(v)) v = Number(v);
        if (allowed.indexOf(v) < 0) okParams = false; else clean[k] = v;
      });
      if (!okParams) { strike(true, 'R4 参数不在白名单', r); return; }
      if (!psNeedsOk(r.kind, clean.ma != null ? clean.ma : '', ev)) { strike(true, 'R5 依赖的数据不可用', r); return; }
      var note = typeof r.note === 'string' ? r.note.trim() : '';
      if (note && (note.length > 16 || psLintHit(note) || psBadNumber(note))) { res.log.push('R6 note 已清空：' + note); note = ''; }
      var key = r.kind + '|' + JSON.stringify(clean) + '|' + nq;
      if (seen[key]) return;                                  // R7 去重（不算没通过校验）
      if ((perQuote[nq] || 0) >= 2) return;                   // R7 同一个说法最多 2 种读法
      if (res.readings.length >= 4) return;                   // R8
      seen[key] = true;
      perQuote[nq] = (perQuote[nq] || 0) + 1;
      res.readings.push({ quote: quote, kind: r.kind, params: clean, note: note });
    });
    var seenCites = {};
    (Array.isArray(parsed.objections) ? parsed.objections : []).forEach(function (o) {
      if (!o || typeof o !== 'object') { strike(false, 'O0 不是对象', o); return; }
      var point = typeof o.point === 'string' ? o.point.trim() : '';
      var cites = Array.isArray(o.cites) ? o.cites.filter(function (x) { return typeof x === 'string'; }) : [];
      if (point.length < 1 || point.length > 24 || !cites.length) { strike(false, 'O1 形状不对', o); return; }
      if (!cites.every(function (id) { return !!ev[id]; })) { strike(false, 'O2 引用了不存在的行', o); return; }
      if (!cites.every(function (id) { return psOk(ev, id); })) { strike(false, 'O3 引用了不可用的行', o); return; }
      if (!psMentionOk(point, cites)) { strike(false, 'O4 提到的指标没有引用', o); return; }
      if (!psDirectionOk(point, cites, ev, input.stance)) { strike(false, 'O5 方向和数据对不上', o); return; }
      var hit = psLintHit(point);
      if (hit) { strike(false, 'O6 禁词（' + hit + '）', o); return; }
      if (psBadNumber(point)) { strike(false, 'O7 写了数字', o); return; }
      var ck = cites.slice().sort().join(',');
      if (seenCites[ck]) return;                              // O8
      if (res.objections.length >= 2) return;                 // O9
      seenCites[ck] = true;
      res.objections.push({ point: point, cites: cites });
    });
    return res;
  }

  /* ── 规则兜底（规格 02 §9）：没有模型时结构完整，同样走 psValidate ──────── */
  var PS_RULE_READINGS = [
    [/站稳|站上|守住/, 'close_vs_ma', { ma: 20, side: 'above', days: 3 }],
    [/跌破|失守/, 'close_vs_ma', { ma: 20, side: 'below', days: 2 }],
    [/筑底|见底|底部|跌不动|止跌|跌得差不多/, 'no_new_low', { days: 5 }],
    [/企稳|走强|转势|拐头/, 'ma_turn', { ma: 20, to: 'flat_or_up' }],
    [/涨一点|小涨|反弹一下/, 'move_band', { dir: 'up', band: 'small' }],
    [/跌一点|小跌|回调一下/, 'move_band', { dir: 'down', band: 'small' }],
    [/涨一波/, 'move_band', { dir: 'up', band: 'mid' }],
    [/跌一波/, 'move_band', { dir: 'down', band: 'mid' }],
    [/大涨/, 'move_band', { dir: 'up', band: 'large' }],
    [/大跌/, 'move_band', { dir: 'down', band: 'large' }],
  ];
  function psRuleReadings(input) {
    var t = String((input && input.text) || '');
    // 先在整句里把均线名遮掉（等长替换，下标不变），免得截窗口时把「20日线」切成半截、把 20 误当成用户给的数字
    var masked = t.replace(PS_MA_NAME, function (s) { return new Array(s.length + 1).join('·'); });
    var raw = [];
    PS_RULE_READINGS.forEach(function (rule) {
      var m = t.match(rule[0]);
      if (!m) return;
      var around = masked.slice(Math.max(0, m.index - 6), m.index + m[0].length + 6);
      if (psQuoteHasNumber(around)) return;                   // 附近已经有具体数字：用户说具体了
      raw.push({ quote: m[0], kind: rule[1], params: rule[2], note: '' });
    });
    return raw.slice(0, 3);
  }
  function psRuleObjections(input, ev) {
    function val(id) { return psOk(ev, id) ? ev[id].value : null; }
    function num(id) { var x = val(id); return typeof x === 'number' && isFinite(x) ? x : null; }
    var out = [], st = input.stance;
    var slope = val('ma20_slope'), gap = num('ma20_gap'), c1 = num('chg_1d'), c5 = num('chg_5d'),
      c20 = num('chg_20d'), side = num('ma20_side'), s1 = num('sigma_1d');
    if (st === 'bullish') {
      if (slope === 'down' && gap != null && gap > 0) out.push({ point: '20天均线还在往下走，站上去也容易掉回来', cites: ['ma20_slope', 'ma20_gap'] });
      if (slope === 'down' && gap != null && gap < 0) out.push({ point: '价格在20天均线下方，均线也还在往下走', cites: ['ma20_gap', 'ma20_slope'] });
      if (c5 != null && c20 != null && c5 < 0 && c20 < 0) out.push({ point: '近5天和近20天都在跌', cites: ['chg_5d', 'chg_20d'] });
      if (side != null && side <= -3) out.push({ point: '已经连着几天收在20天均线下方', cites: ['ma20_side'] });
      if (c1 != null && s1 != null && c1 > 0 && c1 < s1 && ((c5 != null && c5 < 0) || (c20 != null && c20 < 0)))
        out.push({ point: '昨天的涨幅还在单日正常波动以内', cites: ['chg_1d', 'sigma_1d'] });
    } else if (st === 'bearish') {
      if (slope === 'up' && gap != null && gap < 0) out.push({ point: '20天均线还在往上走，跌破了也容易拉回来', cites: ['ma20_slope', 'ma20_gap'] });
      if (slope === 'up' && gap != null && gap > 0) out.push({ point: '价格在20天均线上方，均线也还在往上走', cites: ['ma20_gap', 'ma20_slope'] });
      if (c5 != null && c20 != null && c5 > 0 && c20 > 0) out.push({ point: '近5天和近20天都在涨', cites: ['chg_5d', 'chg_20d'] });
      if (side != null && side >= 3) out.push({ point: '已经连着几天收在20天均线上方', cites: ['ma20_side'] });
      if (c1 != null && s1 != null && c1 < 0 && -c1 < s1 && ((c5 != null && c5 > 0) || (c20 != null && c20 > 0)))
        out.push({ point: '昨天的跌幅还在单日正常波动以内', cites: ['chg_1d', 'sigma_1d'] });
    } else if (st === 'neutral') {
      if (c5 != null && c20 != null && c5 !== 0 && c20 !== 0 && (c5 > 0) === (c20 > 0))
        out.push({ point: '近5天和近20天方向一致，不太像来回震荡', cites: ['chg_5d', 'chg_20d'] });
    }
    return out;
  }
  /** 异议为空、且最近一天的涨跌在单日正常波动以内时，给一行无方向的提示（02 §9.3） */
  function psVolHint(objections, ev) {
    if (objections.length || !psOk(ev, 'sigma_1d') || !psOk(ev, 'chg_1d')) return null;
    var c1 = Number(ev.chg_1d.value), s1 = Number(ev.sigma_1d.value);
    if (!isFinite(c1) || !isFinite(s1) || Math.abs(c1) > s1) return null;
    return { cites: ['chg_1d', 'sigma_1d'] };
  }

  function psFinalize(input, v, meta) {
    var ev = psEvidence(input);
    var readings = [];
    v.readings.forEach(function (r) {
      try {
        var c = psCompute(r, input, ev);
        readings.push({ id: 'r' + (readings.length + 1), quote: r.quote, kind: r.kind, params: r.params, note: r.note,
          computed: c.computed, check: c.check, as_condition: c.as_condition, target: c.target, check_note: c.check_note });
      } catch (e) { v.log.push('计算失败，已跳过：' + (e && e.message)); }
    });
    return {
      ok: true, version: PS_VERSION, source: meta.source, via: meta.via || null, model: meta.model || null,
      fallback_reason: meta.fallback_reason || '', notice: meta.notice || '',
      stance_used: input.stance,
      horizon_used: input.horizon_days != null ? Number(input.horizon_days) : PS_DEFAULT_HORIZON,
      readings: readings, objections: v.objections, vol_hint: psVolHint(v.objections, ev),
      struck_count: v.struck || 0, log: v.log || [],
    };
  }

  /** 规则版。对任何输入都不抛异常：页面启动和点击过程中不能有未捕获错误。 */
  function rulePlainSpeak(input, reason) {
    var inp = input || {};
    try {
      var ev = psEvidence(inp);
      var v = psValidate({ readings: psRuleReadings(inp), objections: psRuleObjections(inp, ev) }, inp);
      v.struck = 0;                                           // 规则版被筛掉的不算"没通过校验"
      return psFinalize(inp, v, { source: 'rule', fallback_reason: reason || '' });
    } catch (e) {
      return { ok: true, version: PS_VERSION, source: 'rule', fallback_reason: reason || '', notice: '',
        stance_used: inp.stance, horizon_used: PS_DEFAULT_HORIZON, readings: [], objections: [],
        vol_hint: null, struck_count: 0, log: ['规则版出错：' + (e && e.message)] };
    }
  }

  /**
   * 主入口。控制流与 translate() 相同：本地配置 → 中转（不通再直连）→ 服务端配置 → 规则。
   * 返回非法 JSON 时重试一次（temperature 0），仍不行退规则版；任何异常都退规则版，永不 reject。
   */
  function plainSpeak(input, opts) {
    var o = opts || {};
    try {
      var text = String((input && input.text) || '').trim();
      if (!text) return Promise.resolve(rulePlainSpeak(input, '没有原话'));
      if (o.forceRule) return Promise.resolve(rulePlainSpeak(input, '已指定规则版'));
      var local = readConfig(o.storage);
      var base = [
        { role: 'system', content: psSystemPrompt() },
        { role: 'user', content: psUserPrompt(input) },
      ];
      var useDirect = o.prefer === 'direct';
      var send = function (cfg, messages, temperature) {
        var oo = {};
        Object.keys(o).forEach(function (k) { oo[k] = o[k]; });
        oo.temperature = temperature;
        var p = useDirect ? chatDirect(messages, cfg, oo) : chat(messages, cfg, oo);
        return p.catch(function (e) {
          if (e && e.code === 'NO_RELAY' && !useDirect && cfg.apiKey) return chatDirect(messages, cfg, oo);
          throw e;
        });
      };
      var judge = function (res) {
        var parsed = extractJson(res && res.content);
        var v = parsed ? psValidate(parsed, input) : null;
        return v && !v.malformed ? v : null;
      };
      var done = function (v, res) {
        var meta = { source: 'ai', via: res.via, model: res.model };
        if (!v.readings.length && v.struck_readings > 0) {       // 读法全被删 → 读法换成规则版（02 §8.7）
          v.readings = psValidate({ readings: psRuleReadings(input), objections: [] }, input).readings;
          meta.notice = 'AI 给的读法没通过校验，已换成规则版';
        }
        return psFinalize(input, v, meta);
      };
      var attempt = function (cfg) {
        return send(cfg, base, 0.2).then(function (res) {
          var v = judge(res);
          if (v) return done(v, res);
          var retry = base.concat([{ role: 'user', content: '上次输出不是合法 JSON，只返回 JSON 对象，不要任何其他文字。' }]);
          return send(cfg, retry, 0).then(function (res2) {
            var v2 = judge(res2);
            return v2 ? done(v2, res2) : rulePlainSpeak(input, '模型两次都没有返回合法 JSON');
          });
        });
      };
      var safe = function (p) {
        return p.catch(function (e) { return rulePlainSpeak(input, (e && e.message) || 'AI 调用失败'); });
      };
      if (cfgComplete(local)) return safe(attempt(local));
      return safe(probeServer(o).then(function (srv) {
        if (srv && srv.configured) {
          return attempt({ baseUrl: srv.baseUrl || local.baseUrl, model: srv.model || local.model, apiKey: '' });
        }
        var r = rulePlainSpeak(input, '还没有配置 AI 接口');
        r.needsSetup = true;
        return r;
      }));
    } catch (e) {
      return Promise.resolve(rulePlainSpeak(input, '说清楚出错：' + (e && e.message)));
    }
  }


  /* ══ 《04 市场裁决 · LLM 约束 v1.1》 ═══════════════════════════════════
     模型只写判决理由书里的几句话，而且只能引用卷宗：
       recap      1–40 字的一句开场，不含数字，不评价对错
       divergence 从代码给的候选里挑一条，1–25 字
       lessons    从代码给的经验候选里挑 0–2 条，句子由代码拼
     结论、标题、事实、说明、全部数字，都由代码生成 —— 模型碰不到。
     ══════════════════════════════════════════════════════════════════ */
  var VR_VERSION = 'verdict-recap-v1';
  var VR_LINT = [
    ['judge',   /失败|成功|错误|正确|准确|精准|眼光|可惜|遗憾|不幸|幸好|果然|早知道|恭喜/],
    ['advice',  /建议|推荐|应该|最好|下次|不妨|值得|可以考虑|记得|务必/],
    ['cause',   /因为|由于|受.{0,6}影响|市场担心|情绪|预期|资金|消息|财报|业绩|新闻|政策|板块|大盘|美联储|利率/],
    ['trade',   /买入|卖出|做多|做空|建仓|加仓|减仓|清仓|平仓|抄底|追高|止盈|止损|仓位|上车|梭哈/],
    ['certain', /(^|[^不])(一定|必然|肯定|必将)|说明你|证明了|印证了你/],
    ['offengine', /MACD|RSI|KDJ|布林|成交量|放量|缩量|超买|超卖/i],
  ];
  function vrLintHit(s) {
    for (var i = 0; i < VR_LINT.length; i++) if (VR_LINT[i][1].test(String(s))) return VR_LINT[i][0];
    return null;
  }
  /** 复盘里模型没有任何需要写数字的理由，所以比《02》更严 */
  function vrBadNumber(s) {
    var t = String(s == null ? '' : s).replace(/(5|10|20)天/g, '');     // 只放过「5天 / 10天 / 20天」这类名字
    if (/\d/.test(t)) return true;
    if (/[零一二三四五六七八九十百千万两]\s*(天|日|个点|个百分点|%|美元|块|元|倍|成)/.test(t)) return true;
    if (/[0-9零一二三四五六七八九十百千两]+\s*(周|个月|月|年|季)/.test(t)) return true;
    return false;
  }
  function vrDirectionOk(point, sign) {
    var words = [];
    PS_DIR.forEach(function (d) { if (d[0].test(String(point))) words.push(d[1]); });
    if (!words.length) return true;
    return words.every(function (w) { return w === sign; });
  }
  function vrOutcomeLabel(outcome) {
    return { confirmed: '兑现', refuted: '被推翻', expired_flat: '周期到、价格没走出方向', expired_unmet: '周期到、等的情况没出现' }[outcome] || String(outcome || '');
  }
  function vrStanceLabel(s) {
    return PS_STANCE_LABELS[s] || String(s || '');
  }

  /** 系统提示词：原样使用（04 §7） */
  function vrSystemPrompt() {
    return [
      '你是 MyDesk 的复盘助手。用户在 t0_date 写下了一个判断，当时就写好了判定规则。现在到了 t1_date，系统已经按他自己的规则得出了结论，写在 verdict 里。',
      '',
      '结论已经定了。你不判断，也不许改。你只做三件事：',
      '',
      '一、recap：用一句话说这次发生了什么，像一个话很少的顾问。',
      '二、divergence：从 divergence_candidates 里挑出判断和现实开始分开的那一条，用一句话说清楚。',
      '三、lessons：从 lesson_candidates 里挑出这次最值得记住的 0 到 2 条。',

  /** 卷宗：模型只看到格式化好的文字，不看到原始数值（04 §3） */
  function vrUserPrompt(dossier) {
    var d = dossier || {};
    var L = [];
    var hz = d.horizon || {};
    L.push('标的：' + (d.target || '该标的') + '（只有代码侧的规则和日期，没有公司名和代码）');
    L.push('判断写于：' + (d.t0_date || '—') + ' · 这次复核看到的最新可用日：' + (d.t1_date || '—')
      + ' · 判断的时间窗到：' + (d.window_end || '—') + ' · 已经过了 ' + (d.elapsed_days == null ? '—' : d.elapsed_days) + ' 天');
    L.push('周期：' + (hz.days == null ? '没写周期' : hz.days + ' 天（来自' + (hz.from || '未知') + (hz.quote ? '「' + hz.quote + '」' : '') + '）'));
    L.push('用户立场：' + (d.user_stance_label || vrStanceLabel(d.user_stance)));
    L.push('');
    L.push('用户原话：');
    L.push('"""');
    L.push(String(d.user_text || ''));
    L.push('"""');
    L.push('');
    var v = d.verdict || {};
    L.push('【系统已经得出的结论 · 你不许改】');
    L.push('结论：' + vrOutcomeLabel(v.outcome));
    L.push('标题：' + (v.title || ''));
    L.push('由什么决定：' + (v.decided_by || '—') + '（' + (v.decided_on || '—') + '）');
    L.push('');
    if ((d.rules || []).length) {
      L.push('【用户写下的规则】');
      d.rules.forEach(function (r) {
        L.push('- ' + r.id + '：' + r.label + '｜' + r.role_label + (r.role_inferred ? '（系统按原话推断）' : '')
          + '｜保存当天' + r.at_t0 + '｜' + (r.crossed_on ? '窗口内 ' + r.crossed_on + ' 成立' : '窗口内未成立'));
      });
      L.push('');
    }
    if ((d.targets || []).length) {
      L.push('【用户记下的目标价】');
      d.targets.forEach(function (t) {
        L.push('- ' + t.id + '：' + t.label + '｜' + t.role_label + '｜' + (t.hit_on ? t.hit_on + ' 达到' : '未达到'));
      });
      L.push('');
    }
    if ((d.moves || []).length) {
      L.push('【背景数字 · 只供你理解，不许写进输出】');
      d.moves.forEach(function (m) {
        L.push('- ' + m.label + '：' + (m.text != null ? m.text : (m.from + ' → ' + m.to)));
      });
      L.push('');
    }
    L.push('【divergence_candidates】');
    if ((d.divergence_candidates || []).length) {
      d.divergence_candidates.forEach(function (c) {
        L.push(c.i + '. ' + c.date + ' · ' + c.text);
      });
    } else { L.push('（没有候选，divergence 给 null）'); }
    L.push('');
    L.push('【lesson_candidates】');
    L.push((d.lesson_candidates || []).length ? d.lesson_candidates.join('、') : '（空，lessons 给空数组）');
    return L.join('\n');
  }

  /** 校验流水线（04 §11）：任一字段不过只作废那一个字段，其余照用 */
  function vrValidate(parsed, dossier) {
    var d = dossier || {};
    var out = { recap: null, divergence: null, lessons: [], struck: { recap: false, divergence: false, lessons: 0 }, log: [] };
    var p = (parsed && typeof parsed === 'object') ? parsed : null;
    if (!p) { out.struck.recap = true; out.struck.divergence = true; out.log.push('模型没有返回 JSON 对象'); return out; }

    // ── recap：C1 长度、C2 数字、C3 禁词 ──
    var recap = typeof p.recap === 'string' ? p.recap.trim() : '';
    if (!recap || recap.length > 40) { out.struck.recap = true; out.log.push('recap 长度不合格'); }
    else if (vrBadNumber(recap)) { out.struck.recap = true; out.log.push('recap 含数字'); }
    else if (vrLintHit(recap)) { out.struck.recap = true; out.log.push('recap 命中禁词'); }
    else out.recap = recap;

    // ── divergence：D1 pick、D2 长度、D3 数字、D4 禁词、D5 方向 ──
    var cands = d.divergence_candidates || [];
    var dv = p.divergence;
    if (dv && typeof dv === 'object') {
      var pick = dv.pick;
      var hit = null;
      for (var i = 0; i < cands.length; i++) if (cands[i].i === pick) hit = cands[i];
      var point = typeof dv.point === 'string' ? dv.point.trim() : '';
      if (!hit) { out.struck.divergence = true; out.log.push('divergence.pick 不在候选里'); }
      else if (!point || point.length > 25) { out.struck.divergence = true; out.log.push('divergence.point 长度不合格'); }
      else if (vrBadNumber(point)) { out.struck.divergence = true; out.log.push('divergence 含数字'); }
      else if (vrLintHit(point)) { out.struck.divergence = true; out.log.push('divergence 命中禁词'); }
      else if (!vrDirectionOk(point, hit.sign)) { out.struck.divergence = true; out.log.push('divergence 方向与被挑候选矛盾'); }
      else out.divergence = { pick: pick, date: hit.date, point: point };
    } else {
      out.struck.divergence = true;
      out.log.push('divergence 为空');
    }

    // ── lessons：L1 在候选里、L2 去重、L3 最多 2 条 ──
    var allow = d.lesson_candidates || [];
    var raw = Array.isArray(p.lessons) ? p.lessons : [];
    var seen = {};
    raw.forEach(function (k) {
      var kind = String(k || '');
      if (!kind || allow.indexOf(kind) < 0) { out.struck.lessons += 1; return; }
      if (seen[kind]) { out.struck.lessons += 1; return; }
      if (out.lessons.length >= 2) { out.struck.lessons += 1; return; }
      seen[kind] = true;
      out.lessons.push(kind);
    });
    return out;
  }

  /** 代码兜底开场白（04 §8.1）—— 没模型时复盘同样完整 */
  function vrRuleRecap(dossier) {
    var d = dossier || {};
    var v = d.verdict || {};
    var kind = v.decided_kind || null;
    var role = v.decided_role || null;
    var stance = d.user_stance;
    var byRule = kind === 'condition' || kind === 'target';
    if (v.outcome === 'refuted') {
      if (byRule) return role === 'falsifier' ? '你当时写的认错线，市场走到了。' : '你当时写下的规则，被市场走到了。';
      return stance === 'neutral' ? '周期走完了，价格走出了方向。' : '周期走完了，价格去了另一边。';
    }
    if (v.outcome === 'confirmed') {
      if (byRule) return role === 'trigger' ? '你当时等的情况，市场走到了。' : '你当时说的验证条件，市场走到了。';
      return stance === 'neutral' ? '周期走完了，价格一直在正常波动范围里。' : '周期走完了，价格朝你判断的方向走了。';
    }
    if (v.outcome === 'expired_flat') return '周期走完了，价格基本没动。';
    if (v.outcome === 'expired_unmet') return '周期走完了，你等的情况没有出现。';
    return '这次复核到这里。';
  }

  function vrLessonText(dossier, kind) {
    var list = (dossier && dossier.lesson_texts) || [];
    for (var i = 0; i < list.length; i++) if (list[i].kind === kind) return list[i].text;
    return null;
  }

  /** 规则版：开场白用 §8.1，分歧点用最早的候选，经验按 §6 优先级取前 2 条 */
  function ruleVerdictRecap(dossier, reason) {
    var d = dossier || {};
    var cands = d.divergence_candidates || [];
    var first = cands.length ? cands[0] : null;
    var kinds = (d.lesson_candidates || []).slice(0, 2);
    var lessons = [];
    kinds.forEach(function (k) {
      var t = vrLessonText(d, k);
      if (t) lessons.push({ kind: k, text: t });
    });
    return {
      ok: true, version: VR_VERSION, source: 'rule', via: null, model: null,
      fallback_reason: reason || '', notice: '',
      recap: vrRuleRecap(d),
      divergence: first ? { date: first.date, text: first.text } : null,
      lessons: lessons, struck_count: 0, log: [],
    };
  }

  function vrFinalize(dossier, v, meta) {
    var d = dossier || {};
    var out = {
      ok: true, version: VR_VERSION, source: meta.source, via: meta.via || null, model: meta.model || null,
      fallback_reason: meta.fallback_reason || '', notice: meta.notice || '',
      recap: v.recap || vrRuleRecap(d),
      divergence: null, lessons: [], struck_count: (v.struck && (Number(v.struck.recap) + Number(v.struck.divergence) + (v.struck.lessons || 0))) || 0,
      log: v.log || [],
    };
    if (v.divergence) out.divergence = { date: v.divergence.date, text: v.divergence.point };
    else {
      var cands = d.divergence_candidates || [];
      out.divergence = cands.length ? { date: cands[0].date, text: cands[0].text } : null;
    }
    var kinds = v.lessons.slice();
    // L4：代码已经验证过前提成立的经验，不能因为模型没挑就不给用户看
    if (!kinds.length && (d.lesson_candidates || []).length) kinds = d.lesson_candidates.slice(0, 1);
    kinds.slice(0, 2).forEach(function (k) {
      var t = vrLessonText(d, k);
      if (t) out.lessons.push({ kind: k, text: t });
    });
    return out;
  }

  /**
   * 主入口。控制流与 plainSpeak() 相同：本地配置 → 中转（不通再直连）→ 服务端配置 → 规则。
   * 不是合法 JSON 时重试一次（temperature 0），仍不行退规则版；任何异常都退规则版，永不 reject。
   */
  function verdictRecap(dossier, opts) {
    var o = opts || {};
    try {
      if (o.forceRule) return Promise.resolve(ruleVerdictRecap(dossier, '已指定规则版'));
      var local = readConfig(o.storage);
      var base = [
        { role: 'system', content: vrSystemPrompt() },
        { role: 'user', content: vrUserPrompt(dossier) },
      ];
      var useDirect = o.prefer === 'direct';
      var send = function (cfg, messages, temperature) {
        var oo = {};
        Object.keys(o).forEach(function (k) { oo[k] = o[k]; });
        oo.temperature = temperature;
        var p = useDirect ? chatDirect(messages, cfg, oo) : chat(messages, cfg, oo);
        return p.catch(function (e) {
          if (e && e.code === 'NO_RELAY' && !useDirect && cfg.apiKey) return chatDirect(messages, cfg, oo);
          throw e;
        });
      };
      var judge = function (res) {
        var parsed = extractJson(res && res.content);
        return parsed ? vrValidate(parsed, dossier) : null;
      };
      var attempt = function (cfg) {
        return send(cfg, base, 0.3).then(function (res) {
          var v = judge(res);
          if (v) return vrFinalize(dossier, v, { source: 'ai', via: res.via, model: res.model });
          var retry = base.concat([{ role: 'user', content: '上次输出不是合法 JSON，只返回 JSON 对象。' }]);
          return send(cfg, retry, 0).then(function (res2) {
            var v2 = judge(res2);
            return v2 ? vrFinalize(dossier, v2, { source: 'ai', via: res2.via, model: res2.model })
              : ruleVerdictRecap(dossier, '模型两次都没有返回合法 JSON');
          });
        });
      };
      var safe = function (p) {
        return p.catch(function (e) { return ruleVerdictRecap(dossier, (e && e.message) || 'AI 调用失败'); });
      };
      if (cfgComplete(local)) return safe(attempt(local));
      return safe(probeServer(o).then(function (srv) {
        if (srv && srv.configured) {
          return attempt({ baseUrl: srv.baseUrl || local.baseUrl, model: srv.model || local.model, apiKey: '' });
        }
        var r = ruleVerdictRecap(dossier, '还没有配置 AI 接口');
        r.needsSetup = true;
        return r;
      }));
    } catch (e) {
      return Promise.resolve(ruleVerdictRecap(dossier, '复盘出错：' + (e && e.message)));
    }
  }

  /* ══ 可复算的常见技术信号 ═══════════════════════════════════════════════

  var TECH_SIGNAL_VERSION = 'technical-signals-v1';
  var TECH_SIGNAL_DEFINITIONS = {

  function techNum(v) { return typeof v === 'number' && Number.isFinite(v); }
  function techRound(v) { return techNum(v) ? Number(v.toFixed(4)) : null; }
  function techMa(values, index, period) {
    if (index < period - 1) return null;
    var sum = 0;
    for (var i = index - period + 1; i <= index; i += 1) {
      if (!techNum(values[i])) return null;
      sum += values[i];
    }
    return sum / period;
  }
  function techEma(values, period) {
    var out = new Array(values.length).fill(null), seed = [], prev = null, k = 2 / (period + 1);
    values.forEach(function (v, i) {
      if (!techNum(v)) return;
      if (prev == null) {
        seed.push(v);
        if (seed.length === period) {
          prev = seed.reduce(function (a, b) { return a + b; }, 0) / period;
          out[i] = prev;
        }
      } else {
        prev = v * k + prev * (1 - k);
        out[i] = prev;
      }
    });
    return out;
  }
  function techRsi(values, period) {
    var out = new Array(values.length).fill(null);
    if (values.length <= period) return out;
    var gains = 0, losses = 0;
    for (var i = 1; i <= period; i += 1) {
      var d = values[i] - values[i - 1];
      gains += Math.max(d, 0); losses += Math.max(-d, 0);
    }
    var avgGain = gains / period, avgLoss = losses / period;
    var value = function () { return avgLoss === 0 ? (avgGain === 0 ? 50 : 100) : 100 - 100 / (1 + avgGain / avgLoss); };
    out[period] = value();
    for (var j = period + 1; j < values.length; j += 1) {
      var x = values[j] - values[j - 1];
      avgGain = (avgGain * (period - 1) + Math.max(x, 0)) / period;
      avgLoss = (avgLoss * (period - 1) + Math.max(-x, 0)) / period;
      out[j] = value();
    }
    return out;
  }

  function buildTechnicalSignalBundle(inputBars, t0Date) {
    var bars = (Array.isArray(inputBars) ? inputBars : []).filter(function (b) {
      return b && b.is_closed !== false && techNum(Number(b.close));
    }).map(function (b) {
      var close = Number(b.close);
      return {
        date: String(b.time || b.date || '').slice(0, 10),
        open: techNum(Number(b.open)) ? Number(b.open) : close,
        high: techNum(Number(b.high)) ? Number(b.high) : close,
        low: techNum(Number(b.low)) ? Number(b.low) : close,
        close: close,
        volume: techNum(Number(b.volume)) ? Number(b.volume) : null,
      };
    }).filter(function (b) { return b.date; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
    var closes = bars.map(function (b) { return b.close; });

    var dif = closes.map(function (_, i) { return techNum(ema12[i]) && techNum(ema26[i]) ? ema12[i] - ema26[i] : null; });
    var dea = techEma(dif, 9);
    var rsi14 = techRsi(closes, 14);
    var rows = bars.map(function (b, i) {
      var ma5 = techMa(closes, i, 5), ma10 = techMa(closes, i, 10), ma20 = techMa(closes, i, 20);
      var ma50 = techMa(closes, i, 50), ma60 = techMa(closes, i, 60), ma200 = techMa(closes, i, 200);

    var signals = [], seen = {};
    function add(id, label, row, bias, family, values) {

        if (cross(prev.ma10, prev.ma20, cur.ma10, cur.ma20, false)) add('ma10_ma20_death', 'MA10/MA20 死叉', cur, 'bearish', 'trend');
        if (cross(prev.ma50, prev.ma200, cur.ma50, cur.ma200, true)) add('ma50_ma200_golden', 'MA50/MA200 黄金交叉', cur, 'bullish', 'trend');
        if (cross(prev.ma50, prev.ma200, cur.ma50, cur.ma200, false)) add('ma50_ma200_death', 'MA50/MA200 死亡交叉', cur, 'bearish', 'trend');
        if (cross(prev.close, prev.ma20, cur.close, cur.ma20, true)) add('price_cross_ma20_up', '收盘上穿 MA20', cur, 'bullish', 'trend');
        if (cross(prev.close, prev.ma20, cur.close, cur.ma20, false)) add('price_cross_ma20_down', '收盘下穿 MA20', cur, 'bearish', 'trend');
        if (cross(prev.macd_dif, prev.macd_dea, cur.macd_dif, cur.macd_dea, true)) add('macd_golden', 'MACD 金叉', cur, 'bullish', 'momentum');
        if (cross(prev.macd_dif, prev.macd_dea, cur.macd_dif, cur.macd_dea, false)) add('macd_death', 'MACD 死叉', cur, 'bearish', 'momentum');
        if (techNum(prev.rsi14) && techNum(cur.rsi14) && prev.rsi14 >= 30 && cur.rsi14 < 30) add('rsi_enter_oversold', 'RSI14 进入超卖区', cur, 'bearish', 'momentum', {rsi14:techRound(cur.rsi14)});
        if (techNum(prev.rsi14) && techNum(cur.rsi14) && prev.rsi14 <= 30 && cur.rsi14 > 30) add('rsi_leave_oversold', 'RSI14 离开超卖区', cur, 'bullish', 'momentum', {rsi14:techRound(cur.rsi14)});

        if (techNum(prev.rsi14) && techNum(cur.rsi14) && prev.rsi14 >= 70 && cur.rsi14 < 70) add('rsi_leave_overbought', 'RSI14 离开超买区', cur, 'bearish', 'momentum', {rsi14:techRound(cur.rsi14)});
        var volNow = techNum(cur.volume) && techNum(cur.volume_ma20) && cur.volume_ma20 > 0 && cur.volume >= cur.volume_ma20 * 1.5;

        var priorUp = i >= 4 && bars[i - 1].close > bars[i - 4].close;

        var shape = {body_pct:techRound(body/range*100),upper_shadow_pct:techRound(upper/range*100),lower_shadow_pct:techRound(lower/range*100)};
        if (doji) add('doji', '近似十字星', cur, 'neutral', 'candlestick', shape);
        if (upperPin) add('upper_pin', '长上影 / 避雷针', cur, 'bearish', 'candlestick', shape);
        if (upperPin && priorUp) add('shooting_star', '射击之星候选', cur, 'bearish', 'candlestick', shape);
        if (upperPin && priorDown) add('inverted_hammer', '倒锤头候选', cur, 'bullish', 'candlestick', shape);

        if (prev.close > prev.open && cur.close < cur.open && cur.open >= prev.close && cur.close <= prev.open) add('bearish_engulfing', '看跌吞没', cur, 'bearish', 'candlestick');

  }

  /* ══ thesis 行情观察器 ═══════════════════════════════════════════════════
     与「市场裁决」不同：这里专门处理没有被量化条件完整覆盖的定性 thesis。
     模型会看到 T0 之后真实的日线与 MA5/10/20/60 路径，判断市场结构是否已经

  var TR_VERSION = 'thesis-observer-v4';
  var TR_STATUSES = ['waiting', 'review_now', 'invalidated', 'insufficient_data'];

  function trSystemPrompt() {

  function trUserPrompt(dossier) {
    var d = dossier || {};
    return [
      '请按系统规则观察下面这份卷宗。不要补充卷宗外的信息。',
      JSON.stringify(d),
    ].join('\n');
  }

  function trDateSet(dossier) {
    var set = {};
    (dossier && dossier.available_dates || []).forEach(function (d) { set[String(d)] = true; });
    return set;
  }

  function trValidate(parsed, dossier) {
    if (!parsed || typeof parsed !== 'object') return null;
    var status = String(parsed.status || '');
    if (TR_STATUSES.indexOf(status) < 0) return null;

    var allowed = trDateSet(dossier);
    var date = function (v) {
      if (v == null || v === '') return null;
      var s = String(v);
      return allowed[s] ? s : null;
    };

    (Array.isArray(parsed.evidence_dates) ? parsed.evidence_dates : []).forEach(function (v) {
